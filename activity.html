<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Completed work — SWL HR</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <aside class="side" id="sidebar"></aside>

  <div class="main" id="main" data-theme="light">
    <header class="bar">
      <div><h1>Completed work</h1></div>
      <div style="display:flex;align-items:center;gap:18px">
        <div class="toggle">
          <button class="on" data-t="light" type="button">Light</button>
          <button data-t="dark" type="button">Dark</button>
        </div>
        <div class="s" id="header-date"></div>
      </div>
    </header>

    <section class="view">
      <div class="card">
        <div class="card-h"><h3>Activity log</h3><span id="summary">—</span></div>
        <div class="tools">
          <select class="inp" id="person-filter"><option value="">Everyone</option></select>
          <select class="inp" id="module-filter"><option value="">All modules</option></select>
          <button class="gh" id="export-btn" type="button">Export CSV</button>
        </div>
        <table>
          <thead><tr><th>Date</th><th>Module</th><th>Item</th><th>By</th><th>Days elapsed</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="foot">Every module writes here when something is finished — a task closed, a review completed, a document generated. This is the answer to "what have we actually done" without reconstructing it from memory.</div>
      </div>
    </section>
  </div>
</div>

<script type="module">
import { requireAuth } from './auth.js';
import { initShell } from './app.js';
import { db } from './firebaseconfig.js';
import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const profile = await requireAuth();
if (!profile) throw new Error('not authenticated');
initShell('completed', profile);

document.getElementById('header-date').textContent =
  new Date().toLocaleDateString('en-US', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();

let entries = [];
let staff = [];

async function loadStaff() {
  const snap = await getDocs(collection(db, 'users'));
  staff = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  document.getElementById('person-filter').innerHTML =
    '<option value="">Everyone</option>' + staff.map((s) => `<option value="${s.id}">${s.name}</option>`).join('');
}

function staffName(uid) {
  const s = staff.find((x) => x.id === uid);
  return s ? s.name : uid;
}

async function loadActivity() {
  const snap = await getDocs(collection(db, 'activity'));
  entries = snap.docs
    .map((d) => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (b.entered_at?.seconds || 0) - (a.entered_at?.seconds || 0));

  const modules = [...new Set(entries.map((e) => e.module))].sort();
  document.getElementById('module-filter').innerHTML =
    '<option value="">All modules</option>' + modules.map((m) => `<option value="${m}">${m}</option>`).join('');

  render();
}

function render() {
  const personFilter = document.getElementById('person-filter').value;
  const moduleFilter = document.getElementById('module-filter').value;

  const visible = entries.filter((e) => {
    if (personFilter && e.entered_by !== personFilter) return false;
    if (moduleFilter && e.module !== moduleFilter) return false;
    return true;
  });

  document.getElementById('summary').textContent = `${visible.length} of ${entries.length}`;

  document.getElementById('rows').innerHTML = visible.length ? visible.map((e) => {
    const date = e.entered_at?.seconds ? new Date(e.entered_at.seconds * 1000) : null;
    const days = date ? Math.max(0, Math.round((Date.now() - date.getTime()) / 86400000)) : '—';
    return `
      <tr>
        <td class="mono">${date ? date.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }) : '—'}</td>
        <td class="dim">${e.module}</td>
        <td>${e.item}</td>
        <td class="mono dim">${staffName(e.entered_by)}</td>
        <td class="mono">${days}</td>
      </tr>
    `;
  }).join('') : '<tr><td colspan="5" class="dim">Nothing logged yet.</td></tr>';
}

function exportCsv() {
  const rows = [['Date', 'Module', 'Item', 'Entered by']];
  entries.forEach((e) => {
    const date = e.entered_at?.seconds ? new Date(e.entered_at.seconds * 1000).toISOString().slice(0, 10) : '';
    rows.push([date, e.module, e.item, staffName(e.entered_by)]);
  });
  const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `activity-log-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('person-filter').addEventListener('change', render);
document.getElementById('module-filter').addEventListener('change', render);
document.getElementById('export-btn').addEventListener('click', exportCsv);

await loadStaff();
await loadActivity();
</script>
</body>
</html>

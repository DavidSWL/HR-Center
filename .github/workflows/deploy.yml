name: Deploy to Firebase

# Runs automatically every time files are uploaded/committed to main.
# Deploys the security rules and the app together, so the rules can
# never lag behind whatever the site is actually running.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-key.json"

      - name: Deploy rules and hosting
        run: firebase deploy --only firestore:rules,storage:rules,hosting --project hr-center-8ad6f --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Budget — SWL HR</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <aside class="side" id="sidebar"></aside>

  <div class="main" id="main" data-theme="light">
    <header class="bar">
      <div><h1>HR Budget</h1></div>
      <div style="display:flex;align-items:center;gap:18px">
        <div class="toggle">
          <button class="on" data-t="light" type="button">Light</button>
          <button data-t="dark" type="button">Dark</button>
        </div>
        <div class="s" id="header-date"></div>
      </div>
    </header>

    <section class="view">
      <div class="card" style="margin-bottom:16px">
        <div class="card-h"><h3>Add expense</h3></div>
        <div class="card-body">
          <form id="expense-form">
            <div class="frow">
              <div class="field">
                <label class="f-lab" for="exp-category">Category</label>
                <input class="f-in" id="exp-category" list="exp-category-options" required autocomplete="off" placeholder="e.g. Christmas Lunch">
                <datalist id="exp-category-options">
                  <option value="Christmas Lunch">
                  <option value="Christmas Party">
                  <option value="Employee Gifts">
                  <option value="Awards">
                  <option value="HR Day">
                  <option value="Women's Day">
                  <option value="Supplies">
                </datalist>
              </div>
              <div class="field">
                <label class="f-lab" for="exp-amount">Amount ($)</label>
                <input class="f-in" id="exp-amount" type="number" step="0.01" min="0" required>
              </div>
              <div class="field">
                <label class="f-lab" for="exp-date">Date</label>
                <input class="f-in" id="exp-date" type="date" required>
              </div>
            </div>
            <div class="field">
              <label class="f-lab" for="exp-note">Note (optional)</label>
              <input class="f-in" id="exp-note" placeholder="e.g. 14 people, Olive Garden">
            </div>
            <button type="submit" class="gh solid">Add expense</button>
          </form>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <div class="card-h"><h3>Spend by category</h3><span id="range-label">—</span></div>
        <div class="card-body" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding-top:0">
          <div class="field" style="margin:0">
            <label class="f-lab" for="range-start">From</label>
            <input class="f-in" id="range-start" type="date">
          </div>
          <div class="field" style="margin:0">
            <label class="f-lab" for="range-end">To</label>
            <input class="f-in" id="range-end" type="date">
          </div>
          <button class="gh" id="range-apply-btn" type="button">Apply</button>
          <button class="gh" id="range-ytd-btn" type="button">This year</button>
        </div>
        <div id="category-rows"></div>
        <div class="foot" id="total-line">—</div>
      </div>

      <div class="card">
        <div class="card-h"><h3>Expenses</h3><span id="rows-summary">—</span></div>
        <table>
          <thead><tr><th>Date</th><th>Category</th><th>Note</th><th>Amount</th><th>Entered by</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="legend" id="empty-state" hidden><span>No expenses in this date range.</span></div>
      </div>
    </section>
  </div>
</div>

<script type="module">
import { requireAuth } from './auth.js';
import { initShell, showToast, formatDate } from './app.js';
import { db } from './firebaseconfig.js';
import {
  collection, getDocs, doc, deleteDoc, addDoc, serverTimestamp,
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const profile = await requireAuth();
if (!profile) throw new Error('not authenticated');
initShell('budget', profile);

// Mirrors tasks.html's canDeleteTasks -- same two people can remove a
// misentered line item; everyone on HR staff can add one.
const canDelete = profile.role === 'david' || profile.role === 'tanya';

document.getElementById('header-date').textContent =
  new Date().toLocaleDateString('en-US', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();

let staff = [];
let expenses = [];

async function loadStaff() {
  const snap = await getDocs(collection(db, 'users'));
  staff = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
}
function staffName(uid) {
  const s = staff.find((x) => x.id === uid);
  return s ? s.name : uid;
}

async function loadExpenses() {
  const snap = await getDocs(collection(db, 'hr_budget_items'));
  expenses = snap.docs
    .map((d) => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  render();
}

function currentYearRange() {
  const y = new Date().getFullYear();
  return { start: `${y}-01-01`, end: `${y}-12-31` };
}

function render() {
  const start = document.getElementById('range-start').value;
  const end = document.getElementById('range-end').value;
  const visible = expenses.filter((e) => (!start || e.date >= start) && (!end || e.date <= end));

  document.getElementById('range-label').textContent = start && end ? `${formatDate(start)} – ${formatDate(end)}` : 'All dates';

  const byCategory = {};
  visible.forEach((e) => { byCategory[e.category] = (byCategory[e.category] || 0) + (e.amount || 0); });
  const pairs = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
  const max = pairs.length ? pairs[0][1] : 1;
  document.getElementById('category-rows').innerHTML = pairs.length ? pairs.map(([cat, amt]) => `
    <div class="rowbar">
      <div class="l">${cat}</div>
      <div class="trk"><i style="width:${(amt / max) * 100}%"></i></div>
      <div class="mono" style="text-align:right">$${amt.toLocaleString('en-US', { minimumFractionDigits: 2 })}</div>
    </div>
  `).join('') : '<div class="card-body dim">No expenses in this date range.</div>';

  const total = visible.reduce((sum, e) => sum + (e.amount || 0), 0);
  document.getElementById('total-line').textContent =
    `Total: $${total.toLocaleString('en-US', { minimumFractionDigits: 2 })} across ${visible.length} expense${visible.length === 1 ? '' : 's'}, ${start && end ? `${formatDate(start)} – ${formatDate(end)}` : 'all dates'}.`;

  document.getElementById('rows-summary').textContent = `${visible.length} of ${expenses.length}`;
  document.getElementById('empty-state').hidden = visible.length > 0;
  document.getElementById('rows').innerHTML = visible.map((e) => `
    <tr>
      <td class="mono">${formatDate(e.date)}</td>
      <td>${e.category}</td>
      <td class="dim">${e.note || '—'}</td>
      <td class="mono">$${(e.amount || 0).toLocaleString('en-US', { minimumFractionDigits: 2 })}</td>
      <td class="mono dim">${staffName(e.entered_by)}</td>
      <td>${canDelete ? `<button class="gh" data-id="${e.id}" type="button">Remove</button>` : ''}</td>
    </tr>
  `).join('');

  document.querySelectorAll('#rows button[data-id]').forEach((btn) => {
    btn.addEventListener('click', () => deleteExpense(btn.dataset.id));
  });
}

async function deleteExpense(id) {
  const e = expenses.find((x) => x.id === id);
  if (!e) return;
  if (!confirm(`Remove this expense?\n\n${e.category} — $${(e.amount || 0).toFixed(2)}`)) return;
  try {
    await deleteDoc(doc(db, 'hr_budget_items', id));
    showToast('Removed.');
    await loadExpenses();
  } catch (err) {
    console.error(err);
    showToast('Could not remove — ' + err.message, 'error');
  }
}

document.getElementById('expense-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await addDoc(collection(db, 'hr_budget_items'), {
      category: document.getElementById('exp-category').value.trim(),
      amount: parseFloat(document.getElementById('exp-amount').value),
      date: document.getElementById('exp-date').value,
      note: document.getElementById('exp-note').value.trim() || null,
      entered_by: profile.uid,
      entered_at: serverTimestamp(),
    });
    document.getElementById('expense-form').reset();
    document.getElementById('exp-date').value = new Date().toISOString().slice(0, 10);
    showToast('Expense added.');
    await loadExpenses();
  } catch (err) {
    console.error(err);
    showToast('Could not add — ' + err.message, 'error');
  }
});

document.getElementById('range-apply-btn').addEventListener('click', render);
document.getElementById('range-ytd-btn').addEventListener('click', () => {
  const { start, end } = currentYearRange();
  document.getElementById('range-start').value = start;
  document.getElementById('range-end').value = end;
  render();
});

document.getElementById('exp-date').value = new Date().toISOString().slice(0, 10);
const { start, end } = currentYearRange();
document.getElementById('range-start').value = start;
document.getElementById('range-end').value = end;

await loadStaff();
await loadExpenses();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance — SWL HR</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>.view-type-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}</style>
</head>
<body>

<div class="app">
  <aside class="side" id="sidebar"></aside>

  <div class="main" id="main" data-theme="light">
    <header class="bar">
      <div><h1>Attendance</h1></div>
      <div style="display:flex;align-items:center;gap:18px">
        <div class="toggle">
          <button class="on" data-t="light" type="button">Light</button>
          <button data-t="dark" type="button">Dark</button>
        </div>
        <div class="s" id="header-date"></div>
      </div>
    </header>

    <section class="view">

      <div class="card" style="margin-bottom:16px">
        <div class="card-h"><h3>Quick entry</h3><span>No point system — just what happened and how often</span></div>
        <div class="card-body">
          <form id="entry-form">
            <div class="frow">
              <div class="field">
                <label class="f-lab" for="emp-select-search">Employee</label>
                <input class="f-in" id="emp-select-search" list="emp-select-opts" placeholder="Type a name…" autocomplete="off">
                <datalist id="emp-select-opts"></datalist>
                <input type="hidden" id="emp-select">
              </div>
              <div class="field">
                <label class="f-lab" for="occ-date">Date</label>
                <input class="f-in" id="occ-date" type="date" required>
              </div>
            </div>
            <div class="field">
              <label class="f-lab">Type</label>
              <div style="display:flex;gap:8px">
                <button type="button" class="gh type-btn on" data-type="ncns" style="flex:1">No Call No Show</button>
                <button type="button" class="gh type-btn" data-type="other" style="flex:1">Other</button>
              </div>
            </div>
            <div class="field" id="reason-field">
              <label class="f-lab" for="reason">Reason (required for Other)</label>
              <input class="f-in" id="reason">
            </div>
            <button type="submit" class="gh solid">Save &amp; clear</button>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-h"><h3>Occurrence log</h3><span id="log-summary">—</span></div>
        <div class="tools">
          <input class="inp" id="search" placeholder="Search employee" style="min-width:190px">
          <select class="inp" id="type-filter">
            <option value="">All types</option>
            <option value="ncns">No Call No Show</option>
            <option value="other">Other</option>
          </select>
        </div>
        <table>
          <thead><tr><th>Date</th><th>Employee</th><th>Type</th><th>Reason</th><th>Entered by</th></tr></thead>
          <tbody id="log-rows"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<!-- view/void occurrence modal -->
<div class="modal-overlay" id="view-overlay" hidden>
  <div class="modal" style="width:420px">
    <div class="modal-h">
      <h3>Occurrence</h3>
      <button class="modal-close" id="view-close" type="button">&times;</button>
    </div>
    <div class="modal-body">
      <div class="frow">
        <div class="field">
          <label class="f-lab" for="view-emp-search">Employee</label>
          <input class="f-in" id="view-emp-search" list="view-emp-opts" placeholder="Type a name…" autocomplete="off">
          <datalist id="view-emp-opts"></datalist>
          <input type="hidden" id="view-emp">
        </div>
        <div class="field"><label class="f-lab" for="view-date">Date</label><input class="f-in" id="view-date" type="date"></div>
      </div>
      <div class="field">
        <label class="f-lab">Type</label>
        <div style="display:flex;gap:8px">
          <button type="button" class="gh view-type-btn" data-type="ncns" style="flex:1">No Call No Show</button>
          <button type="button" class="gh view-type-btn" data-type="other" style="flex:1">Other</button>
        </div>
      </div>
      <div class="field" id="view-reason-field">
        <label class="f-lab" for="view-reason">Reason (required for Other)</label>
        <input class="f-in" id="view-reason">
      </div>
      <div class="field"><label class="f-lab">Entered by</label><div id="view-by" style="font-size:14px"></div></div>
    </div>
    <div class="modal-actions">
      <button type="button" class="gh" id="void-btn" style="color:var(--alertTx)">Mark as entered in error</button>
      <button type="button" class="gh" id="view-close-btn">Cancel</button>
      <button type="button" class="gh solid" id="view-save-btn">Save changes</button>
    </div>
  </div>
</div>

<script type="module">
import { requireAuth } from './auth.js';
import { initShell, showToast, formatDate } from './app.js';
import { db } from './firebaseconfig.js';
import {
  collection, doc, getDocs, addDoc, updateDoc, serverTimestamp,
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const profile = await requireAuth();
if (!profile) throw new Error('not authenticated');
initShell('attendance', profile);

document.getElementById('header-date').textContent =
  new Date().toLocaleDateString('en-US', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
document.getElementById('occ-date').value = new Date().toISOString().slice(0, 10);

let employees = [];
let occurrences = [];
let currentType = 'ncns';

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

// Type-ahead employee picker — a text input (with a datalist for
// narrowing by name as you type) paired with a hidden input holding the
// resolved employee id, so callers read `${id}`'s value exactly like
// they would a plain <select>'s value.
function wireEmpSearch(id, list) {
  const search = document.getElementById(`${id}-search`);
  const hidden = document.getElementById(id);
  if (!search || !hidden) return;
  const resolve = () => {
    const m = search.value.match(/\(([^()]+)\)\s*$/);
    const match = m && list.find((e) => e.id === m[1]);
    hidden.value = match ? match.id : '';
  };
  search.addEventListener('input', resolve);
  search.addEventListener('change', resolve);
}
function setEmpField(id, empId, list) {
  const emp = list.find((e) => e.id === empId);
  const search = document.getElementById(`${id}-search`);
  const hidden = document.getElementById(id);
  if (!search || !hidden) return;
  search.value = emp ? `${emp.first_name} ${emp.last_name} (${emp.id})` : '';
  hidden.value = emp ? emp.id : '';
}

async function loadEmployees() {
  const snap = await getDocs(collection(db, 'employees'));
  employees = snap.docs
    .map((d) => ({ id: d.id, ...d.data() }))
    .filter((e) => e.status !== 'terminated')
    .sort((a, b) => (a.first_name || '').localeCompare(b.first_name || ''));
  const empOptsHtml = employees
    .map((e) => `<option value="${escapeHtml(`${e.first_name} ${e.last_name} (${e.id})`)}">`)
    .join('');
  document.getElementById('emp-select-opts').innerHTML = empOptsHtml;
  document.getElementById('view-emp-opts').innerHTML = empOptsHtml;
  wireEmpSearch('emp-select', employees);
  wireEmpSearch('view-emp', employees);
}

async function loadOccurrences() {
  const snap = await getDocs(collection(db, 'attendance'));
  occurrences = snap.docs
    .map((d) => ({ id: d.id, ...d.data() }))
    .filter((o) => !o.voided) // entered-in-error occurrences stay in Firestore for audit, just out of view here
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  renderLog();
}

function empName(id) {
  const e = employees.find((x) => x.id === id);
  return e ? `${e.first_name} ${e.last_name}` : id;
}

function renderLog() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const typeFilter = document.getElementById('type-filter').value;

  const visible = occurrences.filter((o) => {
    if (typeFilter && o.type !== typeFilter) return false;
    if (q && !empName(o.emp_id).toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById('log-summary').textContent = `${visible.length} of ${occurrences.length}`;
  document.getElementById('log-rows').innerHTML = visible.length ? visible.map((o) => `
    <tr class="row-clickable" data-id="${o.id}" style="cursor:pointer">
      <td class="mono">${formatDate(o.date)}</td>
      <td>${empName(o.emp_id)}</td>
      <td>${o.type === 'ncns' ? '<span class="pill bad">No Call No Show</span>' : '<span class="pill mid">Other</span>'}</td>
      <td class="dim">${o.reason || '—'}</td>
      <td class="mono dim">${o.entered_by === profile.uid ? 'You' : o.entered_by}</td>
    </tr>
  `).join('') : '<tr><td colspan="5" class="dim">No occurrences match.</td></tr>';

  document.querySelectorAll('#log-rows tr[data-id]').forEach((tr) => {
    tr.addEventListener('click', () => openView(tr.dataset.id));
  });
}

let viewingId = null;
let viewType = 'ncns';
function setViewType(type) {
  viewType = type;
  document.querySelectorAll('.view-type-btn').forEach((b) => b.classList.toggle('on', b.dataset.type === type));
  document.getElementById('view-reason-field').style.display = type === 'other' ? 'block' : 'none';
}
function openView(id) {
  const o = occurrences.find((x) => x.id === id);
  if (!o) return;
  viewingId = id;
  setEmpField('view-emp', o.emp_id, employees);
  document.getElementById('view-date').value = o.date || '';
  setViewType(o.type === 'other' ? 'other' : 'ncns');
  document.getElementById('view-reason').value = o.reason || '';
  document.getElementById('view-by').textContent = o.entered_by === profile.uid ? 'You' : o.entered_by;
  document.getElementById('view-overlay').hidden = false;
}
function closeView() { document.getElementById('view-overlay').hidden = true; viewingId = null; }
document.getElementById('view-close').addEventListener('click', closeView);
document.getElementById('view-close-btn').addEventListener('click', closeView);
document.querySelectorAll('.view-type-btn').forEach((btn) => {
  btn.addEventListener('click', () => setViewType(btn.dataset.type));
});
document.getElementById('view-save-btn').addEventListener('click', async () => {
  if (!viewingId) return;
  const empId = document.getElementById('view-emp').value;
  if (!empId) { showToast('Select an employee.', 'error'); return; }
  const date = document.getElementById('view-date').value;
  if (!date) { showToast('Pick a date.', 'error'); return; }
  const reason = document.getElementById('view-reason').value.trim();
  if (viewType === 'other' && !reason) { showToast('A reason is required for Other.', 'error'); return; }
  try {
    await updateDoc(doc(db, 'attendance', viewingId), {
      emp_id: empId, date, type: viewType, reason: viewType === 'other' ? reason : '',
      edited_by: profile.uid, edited_at: serverTimestamp(),
    });
    showToast('Occurrence updated.');
    closeView();
    await loadOccurrences();
  } catch (err) {
    console.error(err);
    showToast('Could not save — ' + err.message, 'error');
  }
});
document.getElementById('void-btn').addEventListener('click', async () => {
  if (!viewingId) return;
  const o = occurrences.find((x) => x.id === viewingId);
  const ok = confirm(`Mark this occurrence (${empName(o.emp_id)}, ${formatDate(o.date)}) as entered in error? It disappears from the log and reports — it is not deleted, and stays available for audit if it's ever needed again.`);
  if (!ok) return;
  const reason = prompt('Reason (required):');
  if (!reason || !reason.trim()) { showToast('A reason is required — not voided.', 'error'); return; }
  try {
    await updateDoc(doc(db, 'attendance', viewingId), {
      voided: true, voided_reason: reason.trim(), voided_by: profile.uid, voided_at: serverTimestamp(),
    });
    showToast('Marked as entered in error.');
    closeView();
    await loadOccurrences();
  } catch (err) {
    console.error(err);
    showToast('Could not save — ' + err.message, 'error');
  }
});

document.querySelectorAll('.type-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-btn').forEach((b) => b.classList.remove('on'));
    btn.classList.add('on');
    currentType = btn.dataset.type;
    document.getElementById('reason-field').style.display = currentType === 'other' ? 'block' : 'none';
  });
});
document.getElementById('reason-field').style.display = 'none';

document.getElementById('entry-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const empId = document.getElementById('emp-select').value;
  if (!empId) { showToast('Select an employee.', 'error'); return; }
  const reason = document.getElementById('reason').value.trim();
  if (currentType === 'other' && !reason) {
    showToast('A reason is required for Other.', 'error');
    return;
  }
  try {
    await addDoc(collection(db, 'attendance'), {
      emp_id: empId,
      date: document.getElementById('occ-date').value,
      type: currentType,
      reason: currentType === 'other' ? reason : '',
      entered_by: profile.uid,
      entered_at: serverTimestamp(),
    });
    document.getElementById('reason').value = '';
    document.getElementById('occ-date').value = new Date().toISOString().slice(0, 10);
    showToast('Occurrence saved.');
    await loadOccurrences();
  } catch (err) {
    console.error(err);
    showToast('Could not save — ' + err.message, 'error');
  }
});

document.getElementById('search').addEventListener('input', renderLog);
document.getElementById('type-filter').addEventListener('change', renderLog);

await loadEmployees();
await loadOccurrences();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks — SWL HR</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <aside class="side" id="sidebar"></aside>

  <div class="main" id="main" data-theme="light">
    <header class="bar">
      <div><h1>Tasks</h1></div>
      <div style="display:flex;align-items:center;gap:18px">
        <div class="toggle">
          <button class="on" data-t="light" type="button">Light</button>
          <button data-t="dark" type="button">Dark</button>
        </div>
        <div class="s" id="header-date"></div>
      </div>
    </header>

    <section class="view">
      <div class="card" style="margin-bottom:16px">
        <div class="card-h"><h3>Assign a task</h3><span>One person, with enough context to start without asking</span></div>
        <div class="card-body">
          <form id="task-form">
            <div class="frow">
              <div class="field">
                <label class="f-lab" for="assignee">Assigned to</label>
                <select class="f-in" id="assignee" required></select>
              </div>
              <div class="field">
                <label class="f-lab" for="due-date">Due date</label>
                <input class="f-in" id="due-date" type="date" required>
              </div>
            </div>
            <div class="field">
              <label class="f-lab" for="instructions">What's needed / why</label>
              <textarea class="f-in" id="instructions" rows="3" style="resize:vertical" required></textarea>
            </div>
            <div class="field">
              <label class="f-lab" for="recurring">Recurring</label>
              <select class="f-in" id="recurring">
                <option value="none">One-time</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
                <option value="annual">Annual</option>
              </select>
            </div>
            <button type="submit" class="gh solid">Assign</button>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-h"><h3>Open tasks</h3><span id="tasks-summary">—</span></div>
        <div class="tools">
          <select class="inp" id="person-filter"><option value="">Everyone</option></select>
          <select class="inp" id="status-filter">
            <option value="open">Open</option>
            <option value="all">All, including completed</option>
          </select>
        </div>
        <div id="cal-view">
          <div class="tools" style="border-top:0">
            <button class="gh" id="cal-prev-btn" type="button">&larr;</button>
            <span id="cal-month-label" style="font-family:var(--display);font-size:15px;min-width:160px;text-align:center"></span>
            <button class="gh" id="cal-next-btn" type="button">&rarr;</button>
            <button class="gh" id="cal-today-btn" type="button">This month</button>
            <span class="dim" id="cal-progress" style="margin-left:auto;font-size:12.5px"></span>
          </div>
          <div class="trk" style="margin:0 16px 12px"><i id="cal-progress-bar"></i></div>
          <p class="dim" style="margin:-6px 16px 10px;font-size:11px">Purple-bordered entries are 30/60/90 reviews still due — click one to open Reviews. Terminated employees' reviews don't show here.</p>
          <div id="cal-grid"></div>
        </div>
        <table id="list-view" style="margin-top:16px">
          <thead><tr><th>Due</th><th>Assigned to</th><th>What's needed</th><th>Recurring</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<script type="module">
import { requireAuth } from './auth.js';
import { initShell, showToast, formatDate } from './app.js';
import { db } from './firebaseconfig.js';
import {
  collection, collectionGroup, doc, getDocs, setDoc, updateDoc, deleteDoc, addDoc, serverTimestamp,
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const profile = await requireAuth();
if (!profile) throw new Error('not authenticated');
initShell('tasks', profile);

// Only David or Tanya can remove a task outright — everyone else can
// complete or reassign, but the record itself is otherwise append-only.
const canDeleteTasks = profile.role === 'david' || profile.role === 'tanya';

document.getElementById('header-date').textContent =
  new Date().toLocaleDateString('en-US', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();

let staff = [];
let tasks = [];
let employees = [];
let pendingReviews = []; // 30/60/90 reviews still due — calendar only, not part of the tasks list/table below
const todayStr = new Date().toISOString().slice(0, 10);

function staffName(uid) {
  const s = staff.find((x) => x.id === uid);
  return s ? s.name : uid;
}
// Every linked-doc task opens back into Document Generator except a
// write-up, which lives on its own page (discipline.html), never inside
// Document Generator's own generator list.
function linkedDocUrl(type, docId, taskId) {
  if (type === 'writeup') return `discipline.html?doc=${docId}&task=${taskId}`;
  return `docgen.html?open=${type}&doc=${docId}&task=${taskId}`;
}
function empById(id) { return employees.find((e) => e.id === id); }

async function loadEmployees() {
  const snap = await getDocs(collection(db, 'employees'));
  employees = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
}

// 30/60/90 reviews don't create their own task record — they're
// computed due dates on the employee, same as everywhere else in this
// app. Surfacing them here means pulling from the reviews collection
// group directly rather than duplicating them into tasks (which would
// need to be kept in sync with completion/reassignment separately).
async function loadPendingReviews() {
  const snap = await getDocs(collectionGroup(db, 'reviews'));
  pendingReviews = snap.docs
    .map((d) => ({ id: d.id, empId: d.ref.parent.parent.id, ...d.data() }))
    .filter((r) => !r.review_completed && r.due_date && empById(r.empId)?.status !== 'terminated');
}

async function loadStaff() {
  const snap = await getDocs(collection(db, 'users'));
  staff = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  const options = staff.map((s) => `<option value="${s.id}">${s.name}</option>`).join('');
  document.getElementById('assignee').innerHTML = options;
  document.getElementById('person-filter').innerHTML = '<option value="">Everyone</option>' + options;
}

async function loadTasks() {
  const snap = await getDocs(collection(db, 'tasks'));
  tasks = snap.docs
    .map((d) => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (a.due_date || '').localeCompare(b.due_date || ''));
  render();
  renderCalendar();
}

function render() {
  const personFilter = document.getElementById('person-filter').value;
  const statusFilter = document.getElementById('status-filter').value;

  const visible = tasks.filter((t) => {
    if (statusFilter === 'open' && t.status === 'complete') return false;
    if (personFilter && t.assigned_to !== personFilter) return false;
    return true;
  });

  document.getElementById('tasks-summary').textContent = `${visible.length} of ${tasks.length}`;

  document.getElementById('rows').innerHTML = visible.length ? visible.map((t) => {
    const overdue = t.status !== 'complete' && t.due_date && t.due_date < todayStr;
    return `
      <tr>
        <td class="mono" style="${overdue ? 'color:var(--alertTx);font-weight:700' : ''}">${formatDate(t.due_date)}${overdue ? ' · overdue' : ''}</td>
        <td>${t.status === 'complete'
          ? staffName(t.assigned_to)
          : `<select class="inp assignee-select" data-id="${t.id}" style="height:32px;font-size:12.5px">${staff.map((s) => `<option value="${s.id}"${s.id === t.assigned_to ? ' selected' : ''}>${s.name}</option>`).join('')}</select>`}</td>
        <td>${t.status === 'complete' ? `<span style="text-decoration:line-through;color:var(--faint)">${t.instructions}</span>` : t.instructions}</td>
        <td class="dim">${t.recurring && t.recurring !== 'none' ? t.recurring : '—'}</td>
        <td style="text-align:right;white-space:nowrap">
          ${t.status === 'complete'
            ? '<span class="pill ok">Done</span>'
            : t.linked_doc_id
            ? `<button class="gh solid open-doc-btn" data-id="${t.id}" data-doc="${t.linked_doc_id}" data-type="${t.linked_doc_type}" type="button">Open document</button>`
            : `<button class="gh complete-btn" data-id="${t.id}" type="button">Complete</button>`}
          ${canDeleteTasks ? `<button class="gh delete-task-btn" data-id="${t.id}" type="button" style="color:var(--alertTx);margin-left:6px">Delete</button>` : ''}
        </td>
      </tr>
    `;
  }).join('') : '<tr><td colspan="5" class="dim">No tasks match.</td></tr>';

  document.querySelectorAll('.complete-btn').forEach((btn) => {
    btn.addEventListener('click', () => completeTask(btn.dataset.id));
  });
  document.querySelectorAll('.assignee-select').forEach((sel) => {
    sel.addEventListener('change', () => reassignTask(sel.dataset.id, sel.value));
  });
  document.querySelectorAll('.open-doc-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      window.location.href = linkedDocUrl(btn.dataset.type, btn.dataset.doc, btn.dataset.id);
    });
  });
  document.querySelectorAll('.delete-task-btn').forEach((btn) => {
    btn.addEventListener('click', () => deleteTask(btn.dataset.id));
  });
}

async function deleteTask(id) {
  const t = tasks.find((x) => x.id === id);
  if (!t) return;
  if (!confirm(`Delete this task? This cannot be undone.\n\n"${t.instructions}"`)) return;
  try {
    await deleteDoc(doc(db, 'tasks', id));
    showToast('Task deleted.');
    await loadTasks();
  } catch (err) {
    console.error(err);
    showToast('Could not delete — ' + err.message, 'error');
  }
}

async function completeTask(id) {
  try {
    await updateDoc(doc(db, 'tasks', id), {
      status: 'complete',
      completed_at: serverTimestamp(),
      completed_by: profile.uid,
    });
    await addDoc(collection(db, 'activity'), {
      module: 'tasks',
      item: tasks.find((t) => t.id === id)?.instructions || id,
      entered_by: profile.uid,
      entered_at: serverTimestamp(),
    });
    showToast('Task completed.');
    await loadTasks();
  } catch (err) {
    console.error(err);
    showToast('Could not update — ' + err.message, 'error');
  }
}

async function reassignTask(id, newUid) {
  const task = tasks.find((t) => t.id === id);
  if (!task || !newUid || newUid === task.assigned_to) return;
  try {
    await addDoc(collection(db, 'tasks', id, 'reassignments'), {
      from: task.assigned_to,
      to: newUid,
      entered_by: profile.uid,
      entered_at: serverTimestamp(),
    });
    await updateDoc(doc(db, 'tasks', id), { assigned_to: newUid });
    showToast('Task reassigned.');
    await loadTasks();
  } catch (err) {
    console.error(err);
    showToast('Could not reassign — ' + err.message, 'error');
  }
}

document.getElementById('person-filter').addEventListener('change', () => { render(); renderCalendar(); });
document.getElementById('status-filter').addEventListener('change', render);

// ---- Calendar view — month grid of due dates, so a deadline is a
// place on a calendar you can see coming, not just a row in a list.
// Shown above the list, always both on screen. Shows every task
// regardless of the Open/All filter above (open and complete together)
// since "how close are we this month" is exactly the open-vs-done
// comparison that filter would hide. ----

let calMonth = new Date();
calMonth.setDate(1);

document.getElementById('cal-prev-btn').addEventListener('click', () => {
  calMonth.setMonth(calMonth.getMonth() - 1);
  renderCalendar();
});
document.getElementById('cal-next-btn').addEventListener('click', () => {
  calMonth.setMonth(calMonth.getMonth() + 1);
  renderCalendar();
});
document.getElementById('cal-today-btn').addEventListener('click', () => {
  calMonth = new Date();
  calMonth.setDate(1);
  renderCalendar();
});

function renderCalendar() {
  const personFilter = document.getElementById('person-filter').value;
  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();

  document.getElementById('cal-month-label').textContent =
    calMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  const monthTasks = tasks.filter((t) => {
    if (personFilter && t.assigned_to !== personFilter) return false;
    if (!t.due_date) return false;
    const [y, m] = t.due_date.split('-').map(Number);
    return y === year && (m - 1) === month;
  });
  const doneCount = monthTasks.filter((t) => t.status === 'complete').length;
  document.getElementById('cal-progress').textContent = monthTasks.length
    ? `${doneCount} of ${monthTasks.length} due this month completed`
    : 'Nothing due this month';
  document.getElementById('cal-progress-bar').style.width = monthTasks.length
    ? `${Math.round((doneCount / monthTasks.length) * 100)}%` : '0%';

  const monthReviews = pendingReviews.filter((r) => {
    if (personFilter && r.assigned_to !== personFilter) return false;
    const [y, m] = r.due_date.split('-').map(Number);
    return y === year && (m - 1) === month;
  });

  const byDay = {};
  monthTasks.forEach((t) => {
    const day = Number(t.due_date.split('-')[2]);
    (byDay[day] = byDay[day] || []).push(t);
  });
  const reviewsByDay = {};
  monthReviews.forEach((r) => {
    const day = Number(r.due_date.split('-')[2]);
    (reviewsByDay[day] = reviewsByDay[day] || []).push(r);
  });

  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayY = new Date().getFullYear(), todayM = new Date().getMonth(), todayD = new Date().getDate();

  const dowHeader = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
    .map((d) => `<div style="padding:6px 8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);background:var(--panel);border-bottom:1px solid var(--line)">${d}</div>`).join('');

  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push('<div style="background:var(--panel);border:1px solid var(--line)"></div>');
  for (let day = 1; day <= daysInMonth; day++) {
    const isToday = year === todayY && month === todayM && day === todayD;
    const dayTasks = byDay[day] || [];
    const chips = dayTasks.map((t) => {
      const overdue = t.status !== 'complete' && t.due_date < todayStr;
      const style = t.status === 'complete'
        ? 'text-decoration:line-through;color:var(--faint)'
        : overdue ? 'color:var(--alertTx);font-weight:600' : 'color:var(--text)';
      return `<div class="cal-task" data-id="${t.id}" style="${style};cursor:pointer;font-size:11px;padding:2px 4px;margin-top:2px;border-left:2px solid ${t.status === 'complete' ? 'var(--faint)' : overdue ? 'var(--alertTx)' : 'var(--accent)'}" title="${escapeAttr(staffName(t.assigned_to))} — click to ${t.linked_doc_id ? 'open the document' : t.status === 'complete' ? 'reopen' : 'complete'}">${escapeAttr(t.instructions).slice(0, 40)}${t.instructions.length > 40 ? '…' : ''}</div>`;
    }).join('');
    const dayReviews = reviewsByDay[day] || [];
    const reviewChips = dayReviews.map((r) => {
      const emp = empById(r.empId);
      const overdue = r.due_date < todayStr;
      const name = emp ? `${emp.first_name} ${emp.last_name}` : r.empId;
      const label = `${r.milestone}-day review — ${name}`;
      return `<div class="cal-review" style="color:${overdue ? 'var(--alertTx)' : 'var(--text)'};font-weight:${overdue ? 600 : 400};cursor:pointer;font-size:11px;padding:2px 4px;margin-top:2px;border-left:2px solid #7C5CBF" title="${escapeAttr(staffName(r.assigned_to))} — click to open Reviews">${escapeAttr(label).slice(0, 40)}${label.length > 40 ? '…' : ''}</div>`;
    }).join('');
    cells.push(`
      <div style="background:var(--raise);border:1px solid var(--line);min-height:88px;padding:5px 6px;${isToday ? 'box-shadow:inset 0 0 0 2px var(--accent)' : ''}">
        <div style="font-family:var(--mono);font-size:11px;color:${isToday ? 'var(--accentTx)' : 'var(--faint)'};font-weight:${isToday ? 700 : 400}">${day}</div>
        ${chips}
        ${reviewChips}
      </div>
    `);
  }

  document.getElementById('cal-grid').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(7,1fr)">${dowHeader}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr)">${cells.join('')}</div>
  `;

  document.querySelectorAll('.cal-task').forEach((el) => {
    el.addEventListener('click', () => toggleCalTask(el.dataset.id));
  });
  document.querySelectorAll('.cal-review').forEach((el) => {
    el.addEventListener('click', () => { window.location.href = 'reviews.html'; });
  });
}

function escapeAttr(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

async function toggleCalTask(id) {
  const t = tasks.find((x) => x.id === id);
  if (!t) return;
  // A document-linked task is never toggled directly from the calendar —
  // that's how an already-signed one used to get accidentally reopened.
  // Always go to the document instead; docgen.html sorts out whether it
  // still needs a signature or is already done (and fixes the task if so).
  if (t.linked_doc_id) {
    window.location.href = linkedDocUrl(t.linked_doc_type, t.linked_doc_id, t.id);
    return;
  }
  if (t.status === 'complete') {
    try {
      await updateDoc(doc(db, 'tasks', id), { status: 'open', completed_at: null, completed_by: null });
      showToast('Reopened.');
      await loadTasks();
    } catch (err) {
      console.error(err);
      showToast('Could not update — ' + err.message, 'error');
    }
  } else {
    await completeTask(id);
  }
}

document.getElementById('task-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await addDoc(collection(db, 'tasks'), {
      assigned_to: document.getElementById('assignee').value,
      due_date: document.getElementById('due-date').value,
      instructions: document.getElementById('instructions').value.trim(),
      recurring: document.getElementById('recurring').value,
      status: 'open',
      entered_by: profile.uid,
      entered_at: serverTimestamp(),
    });
    document.getElementById('task-form').reset();
    showToast('Task assigned.');
    await loadTasks();
  } catch (err) {
    console.error(err);
    showToast('Could not assign — ' + err.message, 'error');
  }
});

await loadStaff();
await loadEmployees();
await loadPendingReviews();
await loadTasks();
</script>
</body>
</html>

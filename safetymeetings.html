<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safety meetings — SWL HR</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <aside class="side" id="sidebar"></aside>

  <div class="main" id="main" data-theme="light">
    <header class="bar">
      <div><h1>Safety meetings</h1></div>
      <div style="display:flex;align-items:center;gap:18px">
        <div class="toggle">
          <button class="on" data-t="light" type="button">Light</button>
          <button data-t="dark" type="button">Dark</button>
        </div>
        <div class="s" id="header-date"></div>
      </div>
    </header>

    <section class="view">

      <div class="card" style="margin-bottom:16px">
        <div class="card-h"><h3>Log a meeting</h3><span>Tailgate talk</span></div>
        <div class="card-body">
          <form id="meeting-form">
            <div class="frow">
              <div class="field">
                <label class="f-lab" for="mt-date">Date</label>
                <input class="f-in" id="mt-date" type="date" required>
              </div>
              <div class="field">
                <label class="f-lab" for="mt-topic">Topic</label>
                <input class="f-in" id="mt-topic" required>
              </div>
            </div>
            <div class="frow">
              <div class="field">
                <label class="f-lab" for="mt-presenter">Presenter</label>
                <input class="f-in" id="mt-presenter" required>
              </div>
              <div class="field">
                <label class="f-lab" for="mt-division">Division / crew</label>
                <select class="f-in" id="mt-division"><option value="">All</option></select>
              </div>
            </div>
            <div class="frow">
              <div class="field">
                <label class="f-lab" for="mt-language">Language</label>
                <select class="f-in" id="mt-language">
                  <option value="en">English</option>
                  <option value="es">Spanish</option>
                  <option value="both">Both</option>
                </select>
              </div>
              <div class="field">
                <label class="f-lab" for="mt-minutes">Minutes</label>
                <input class="f-in" id="mt-minutes" type="number" min="0" value="15">
              </div>
            </div>
            <div class="field">
              <label class="f-lab">Attendance</label>
              <div id="attendance-list" style="max-height:180px;overflow-y:auto;border:1px solid var(--edge);padding:10px;background:var(--bg)"></div>
            </div>
            <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:14px">
              <input type="checkbox" id="sign-in-sheet"> Sign-in sheet on file
            </label>
            <button type="submit" class="gh solid">Log meeting</button>
          </form>
        </div>
      </div>

      <div class="two" style="margin-bottom:20px">
        <div class="card">
          <div class="card-h"><h3>Coverage</h3><span>Hasn't attended this topic this quarter</span></div>
          <div class="tools">
            <select class="inp" id="coverage-topic"><option value="">Select a topic…</option></select>
          </div>
          <div id="coverage-body"></div>
        </div>
        <div class="card">
          <div class="card-h"><h3>Cadence by division</h3><span>Meetings, last 90 days</span></div>
          <div id="cadence-body"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-h"><h3>Meeting log</h3><span id="log-summary">—</span></div>
        <table>
          <thead><tr><th>Date</th><th>Topic</th><th>Presenter</th><th>Division</th><th>Attendance</th><th>Sign-in</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<script type="module">
import { requireAuth } from './auth.js';
import { initShell, showToast, formatDate } from './app.js';
import { db } from './firebaseconfig.js';
import {
  collection, doc, getDocs, addDoc, serverTimestamp,
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const profile = await requireAuth();
if (!profile) throw new Error('not authenticated');
initShell('safetymeetings', profile);

document.getElementById('header-date').textContent =
  new Date().toLocaleDateString('en-US', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
document.getElementById('mt-date').value = new Date().toISOString().slice(0, 10);

let employees = [];
let meetings = [];

function empById(id) { return employees.find((e) => e.id === id); }

async function loadEmployees() {
  const snap = await getDocs(collection(db, 'employees'));
  employees = snap.docs
    .map((d) => ({ id: d.id, ...d.data() }))
    .filter((e) => e.status !== 'terminated')
    .sort((a, b) => (a.last_name || '').localeCompare(b.last_name || ''));

  document.getElementById('attendance-list').innerHTML = employees.map((e) => `
    <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0">
      <input type="checkbox" class="attendee-cb" value="${e.id}"> ${e.first_name} ${e.last_name} <span class="mono dim">${e.division || ''}</span>
    </label>
  `).join('');

  const divisions = [...new Set(employees.map((e) => e.division).filter(Boolean))].sort();
  document.getElementById('mt-division').innerHTML = '<option value="">All</option>' + divisions.map((d) => `<option>${d}</option>`).join('');
}

async function loadMeetings() {
  const snap = await getDocs(collection(db, 'safety_meetings'));
  meetings = snap.docs
    .map((d) => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  const topics = [...new Set(meetings.map((m) => m.topic))].sort();
  document.getElementById('coverage-topic').innerHTML =
    '<option value="">Select a topic…</option>' + topics.map((t) => `<option>${t}</option>`).join('');

  render();
  renderCadence();
}

function render() {
  document.getElementById('log-summary').textContent = `${meetings.length} logged`;
  document.getElementById('rows').innerHTML = meetings.length ? meetings.map((m) => `
    <tr>
      <td class="mono">${formatDate(m.date)}</td>
      <td>${m.topic}</td>
      <td class="dim">${m.presenter}</td>
      <td class="mono dim">${m.division || 'All'}</td>
      <td class="mono">${(m.attendee_emp_ids || []).length}</td>
      <td>${m.sign_in_sheet ? '<span class="pill ok">On file</span>' : '<span class="pill bad">Missing</span>'}</td>
    </tr>
  `).join('') : '<tr><td colspan="6" class="dim">No meetings logged yet.</td></tr>';
}

function quarterStart(d) {
  const q = Math.floor(d.getMonth() / 3);
  return new Date(d.getFullYear(), q * 3, 1);
}

function renderCoverage() {
  const topic = document.getElementById('coverage-topic').value;
  const body = document.getElementById('coverage-body');
  if (!topic) { body.innerHTML = '<div class="card-body dim">Pick a topic above.</div>'; return; }

  const qStart = quarterStart(new Date());
  const attendedIds = new Set();
  meetings
    .filter((m) => m.topic === topic && m.date && new Date(m.date + 'T00:00:00') >= qStart)
    .forEach((m) => (m.attendee_emp_ids || []).forEach((id) => attendedIds.add(id)));

  const missing = employees.filter((e) => !attendedIds.has(e.id));
  body.innerHTML = missing.length ? `
    <table>
      <tbody>
        ${missing.map((e) => `<tr><td>${e.first_name} ${e.last_name}</td><td class="mono dim">${e.division || '—'}</td></tr>`).join('')}
      </tbody>
    </table>
  ` : '<div class="card-body dim">Everyone active has attended this topic this quarter.</div>';
}

function renderCadence() {
  const cutoff = Date.now() - 90 * 24 * 60 * 60 * 1000;
  const counts = {};
  meetings.filter((m) => m.date && new Date(m.date).getTime() >= cutoff).forEach((m) => {
    const div = m.division || 'All divisions';
    counts[div] = (counts[div] || 0) + 1;
  });
  const pairs = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const max = pairs[0]?.[1] || 1;
  document.getElementById('cadence-body').innerHTML = pairs.length ? pairs.map(([div, c]) => `
    <div class="rowbar">
      <div class="l">${div}</div>
      <div class="trk"><i style="width:${(c / max) * 100}%"></i></div>
      <div class="mono" style="text-align:right">${c}</div>
    </div>
  `).join('') : '<div class="card-body dim">No meetings in the last 90 days.</div>';
}

document.getElementById('coverage-topic').addEventListener('change', renderCoverage);

document.getElementById('meeting-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const attendeeIds = [...document.querySelectorAll('.attendee-cb:checked')].map((cb) => cb.value);
  try {
    await addDoc(collection(db, 'safety_meetings'), {
      date: document.getElementById('mt-date').value,
      topic: document.getElementById('mt-topic').value.trim(),
      presenter: document.getElementById('mt-presenter').value.trim(),
      division: document.getElementById('mt-division').value,
      language: document.getElementById('mt-language').value,
      minutes: parseInt(document.getElementById('mt-minutes').value || '0', 10),
      attendee_emp_ids: attendeeIds,
      sign_in_sheet: document.getElementById('sign-in-sheet').checked,
      entered_by: profile.uid,
      entered_at: serverTimestamp(),
    });
    await addDoc(collection(db, 'activity'), {
      module: 'safety_meetings',
      item: `Safety meeting — ${document.getElementById('mt-topic').value.trim()}`,
      entered_by: profile.uid,
      entered_at: serverTimestamp(),
    });
    document.getElementById('meeting-form').reset();
    document.getElementById('mt-date').value = new Date().toISOString().slice(0, 10);
    document.querySelectorAll('.attendee-cb').forEach((cb) => { cb.checked = false; });
    showToast('Meeting logged.');
    await loadMeetings();
  } catch (err) {
    console.error(err);
    showToast('Could not save — ' + err.message, 'error');
  }
});

await loadEmployees();
await loadMeetings();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SouthWest Landscape — HR</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login" id="login">
  <div class="login-card">
    <div class="mark">SouthWest<br>Landscape <i>/ HR</i></div>
    <div class="badge">Est. 1982 — 44 years</div>
    <p class="login-sub">Human Resources platform. Authorized HR staff only — every entry is stamped with who made it.</p>

    <div id="login-error" class="login-error" hidden></div>

    <form id="login-form">
      <div style="margin-bottom:16px">
        <label class="f-lab" for="email">Email</label>
        <input class="f-in" id="email" type="email" required autocomplete="username">
      </div>
      <div>
        <label class="f-lab" for="password">Password</label>
        <input class="f-in" id="password" type="password" required autocomplete="current-password">
      </div>
      <label class="login-remember">
        <input type="checkbox" id="remember-me">
        Keep me signed in on this device
      </label>
      <button class="login-btn" type="submit" id="go">Sign in</button>
    </form>

    <div class="login-foot" id="login-date">&nbsp;</div>
    <p style="margin-top:14px">
      <a href="#" id="forgot-link" style="font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#7E8C82;text-transform:uppercase">Forgot password?</a>
    </p>
  </div>
  <div class="login-note">Session times out after 30 minutes idle</div>
</div>

<script type="module">
import { login, redirectIfAuthenticated, requestPasswordReset, friendlyAuthError } from './auth.js';

redirectIfAuthenticated();

document.getElementById('login-date').textContent =
  new Date().toLocaleDateString('en-US', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });

const form = document.getElementById('login-form');
const errorBox = document.getElementById('login-error');
const goBtn = document.getElementById('go');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.hidden = true;
  goBtn.disabled = true;
  goBtn.textContent = 'Signing in…';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const rememberMe = document.getElementById('remember-me').checked;

  try {
    await login(email, password, rememberMe);
    window.location.href = 'dashboard.html';
  } catch (err) {
    errorBox.textContent = friendlyAuthError(err);
    errorBox.hidden = false;
    goBtn.disabled = false;
    goBtn.textContent = 'Sign in';
  }
});

document.getElementById('forgot-link').addEventListener('click', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) {
    errorBox.textContent = 'Enter your email above first, then click "Forgot password?" again.';
    errorBox.hidden = false;
    return;
  }
  try {
    await requestPasswordReset(email);
    errorBox.textContent = 'Password reset email sent — check your inbox.';
    errorBox.hidden = false;
  } catch (err) {
    errorBox.textContent = friendlyAuthError(err);
    errorBox.hidden = false;
  }
});
</script>
</body>
</html>

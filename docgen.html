async function saveIncidentReport(f, wantsSignatureTask = false) {
  const checks = {};
  document.querySelectorAll('.ir-check').forEach((cb) => { checks[cb.dataset.key] = cb.checked; });
  const mgrState = sigPads['ir-mgr-sig-pad'];
  const empState = sigPads['ir-emp-sig-pad'];
  const hasMgrSig = mgrState && mgrState.hasStroke;
  const hasEmpSig = empState && empState.hasStroke;

  let assigneeId = '', dueDate = '';
  if (wantsSignatureTask) {
    assigneeId = document.getElementById('ir-sig-assignee').value;
    dueDate = document.getElementById('ir-sig-due').value;
    if (!assigneeId || !dueDate) { showToast('Pick who should get the signature and by when.', 'error'); return; }
    if (hasMgrSig && hasEmpSig) { showToast('Both signatures are already here — just hit Save.', 'error'); return; }
  }

  const saveBtn = document.getElementById('ir-save-btn');
  saveBtn.disabled = true;
  try {
    const incidentRef = pendingSigDocId ? doc(db, 'incidents', pendingSigDocId) : doc(collection(db, 'incidents'));

    let refusalUrl = null, refusalPath = null;
    const refusalFile = document.getElementById('ir-refusal-file')?.files[0];
    if (f.isInjury && f.treatmentLevel === 'refused' && refusalFile) {
      refusalPath = `incidents/${incidentRef.id}/${refusalFile.name}`;
      const storageRef = ref(storage, refusalPath);
      await uploadBytes(storageRef, refusalFile);
      refusalUrl = await getDownloadURL(storageRef);
    }

    const batch = writeBatch(db);
    const incidentData = {
      // ---- same field names Safety's list, corrective tasks, and Form
      // 300 export already read — nothing there has to change. ----
      date: f.date, time: f.time, emp_id: f.emp ? f.emp.id : '',
      division: f.emp ? f.emp.division || '' : '',
      department: f.department, supervisor: f.supervisor, location: f.location,
      incident_type: f.incidentType, what_happened: f.whatHappened,
      injury_type: f.injuryType, body_part: f.bodyPart, treatment_level: f.treatmentLevel,
      days_away: f.daysAway, restricted_days: f.restrictedDays,
      recordable: f.recordable, privacy_case: f.privacyCase,
      cost: f.cost, root_cause: f.rootCause,
      corrective_action: f.correctiveAction, corrective_owner: f.correctiveOwner, corrective_due: f.correctiveDue,
      category_needs_review: false,
      refusal_form_url: refusalUrl, refusal_form_path: refusalPath,
      // ---- Form 7.3 fields, new on the merged record ----
      witnesses: f.witnesses, describe: f.describe, immediate_action: f.immediateAction,
      followup_checks: checks, discussed_staff_who: f.discussedStaffWho, other_detail: f.otherDetail,
      comments: f.comments, prepared_by: profile.name || '', prepared_date: new Date().toISOString().slice(0, 10),
      manager_signature_data_url: hasMgrSig ? document.getElementById('ir-mgr-sig-pad').toDataURL('image/png') : null,
      employee_signature_data_url: hasEmpSig ? document.getElementById('ir-emp-sig-pad').toDataURL('image/png') : null,
      entered_by: profile.uid, entered_at: serverTimestamp(),
    };
    if (hasMgrSig) incidentData.manager_signed_at = serverTimestamp();
    if (hasEmpSig) incidentData.employee_signed_at = serverTimestamp();
    batch.set(incidentRef, incidentData, pendingSigDocId ? { merge: true } : undefined);
    if (!pendingSigDocId && f.correctiveOwner && f.correctiveDue) {
      batch.set(doc(collection(db, 'tasks')), {
        assigned_to: f.correctiveOwner, due_date: f.correctiveDue,
        instructions: `Corrective action — ${f.correctiveAction} (${f.incidentType}, ${f.emp ? f.emp.first_name + ' ' + f.emp.last_name : 'unassigned'})`,
        recurring: 'none', status: 'open', entered_by: profile.uid, entered_at: serverTimestamp(),
      });
    }
    await batch.commit();
    if (pendingSigTaskId) {
      await updateDoc(doc(db, 'tasks', pendingSigTaskId), { status: 'complete', completed_at: serverTimestamp(), completed_by: profile.uid });
      pendingSigDocId = null; pendingSigTaskId = null;
    } else if (hasMgrSig && hasEmpSig) {
      // Reached here without a task link -- e.g. the "Get signature" button
      // on the incident's edit modal in Safety, not the task's own "Open
      // document" link. Both signatures being on file now means any open
      // signature-reminder task for this incident is done, so close it
      // instead of leaving it stuck open with no way to complete it.
      const openTasks = await getDocs(query(
        collection(db, 'tasks'),
        where('linked_doc_id', '==', incidentRef.id),
        where('linked_doc_type', '==', 'incidentreport'),
        where('status', '==', 'open'),
      ));
      for (const taskDoc of openTasks.docs) {
        await updateDoc(taskDoc.ref, { status: 'complete', completed_at: serverTimestamp(), completed_by: profile.uid });
      }
    }
    if (wantsSignatureTask) {
      await addDoc(collection(db, 'tasks'), {
        assigned_to: assigneeId, due_date: dueDate,
        instructions: `Get signature — Incident Report — ${f.emp ? f.emp.first_name + ' ' + f.emp.last_name : f.incidentType}`,
        recurring: 'none', status: 'open', linked_doc_id: incidentRef.id, linked_doc_type: 'incidentreport',
        entered_by: profile.uid, entered_at: serverTimestamp(),
      });
      showToast('Incident logged. Signature reminder task created — find it in Safety & incidents.');
    } else {
      showToast('Incident logged.' + (!pendingSigDocId && f.correctiveOwner ? ' Corrective action task created.' : '') + ' Find it in Safety & incidents.');
    }
  } catch (err) {
    console.error(err);
    showToast('Could not save — ' + err.message, 'error');
  } finally {
    saveBtn.disabled = false;
  }
}

// "Role | text" / "Title | a; b; c" — a small line-based convention
// rather than dynamic add/remove-row UI, since an SOP is written once
// and rarely edited after.
function buildSopRecord() {
  const title = document.getElementById('sop-title').value.trim();
  if (!title) { showToast('Enter the procedure name.', 'error'); return null; }

  const responsibilities = document.getElementById('sop-responsibilities').value.split('\n')
    .map((l) => l.trim()).filter(Boolean)
    .map((l) => {
      const [role, responsible_for] = l.split('|').map((s) => (s || '').trim());
      return { role: role || '', responsible_for: responsible_for || '' };
    });

  const procedure = document.getElementById('sop-procedure').value.split('\n')
    .map((l) => l.trim()).filter(Boolean)
    .map((l) => {
      const [stepTitle, rest] = l.split('|').map((s) => (s || '').trim());
      const instructions = (rest || '').split(';').map((s) => s.trim()).filter(Boolean);
      return { title: stepTitle || '', instructions };
    });

  const notices = document.getElementById('sop-notices').value.split('\n').map((l) => l.trim()).filter(Boolean);

  return {
    title,
    sop_number: document.getElementById('sop-number').value.trim(),
    date_created: document.getElementById('sop-date-created').value,
    implementation_date: document.getElementById('sop-impl-date').value,
    revision_number: document.getElementById('sop-revision').value.trim(),
    prepared_by: document.getElementById('sop-prepared-by').value.trim(),
    last_updated: new Date().toISOString().slice(0, 10),
    purpose: document.getElementById('sop-purpose').value.trim(),
    scope: document.getElementById('sop-scope').value.trim(),
    responsibilities, procedure, notices,
  };
}

// Same layout as documents.html's renderSopHtml — kept as a duplicate
// on purpose (this app has no shared-JS-across-pages setup), so the
// preview here and the saved version viewed from Documents look
// identical rather than drifting apart over time.
function renderSopSheet(record) {
  const respRows = record.responsibilities.map((r) => `<tr><td class="step-title">${escapeHtml(r.role)}</td><td>${escapeHtml(r.responsible_for)}</td></tr>`).join('');
  const procRows = record.procedure.map((p, i) => `
    <tr>
      <td class="step-num">${i + 1}</td>
      <td class="step-title">${escapeHtml(p.title)}</td>
      <td>${p.instructions.map((line) => `• ${escapeHtml(line)}`).join('<br>')}</td>
    </tr>
  `).join('');
  const notices = record.notices.map((n) => {
    const dotIdx = n.indexOf('. ');
    const lead = dotIdx > -1 && dotIdx < 60 ? n.slice(0, dotIdx + 1) : '';
    const rest = lead ? n.slice(dotIdx + 2) : n;
    return `<div class="sop-callout">${lead ? `<b>${escapeHtml(lead)}</b> ` : ''}${escapeHtml(rest)}</div>`;
  }).join('');

  const sheet = document.getElementById('sop-sheet');
  sheet.hidden = false;
  sheet.scrollIntoView({ behavior: 'smooth' });
  sheet.innerHTML = `
    <div class="sop-doc-inner">
      <div class="sop-head">
        <img src="${LOGO_DATA_URL}" alt="SouthWest Landscape">
        <div class="wordmark">SouthWest<br>Landscape</div>
      </div>
      <div class="sop-eyebrow">Standard Operating</div>
      <div class="sop-bigtitle">Procedure</div>
      <div class="sop-name-label">Name of Procedure</div>
      <div class="sop-name">${escapeHtml(record.title)}</div>
      <div class="sop-meta">
        <div><b>Date Created</b>${escapeHtml(formatDate(record.date_created))}</div>
        <div><b>SOP Number</b>${escapeHtml(record.sop_number) || '—'}</div>
        <div><b>Prepared By</b>${escapeHtml(record.prepared_by) || '—'}</div>
        <div><b>Implementation Date</b>${escapeHtml(formatDate(record.implementation_date))}</div>
        <div><b>Revision Number</b>${escapeHtml(record.revision_number) || '—'}</div>
        <div><b>Last Updated</b>${escapeHtml(formatDate(record.last_updated))}</div>
      </div>
      <div class="sop-section">Purpose</div>
      <div class="sop-box">${escapeHtml(record.purpose) || '—'}</div>
      <div class="sop-section">Scope</div>
      <div class="sop-box">${escapeHtml(record.scope) || '—'}</div>
      ${respRows ? `
        <div class="sop-section">Responsibilities</div>
        <table class="sop-table">
          <thead><tr><th style="width:26%">Role</th><th>Responsible For</th></tr></thead>
          <tbody>${respRows}</tbody>
        </table>
      ` : ''}
      ${procRows ? `
        <div class="sop-section">Procedure</div>
        <table class="sop-table">
          <thead><tr><th>Step</th><th>Procedure Title</th><th>Instructions</th></tr></thead>
          <tbody>${procRows}</tbody>
        </table>
      ` : ''}
      ${notices}
      <div class="sop-footer">SouthWest Landscape, Inc. — Internal Use Only${record.sop_number ? ` — SOP ${escapeHtml(record.sop_number)}` : ''}</div>
    </div>
    <button class="gh no-print" id="sop-back-btn" type="button" style="margin:14px">&larr; Back to document generator</button>
  `;
  document.getElementById('sop-back-btn').addEventListener('click', () => document.getElementById('back-btn').click());
}

async function saveSop() {
  const record = buildSopRecord();
  if (!record) return;
  try {
    await setDoc(doc(collection(db, 'training_documents')), {
      ...record, category: 'sop', content_type: 'sop',
      entered_by: profile.uid, uploaded_at: serverTimestamp(),
    });
    showToast('Saved — view it any time in Documents.');
    renderSopSheet(record);
  } catch (err) {
    console.error(err);
    showToast('Could not save — ' + err.message, 'error');
  }
}

          empName: 'Nombre del Empleado (Imprenta)', empSig: 'Firma del Empleado', date: 'Fecha', mgrName: 'Nombre del Gerente (Imprenta)', mgrSig: 'Firma del Gerente', back: '← Volver al generador de documentos' },

  const purpose = jdField(role, 'purpose', lang);
  const responsibilities = role[`responsibilities_${lang}`]?.length ? role[`responsibilities_${lang}`] : role.responsibilities_en;
  const equipIntro = jdField(role, 'equipment_intro', lang);
  const equipment = role[`equipment_${lang}`]?.length ? role[`equipment_${lang}`] : role.equipment_en;
  const qualifications = role[`qualifications_${lang}`]?.length ? role[`qualifications_${lang}`] : role.qualifications_en;
  const safety = role[`safety_sensitive_${lang}`] || [];
  const physical = role[`physical_demands_${lang}`] || [];
  const adaNote = jdField(role, 'ada_note', lang) || t.ada;
  const ack = jdField(role, 'acknowledgment', lang);
  const footer = jdField(role, 'footer', lang);

  const gaps = [];
  if (!purpose) gaps.push(lang === 'es' ? 'Falta el párrafo de propósito del puesto en el documento original.' : 'This role\'s source file has no Position Purpose paragraph.');
  if (!physical.length) gaps.push(lang === 'es' ? 'Falta la tabla de exigencias físicas en el documento original.' : 'This role\'s source file has no Physical Demands table.');
  if (!safety.length) gaps.push(lang === 'es' ? 'Falta la sección de puesto sensible en materia de seguridad en el documento original.' : 'This role\'s source file has no Safety-Sensitive Position section.');

  const respHtml = responsibilities.map((r) => `
    <div class="jd-resp">
      <div class="jd-resp-title">${escapeHtml(r.title)}</div>
      <ul>${r.bullets.map((b) => `<li>${escapeHtml(b)}</li>`).join('')}</ul>
      ${r.standard ? `<div class="jd-standard"><b>${lang === 'es' ? 'ESTÁNDAR DE RESPONSABILIDAD:' : 'ACCOUNTABILITY STANDARD:'}</b> ${escapeHtml(r.standard)}</div>` : ''}
    </div>
  `).join('');

  const equipRows = equipment.map(([cat, item]) => `<tr><td class="cat">${escapeHtml(cat)}</td><td>${escapeHtml(item)}</td></tr>`).join('');

  const physRows = physical.map((p) => `<tr><td>${escapeHtml(p.req)}</td><td>${escapeHtml(p.freq || '')}</td><td>${escapeHtml(p.notes || '')}</td></tr>`).join('');

  const safetyHtml = safety.map((s) => s.bold
    ? `<div class="jd-safety-lead">${escapeHtml(s.text)}</div>`
    : `<div class="jd-box" style="padding-top:2px">${escapeHtml(s.text)}</div>`
  ).join('');

  const sheet = document.getElementById('jd-sheet');
  sheet.hidden = false;
  sheet.scrollIntoView({ behavior: 'smooth' });
  sheet.innerHTML = `
    <div class="jd-topbar">
      <div class="wordmark">SouthWest Landscape</div>
      <div class="sub"><span class="doctype">${t.doctype}</span><span class="docmeta">${t.sub}${meta['Last Revised'] ? ' · ' + escapeHtml(meta['Last Revised']) : ''}</span></div>
    </div>
    <div class="jd-eyebrow">${escapeHtml(meta['Division'] || '')}${meta['Compensation Level'] ? ' · ' + escapeHtml(meta['Compensation Level']) : ''} — ${titleBar}</div>
    <div class="jd-inner">
      ${gaps.length ? `<p class="no-print" style="background:#FDEDEC;border:1px solid #E0A8A0;color:#7A1F2B;font-size:11px;padding:8px 10px;margin:12px 0 0">${gaps.join(' ')}</p>` : ''}
      <div class="jd-meta">
        ${Object.entries(meta).map(([k, v]) => `<div><b>${escapeHtml(k)}</b><span>${escapeHtml(v)}</span></div>`).join('')}
      </div>
      ${purpose ? `<div class="jd-box">${escapeHtml(purpose)}</div>` : ''}
      ${respHtml}
      ${equipment.length ? `
        <div class="jd-box" style="padding-bottom:0">${escapeHtml(equipIntro)}</div>
        <table class="jd-table"><thead><tr><th>${t.category}</th><th>${t.equipTitle}</th></tr></thead><tbody>${equipRows}</tbody></table>
      ` : ''}
      ${qualifications.length ? `<ul class="jd-list">${qualifications.map((q) => `<li>${escapeHtml(q)}</li>`).join('')}</ul>` : ''}
      ${safetyHtml}
      ${physical.length ? `
        <table class="jd-table"><thead><tr><th>${t.physReq}</th><th>${lang === 'es' ? 'Frecuencia' : 'Frequency'}</th><th>${t.physNotes}</th></tr></thead><tbody>${physRows}</tbody></table>
      ` : ''}
      <div class="jd-ada">${escapeHtml(adaNote)}</div>
      <div class="jd-ack">
        <b>${t.ack}:</b> ${escapeHtml(ack)}
        <div class="jd-sig">
          <div><b>${t.empName}</b><div class="line"></div><b>${t.empSig}</b><div class="line"></div><b>${t.date}</b><div class="line"></div></div>
          <div><b>${t.mgrName}</b><div class="line"></div><b>${t.mgrSig}</b><div class="line"></div><b>${t.date}</b><div class="line"></div></div>
        </div>
      </div>
      <div class="jd-footer">${escapeHtml(footer)}</div>
    </div>
    <button class="gh no-print" id="jd-save-btn" type="button" style="margin:14px">Save to Documents</button>
    <button class="gh no-print" id="jd-back-btn" type="button" style="margin:14px">${t.back}</button>
  `;
  document.getElementById('jd-back-btn').addEventListener('click', () => document.getElementById('back-btn').click());
  document.getElementById('jd-save-btn').addEventListener('click', () => saveJobDescription(role, lang));
}

// ---- Time card adjustment — a record of a correction to an Aspire
// timeclock punch, signed by the employee. Print-and-sign like Medical
// Treatment Refusal: this only logs to activity for an audit trail, no
// dedicated collection, since HR files the signed PDF in OneDrive
// themselves. Punch times are typed in from Aspire, never pulled live —
// this app has no connection to Aspire and never stores pay data. ----

// When a document needing a signature is saved for later, this tracks
// which training_documents record (and its linked task, if any) the
// eventual signature should be written back to — reset every time a
// fresh generator is opened, and set by loadPendingSignatureDoc() when
// reopened from a task's "Open document" link.
let pendingSigDocId = null;
let pendingSigTaskId = null;

function readTimecardForm() {
  const emp = employees.find((e) => e.id === document.getElementById('tc-emp').value);
  if (!emp) { showToast('Select an employee.', 'error'); return null; }
  const rows = document.getElementById('tc-punches').value.split('\n')
    .map((l) => l.trim()).filter(Boolean)
    .map((l) => {
      const [type, original, corrected, reason] = l.split('|').map((s) => (s || '').trim());
      return { type: type || '', original: original || '—', corrected: corrected || '—', reason: reason || '' };
    });
  return { emp, date: document.getElementById('tc-date').value, rows };
}

function renderTimecard(lang) {
  document.getElementById('gen-body').innerHTML = `
    <div class="card no-print" style="margin-bottom:16px">
      <div class="card-body">
        <div class="frow">
          ${empSearchFieldHtml('tc-emp', '<label class="f-lab">Employee</label>')}
          <div class="field"><label class="f-lab">Date of punch(es)</label><input class="f-in" id="tc-date" type="date"></div>
        </div>
        <div class="field">
          <label class="f-lab">Punch corrections — one per line: Punch type | Original time (Aspire) | Corrected time | Reason</label>
          <textarea class="f-in" id="tc-punches" rows="4" style="resize:vertical" placeholder="Clock In | 8:15 AM | 8:00 AM | Forgot to clock in, started work at 8:00&#10;Clock Out | — | 4:30 PM | Missed punch, left at end of shift as scheduled"></textarea>
        </div>
        <button class="gh solid" id="tc-generate-btn" type="button">Generate</button>
        <button class="gh" id="tc-log-btn" type="button">Log to activity</button>
        <div class="frow" style="margin-top:12px">
          <div class="field"><label class="f-lab">Not signing right now? Save it and get the signature later — who should get it signed</label><select class="f-in" id="tc-sig-assignee">${staff.map((s) => `<option value="${s.id}">${s.name}</option>`).join('')}</select></div>
          <div class="field"><label class="f-lab">By when</label><input class="f-in" id="tc-sig-due" type="date"></div>
        </div>
        <button class="gh" id="tc-save-later-btn" type="button">Save for signature later</button>
      </div>
    </div>
    <div class="form-doc" id="tc-sheet" hidden></div>
  `;
  document.getElementById('tc-sig-due').value = new Date().toISOString().slice(0, 10);
  wireEmpSearch('tc-emp');

  document.getElementById('tc-generate-btn').addEventListener('click', () => renderTimecardSheet(lang));
  document.getElementById('tc-log-btn').addEventListener('click', async () => {
    const emp = employees.find((e) => e.id === document.getElementById('tc-emp').value);
    if (!emp) { showToast('Select an employee.', 'error'); return; }
    try {
      await addDoc(collection(db, 'activity'), {
        module: 'documents', item: `Time card adjustment generated — ${emp.first_name} ${emp.last_name} (${formatDate(document.getElementById('tc-date').value)})`,
        entered_by: profile.uid, entered_at: serverTimestamp(),
      });
      showToast('Logged to activity.');
    } catch (err) {
      console.error(err);
      showToast('Could not log — ' + err.message, 'error');
    }
  });
  document.getElementById('tc-save-later-btn').addEventListener('click', () => saveTimecardForSignature());
}

async function saveTimecardForSignature() {
  const f = readTimecardForm();
  if (!f) return;
  const assigneeId = document.getElementById('tc-sig-assignee').value;
  const dueDate = document.getElementById('tc-sig-due').value;
  if (!assigneeId || !dueDate) { showToast('Pick who should get the signature and by when.', 'error'); return; }
  const assignee = staff.find((s) => s.id === assigneeId);
  try {
    const docRef = doc(collection(db, 'training_documents'));
    await setDoc(docRef, {
      content_type: 'timecard', category: 'pay_time', status: 'pending_signature',
      title: `Time Card Adjustment — ${f.emp.first_name} ${f.emp.last_name} (${formatDate(f.date)})`,
      emp_id: f.emp.id, emp_name: `${f.emp.first_name} ${f.emp.last_name}`,
      division: f.emp.division || '', position: f.emp.position || '',
      date: f.date, rows: f.rows,
      entered_by: profile.uid, entered_at: serverTimestamp(),
    });
    const taskRef = doc(collection(db, 'tasks'));
    await setDoc(taskRef, {
      assigned_to: assigneeId, due_date: dueDate,
      instructions: `Get signature — Time Card Adjustment — ${f.emp.first_name} ${f.emp.last_name} (${formatDate(f.date)})`,
      recurring: 'none', status: 'open', linked_doc_id: docRef.id, linked_doc_type: 'timecard',
      entered_by: profile.uid, entered_at: serverTimestamp(),
    });
    await addDoc(collection(db, 'activity'), {
      module: 'documents', item: `Time card adjustment saved for signature — ${f.emp.first_name} ${f.emp.last_name} (${formatDate(f.date)}) — assigned to ${assignee?.name || assigneeId}`,
      entered_by: profile.uid, entered_at: serverTimestamp(),
    });
    showToast('Saved. A task was created — open it from Tasks when the employee is ready to sign.');
  } catch (err) {
    console.error(err);
    showToast('Could not save — ' + err.message, 'error');
  }
}

async function completeLinkedTask(taskId) {
  try {
    await updateDoc(doc(db, 'tasks', taskId), { status: 'complete', completed_at: serverTimestamp(), completed_by: profile.uid });
  } catch (err) { console.error('Could not auto-complete task', err); }
}

function drawExistingSignatureDataUrl(canvasId, dataUrl) {
  return new Promise((resolve) => {
    const canvas = document.getElementById(canvasId);
    const state = sigPads[canvasId];
    if (!canvas || !state || !dataUrl) { resolve(); return; }
    const rect = canvas.getBoundingClientRect();
    const img = new Image();
    img.onload = () => {
      state.ctx.drawImage(img, 0, 0, rect.width, rect.height);
      state.hasStroke = true;
      resolve();
    };
    img.src = dataUrl;
  });
}

// Reopens a saved-but-not-yet-signed (or partially signed) record from a
// task's "Open document" link. Training_documents-backed types
// (timecard/mealpenalty/refusal/mealwaiver2/letter) share one lookup;
// PIP/Review/Termination/Incident Report live in their own collections
// since they're filed the moment they're generated, before any signature.
async function loadPendingSignatureDoc(type, id) {
  const taskId = new URLSearchParams(window.location.search).get('task') || null;
  try {
    if (type === 'pip') {
      const snap = await getDoc(doc(db, 'pips', id));
      if (!snap.exists()) { showToast('That PIP could not be found.', 'error'); return; }
      const d = snap.data();
      const emp = employees.find((e) => e.id === d.emp_id);
      if (!emp) { showToast('That employee could not be found.', 'error'); return; }
      const bothSigned = d.signature_data_url && d.manager_signature_data_url;
      if (taskId && bothSigned) await completeLinkedTask(taskId);
      pendingSigDocId = id; pendingSigTaskId = bothSigned ? null : taskId;
      renderPipSheet(document.getElementById('lang-select').value || 'en', emp, {
        start: d.start_date, final: d.final_review_date, gaps: d.performance_gaps,
        expect: d.expectations, support: d.support_provided || [], checkIns: d.check_ins || [], pipId: id,
        signedAt: d.signed_at,
      });
      await drawExistingSignatureDataUrl('pip-sig-pad', d.signature_data_url);
      await drawExistingSignatureDataUrl('pip-mgr-sig-pad', d.manager_signature_data_url);
      if (bothSigned) showToast('Already fully signed — shown below.');
      return;
    }
    if (type === 'review') {
      const [empId, milestone] = id.split(':');
      const emp = employees.find((e) => e.id === empId);
      if (!emp) { showToast('That employee could not be found.', 'error'); return; }
      const snap = await getDoc(doc(db, 'employees', empId, 'reviews', milestone));
      if (!snap.exists()) { showToast('That review could not be found.', 'error'); return; }
      const d = snap.data();
      const allSigned = d.signature_data_url && d.manager_signature_data_url && d.hr_signature_data_url;
      if (taskId && allSigned) await completeLinkedTask(taskId);
      pendingSigDocId = id; pendingSigTaskId = allSigned ? null : taskId;
      renderReviewSheet(emp, Number(milestone), d, document.getElementById('lang-select').value);
      await drawExistingSignatureDataUrl('rev-sig-pad', d.signature_data_url);
      await drawExistingSignatureDataUrl('rev-mgr-sig-pad', d.manager_signature_data_url);
      await drawExistingSignatureDataUrl('rev-hr-sig-pad', d.hr_signature_data_url);
      if (allSigned) showToast('Already fully signed — shown below.');
      return;
    }
    if (type === 'termination') {
      const rec = terminations.find((t) => t.id === id);
      if (!rec) { showToast('That termination could not be found.', 'error'); return; }
      const bothSigned = rec.signature_data_url && rec.manager_signature_data_url;
      if (taskId && bothSigned) await completeLinkedTask(taskId);
      pendingSigDocId = id; pendingSigTaskId = bothSigned ? null : taskId;
      document.getElementById('term-print-acts').hidden = false;
      renderTerminationSheet(rec, {}, document.getElementById('lang-select').value);
      await drawExistingSignatureDataUrl('term-sig-pad', rec.signature_data_url);
      await drawExistingSignatureDataUrl('term-mgr-sig-pad', rec.manager_signature_data_url);
      if (bothSigned) showToast('Already fully signed — shown below.');
      return;
    }
    if (type === 'incidentreport') {
      const snap = await getDoc(doc(db, 'incidents', id));
      if (!snap.exists()) { showToast('That incident could not be found.', 'error'); return; }
      const d = snap.data();
      if (d.manager_signature_data_url && d.employee_signature_data_url) {
        if (taskId) await completeLinkedTask(taskId);
        showToast('Both signatures are already on file — opening it from Safety.');
        window.location.href = 'safety.html';
        return;
      }
      pendingSigDocId = id; pendingSigTaskId = taskId;
      populateIncidentReportForm(d);
      renderIncidentReportSheet(document.getElementById('lang-select').value);
      if (d.followup_checks) {
        document.querySelectorAll('.ir-check').forEach((cb) => {
          if (d.followup_checks[cb.dataset.key]) { cb.checked = true; cb.closest('label').querySelector('.print-only').textContent = '☑'; }
        });
      }
      await drawExistingSignatureDataUrl('ir-mgr-sig-pad', d.manager_signature_data_url);
      await drawExistingSignatureDataUrl('ir-emp-sig-pad', d.employee_signature_data_url);
      return;
    }

    // Training_documents-backed types: timecard, mealpenalty, refusal, mealwaiver2, letter
    const snap = await getDoc(doc(db, 'training_documents', id));
    if (!snap.exists()) { showToast('That saved document could not be found.', 'error'); return; }
    const d = snap.data();

    // This document is already signed — the task pointing here is only
    // "open" because of a stray click (e.g. the Tasks calendar chip), not
    // because a signature is actually still needed. Fix the task quietly
    // instead of making someone re-sign, and go straight to the saved copy.
    if (d.status === 'signed') {
      if (taskId) await completeLinkedTask(taskId);
      showToast('Already signed — opening the saved copy.');
      window.location.href = `documents.html?doc=${id}`;
      return;
    }

    pendingSigDocId = id;
    pendingSigTaskId = taskId;
    if (type === 'timecard') {
      setEmpField('tc-emp', d.emp_id);
      document.getElementById('tc-date').value = d.date;
      document.getElementById('tc-punches').value = (d.rows || [])
        .map((r) => `${r.type} | ${r.original} | ${r.corrected} | ${r.reason}`).join('\n');
      renderTimecardSheet('en');
    } else if (type === 'mealpenalty') {
      setEmpField('mp-emp', d.emp_id);
      document.getElementById('mp-date').value = d.date;
      document.getElementById('mp-shift-start').value = d.shift_start || '';
      document.getElementById('mp-shift-end').value = d.shift_end || '';
      document.getElementById('mp-reason').value = d.reason || '';
      document.getElementById('mp-late-lunch').value = d.late_lunch ? 'yes' : 'no';
      document.getElementById('mp-late-lunch').dispatchEvent(new Event('change'));
      if (d.late_lunch) document.getElementById('mp-late-lunch-time').value = d.late_lunch_time || '';
      document.getElementById('mp-premium-status').value = d.premium_pending ? 'pending' : 'paid';
      document.getElementById('mp-premium-status').dispatchEvent(new Event('change'));
      if (d.premium_pending) {
        document.getElementById('mp-assignee').value = d.premium_assignee_id || '';
        document.getElementById('mp-due-date').value = d.premium_due_date || '';
      } else {
        document.getElementById('mp-pay-date').value = d.pay_date || '';
      }
      renderMealPenaltySheet('en');
    } else if (type === 'refusal') {
      setEmpField('ref-emp', d.emp_id);
      document.getElementById('ref-date').value = d.date || '';
      document.getElementById('ref-incident-datetime').value = d.incident_datetime || '';
      document.getElementById('ref-supervisor').value = d.supervisor || '';
      document.getElementById('ref-location').value = d.location || '';
      document.getElementById('ref-description').value = d.description || '';
      renderRefusalSheet(d.lang || 'en');
    } else if (type === 'mealwaiver2') {
      setEmpField('mw2-emp', d.emp_id);
      const branchKey = Object.entries(LOCATIONS).find(([, v]) => v.label === d.branch)?.[0];
      document.getElementById('mw2-branch').value = branchKey || '';
      document.getElementById('mw2-date').value = d.date || '';
      document.getElementById('mw2-hours').value = d.hours || '';
      document.getElementById('mw2-first-taken').value = d.first_taken ? 'yes' : 'no';
      document.getElementById('mw2-decision').value = d.waiving ? 'waive' : 'take';
      renderMealWaiver2Sheet(d.lang || 'en');
    } else if (type === 'offer') {
      const typeSel = document.getElementById('ltr-type');
      const meta = LETTER_TYPES.find((t) => t.value === d.letter_type);
      if (meta) {
        document.querySelectorAll('#ltr-tabs .tab').forEach((tab) => tab.classList.toggle('active', tab.dataset.category === meta.category));
        typeSel.innerHTML = LETTER_TYPES.filter((t) => t.category === meta.category).map((t) => `<option value="${t.value}">${t.label}</option>`).join('');
      }
      typeSel.value = d.letter_type;
      typeSel.dispatchEvent(new Event('change'));
      document.getElementById('ltr-first').value = d.emp_first || '';
      document.getElementById('ltr-last').value = d.emp_last || '';
      document.getElementById('ltr-position').value = d.position || '';
      document.getElementById('ltr-emptype').value = d.emp_type || 'Full-time';
      const branchKey = Object.entries(LOCATIONS).find(([, v]) => v.label === d.branch_label)?.[0];
      document.getElementById('ltr-branch').value = branchKey || '';
      document.getElementById('ltr-address').value = d.address || '';
      document.getElementById('ltr-schedule').value = d.schedule || '';
      const mgrPool = employees.filter((e) => managerIds.has(e.id));
      const mgrMatch = mgrPool.find((e) => `${e.first_name} ${e.last_name}` === d.supervisor_name);
      if (mgrMatch) setEmpField('ltr-reportsto', mgrMatch.id, mgrPool);
      document.getElementById('ltr-reportsto-title').value = d.supervisor_title || '';
      document.getElementById('ltr-date').value = d.letter_date || '';
      document.getElementById('ltr-start').value = d.start_date || '';
      document.getElementById('ltr-return').value = d.return_date || '';
      showToast('Loaded — this is the one document type where pay isn\'t saved, so re-enter the rate/salary, then Generate to reach the signature.', 'error');
    }
  } catch (err) {
    console.error(err);
    showToast('Could not load the saved document — ' + err.message, 'error');
  }
}

// Shared by both timecard and meal-penalty sheets: captures the drawn
// signature as an image, saves (or updates) the signed record in
// Documents, and — if this came from a "save for later" task — completes
// that task so the follow-up doesn't linger once it's actually signed.
async function finalizeSignedDocument(canvasId, docData, supervisorCanvasId = null) {
  const state = sigPads[canvasId];
  const supState = supervisorCanvasId ? sigPads[supervisorCanvasId] : null;
  if (!(state && state.hasStroke) && !(supState && supState.hasStroke)) {
    showToast('Get at least one signature first — both pads are empty.', 'error'); return;
  }
  try {
    const docRef = pendingSigDocId ? doc(db, 'training_documents', pendingSigDocId) : doc(collection(db, 'training_documents'));
    const payload = {
      ...docData, status: 'signed',
      signed_by: profile.uid, signed_at: serverTimestamp(),
      entered_by: profile.uid, entered_at: serverTimestamp(),
    };

    if (supState && supState.hasStroke) payload.supervisor_signature_data_url = document.getElementById(supervisorCanvasId).toDataURL('image/png');

}

// Reusable draw-to-sign canvas — keyed by canvas element id so more than
// one signature pad can exist on the page (or across generators) without
// stepping on each other's state.
const sigPads = {};

// Runs renderFn() (which redraws a sheet, recreating its signature
// canvas from scratch — used when switching the language on an
// already-generated document) without losing an in-progress, not-yet-
// saved signature: captures whatever's drawn on canvasId first, then
// paints it back onto the freshly-created canvas of the same id.
function withPreservedSignature(canvasId, renderFn) {
  const oldCanvas = document.getElementById(canvasId);
  const oldState = sigPads[canvasId];
  const dataUrl = (oldCanvas && oldState && oldState.hasStroke) ? oldCanvas.toDataURL('image/png') : null;
  renderFn();
  if (!dataUrl) return;
  const newCanvas = document.getElementById(canvasId);
  const newState = sigPads[canvasId];
  if (!newCanvas || !newState) return;
  const rect = newCanvas.getBoundingClientRect();
  const img = new Image();
  img.onload = () => {
    newState.ctx.drawImage(img, 0, 0, rect.width, rect.height);
    newState.hasStroke = true;
  };
  img.src = dataUrl;
}

function setUpSignaturePad(canvasId, clearBtnId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#111';
  const state = { ctx, drawing: false, hasStroke: false };
  sigPads[canvasId] = state;

  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  };
  const start = (e) => { e.preventDefault(); state.drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
  const move = (e) => {
    if (!state.drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    state.hasStroke = true;
  };
  const end = () => { state.drawing = false; };

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);

  document.getElementById(clearBtnId).addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    state.hasStroke = false;
  });
}

// Shared signature-pad markup — canvas + its own Clear button, no
// heading (each sheet's headings follow its own family's convention, so
// callers wrap this with their own <h4>/.form-section).
function signaturePadHtml(canvasId, clearId, height = 90) {

// Creates the follow-up task pointing back at a record that's already
// saved. linkedDocType is read by loadPendingSignatureDoc() when the
// task's "Open document" link brings someone back here later.
async function createSignatureFollowupTask(prefix, { linkedDocType, linkedDocId, title }) {
  const assigneeId = document.getElementById(`${prefix}-sig-assignee`).value;
  const dueDate = document.getElementById(`${prefix}-sig-due`).value;
  if (!assigneeId || !dueDate) { showToast('Pick who should get the signature and by when.', 'error'); return false; }
  const assignee = staff.find((s) => s.id === assigneeId);
  try {
    await addDoc(collection(db, 'tasks'), {
      assigned_to: assigneeId, due_date: dueDate,
      instructions: `Get signature — ${title}`,
      recurring: 'none', status: 'open', linked_doc_id: linkedDocId, linked_doc_type: linkedDocType,
      entered_by: profile.uid, entered_at: serverTimestamp(),
    });
    showToast(`Task created for ${assignee?.name || assigneeId} — open it from Tasks when ready to sign.`);
    return true;
  } catch (err) {
    console.error(err);
    showToast('Could not create the task — ' + err.message, 'error');
    return false;
  }
}

        : 'This record documents the meal period and the premium owed; it does not create or change any regular pay rate. Sign above, print to PDF, and file per HR process.'}</div>
    </div>
    <button class="gh no-print" id="mp-back-btn" type="button" style="margin:14px">&larr; Back to document generator</button>
  `;
  document.getElementById('mp-back-btn').addEventListener('click', () => document.getElementById('back-btn').click());
  document.getElementById('mp-sig-save').addEventListener('click', () => finalizeSignedDocument('mp-sig-pad', {
    content_type: 'mealpenalty', category: 'pay_time',
    title: `Missed Meal Period Record — ${f.emp.first_name} ${f.emp.last_name} (${formatDate(f.date)})`,
    emp_id: f.emp.id, emp_name: `${f.emp.first_name} ${f.emp.last_name}`,
    division: f.emp.division || '',
    date: f.date, shift_start: f.shiftStart, shift_end: f.shiftEnd, reason: f.reason,
    late_lunch: f.lateLunch, late_lunch_time: f.lateLunchTime,
    premium_pending: f.premiumPending, pay_date: f.payDate,
    premium_assignee_id: f.assigneeId, premium_due_date: f.dueDate,
  }, 'mp-sup-sig-pad'));
  setUpSignaturePad('mp-sig-pad', 'mp-sig-clear');
  setUpSignaturePad('mp-sup-sig-pad', 'mp-sup-sig-clear');
  sheetRerender = (l) => withPreservedSignature('mp-sup-sig-pad', () => withPreservedSignature('mp-sig-pad', () => renderMealPenaltySheet(l)));
}

async function saveMealPenalty(lang) {
  const f = readMealPenaltyForm();
  if (!f) return;
  try {
    if (f.premiumPending) {
      if (!f.assigneeId) { showToast('Pick who the payroll follow-up should go to.', 'error'); return; }
      const assignee = staff.find((s) => s.id === f.assigneeId);
      await addDoc(collection(db, 'tasks'), {
        assigned_to: f.assigneeId,
        due_date: f.dueDate,
        instructions: `Add 1 hour meal period premium — ${f.emp.first_name} ${f.emp.last_name} (${formatDate(f.date)})`,
        recurring: 'none',
        status: 'open',
        entered_by: profile.uid,
        entered_at: serverTimestamp(),
      });
      await addDoc(collection(db, 'activity'), {
        module: 'documents', item: `Missed meal period recorded — ${f.emp.first_name} ${f.emp.last_name} (${formatDate(f.date)}) — premium pay task assigned to ${assignee?.name || f.assigneeId}`,
        entered_by: profile.uid, entered_at: serverTimestamp(),
      });
      showToast('Saved — premium pay task created.');
    } else {
      await addDoc(collection(db, 'activity'), {
        module: 'documents', item: `Missed meal period recorded — ${f.emp.first_name} ${f.emp.last_name} (${formatDate(f.date)}) — premium already paid ${formatDate(f.payDate)}`,
        entered_by: profile.uid, entered_at: serverTimestamp(),
      });
      showToast('Saved to activity.');
    }
  } catch (err) {
    console.error(err);
    showToast('Could not save — ' + err.message, 'error');
  }
}

function renderMealWaiver2Sheet(lang) {
  const isEs = lang === 'es';
  const f = readMealWaiver2Form();
  if (!f) return;
  const opportunity = isEs ? MW2_OPPORTUNITY_ES : MW2_OPPORTUNITY_EN;
  const conditions = isEs ? MW2_CONDITIONS_ES : MW2_CONDITIONS_EN;
  const supervisorPts = isEs ? MW2_SUPERVISOR_ES : MW2_SUPERVISOR_EN;

  const sheet = document.getElementById('mw2-sheet');
  sheet.hidden = false;
  sheet.scrollIntoView({ behavior: 'smooth' });
  sheet.innerHTML = `
    <div class="form-doc-inner">
      <div class="form-head"><img src="${LOGO_DATA_URL}" alt="SouthWest Landscape"><div class="wordmark">SouthWest<br>Landscape</div></div>
      <h1 class="form-title">${isEs ? 'Acuerdo de Renuncia al Período de Comida — Segundo Período de Comida' : 'Meal Period Waiver Agreement — Second Meal Period'}</h1>
      <div class="form-section">${isEs ? 'Información del Empleado' : 'Employee Information'}</div>
      <div class="form-grid c2">
        <div class="form-cell"><b>${isEs ? 'Nombre del Empleado' : 'Employee Name'}</b>${f.emp.first_name} ${f.emp.last_name}</div>
        <div class="form-cell"><b>${isEs ? 'ID del Empleado' : 'Employee ID'}</b>${f.emp.id}</div>

        <div class="form-cell"><b>${isEs ? 'Sucursal' : 'Branch'}</b>${escapeHtml(f.branch)}</div>
        <div class="form-cell"><b>${isEs ? 'Fecha de Trabajo' : 'Date of Work'}</b>${formatDate(f.date)}</div>
        <div class="form-cell"><b>${isEs ? 'Horas Programadas' : 'Scheduled Hours'}</b>${escapeHtml(f.hours)}</div>
      </div>
      <div class="form-section">${isEs ? 'Reconocimiento de Derechos al Período de Comida' : 'Acknowledgment of Meal Period Rights'}</div>
      <div class="form-box">${isEs
        ? 'Tengo derecho a un segundo período de comida no pagado y libre de deberes de al menos 30 minutos cuando trabajo más de 10 horas en un día de trabajo, conforme al Código Laboral de California §512.'
        : 'I am entitled to a second unpaid, duty-free meal period of at least 30 minutes when I work more than 10 hours in a workday, per California Labor Code §512.'}</div>
      <div class="form-section">${isEs ? 'Confirmación del Primer Período de Comida' : 'First Meal Period Confirmation'}</div>
      <div class="form-box">${f.firstTaken
        ? (isEs ? 'Sí — se confirmó que el primer período de comida se tomó de forma ininterrumpida.' : 'Yes — the first meal period was confirmed taken uninterrupted.')
        : (isEs ? 'No — el primer período de comida no se tomó según lo requerido.' : 'No — the first meal period was not taken as required.')}</div>
      <div class="form-section">${isEs ? 'Confirmación de Oportunidad' : 'Opportunity Confirmation'}</div>
      <div class="form-box">
        ${opportunity.map((s, i) => `<p style="margin:0 0 8px"><label><input type="checkbox" class="mw2-check no-print" data-key="opportunity-${i}"><span class="print-only">☐</span> ${s}</label></p>`).join('')}
      </div>
      <div class="form-section">${isEs ? 'Decisión Voluntaria sobre el Segundo Período de Comida' : 'Voluntary Second Meal Period Decision'}</div>
      <div class="form-box">${f.waiving
        ? (isEs ? 'El empleado renuncia voluntariamente a su segundo período de comida de 30 minutos para este día de trabajo específico.' : 'The employee voluntarily waives their second 30-minute meal period for this specific workday.')

      ${f.waiving ? `

        pendingSigDocId = null; pendingSigTaskId = null;
      }
      await addDoc(collection(db, 'activity'), {
        module: 'documents', item: `Second Meal Period Waiver saved — ${f.emp.first_name} ${f.emp.last_name}`,
        entered_by: profile.uid, entered_at: serverTimestamp(),
      });
      showToast('Saved — view it any time in Documents.');
    } catch (err) {
      console.error(err);
      showToast('Could not save — ' + err.message, 'error');
    }
  });
  sheetRerender = (l) => {
    const checks = {};
    document.querySelectorAll('.mw2-check').forEach((cb) => { checks[cb.dataset.key] = cb.checked; });
    withPreservedSignature('mw2-sup-sig-pad', () => withPreservedSignature('mw2-sig-pad', () => renderMealWaiver2Sheet(l)));
    document.querySelectorAll('.mw2-check').forEach((cb) => {
      if (checks[cb.dataset.key]) {

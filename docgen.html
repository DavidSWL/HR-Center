<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document generator — SWL HR</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.print-only { display:none; }
@media print {
  .side, .bar, .no-print { display:none !important; }
  .print-only { display:inline !important; }
  .app { display:block; }
  .view { padding:0; }
  .doc-sheet, .form-doc { border:none !important; box-shadow:none !important; }
  @page { size:letter; margin:0; }
  .letter { width:8.5in; min-height:11in; box-shadow:none; margin:0; padding:1in; }
  .force-break { break-before:page; page-break-before:always; }
}
.gen-category{background:var(--panel);border:1px solid var(--line);padding:14px 14px 16px;margin-bottom:14px}
.gen-menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:20px}
.gen-tile{border:1px solid var(--line);background:var(--raise);padding:16px;cursor:pointer;text-align:left}
.gen-tile:hover{border-color:var(--accent)}
.gen-tile h4{font-family:var(--display);font-size:14px;margin:0 0 4px}
.gen-tile p{font-size:11.5px;color:var(--faint);margin:0}
.gen-tile.linkout{opacity:.85}

/* ---- generic print sheet (PIP, onboarding) ---- */
.doc-sheet{border:1px solid var(--line);background:#fff;color:#111;max-width:800px;margin:0 auto}
.doc-bar{background:var(--oregon);color:#fff;padding:14px 24px;font-family:var(--display);font-size:16px;letter-spacing:.02em;text-transform:uppercase}
.doc-body{padding:24px}
.doc-body h4{font-family:var(--display);font-size:13px;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--oregon);padding-bottom:4px;margin:20px 0 10px}
.doc-body h4:first-child{margin-top:0}
.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:13px;margin-bottom:10px}
.doc-grid div b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#666}
.doc-fineprint{font-size:10.5px;color:#555;font-style:italic;border:1px solid #ccc;padding:10px;margin-top:14px}
.sig-line{border-top:1px solid #333;margin-top:36px;padding-top:4px;font-size:11px}

/* Form fields (the "get the signature later" assignee/due controls) sit
   directly on these white print-style sheets, outside any .card-body or
   .modal-body — without this, they fall back to styles.css's base .f-in
   (login-page style: white text on a dark transparent background), which
   is unreadable against a white sheet. */
.doc-body .f-in, .form-doc-inner .f-in, .letter .f-in {
  background:#fff; border-color:#ccc; color:#111;
}
.doc-body .f-in:focus, .form-doc-inner .f-in:focus, .letter .f-in:focus {
  outline:0; border-color:#154733; background-color:#f3f8f5;
}

/* .form-doc family (Write-up / Termination / 30-60-90 review) now lives
   in styles.css — shared with discipline.html's write-up print sheet. */

/* ---- offer / increase / promotion letters — matches the branded
   letterhead tool exactly (decor bands, ribbon, letterhead logo) ---- */
.letter{position:relative;background:#fff;width:8.5in;min-height:11in;margin:0 auto;padding:1in;box-shadow:0 2px 18px rgba(0,0,0,.15);font-family:Calibri,"Segoe UI",Arial,sans-serif;color:#000;font-size:11pt;line-height:1.35}
.letter p{margin:0 0 10px}
.letter .just{text-align:justify}
.letter .center{text-align:center}
.letter .indent{padding-left:0.22in}
.letter .tight{margin-bottom:2px}
.letter .section-gap{margin-top:26px}
.letter ul{margin:0 0 10px;padding-left:0.5in}
.letter ul.tight{margin-bottom:2px}
.letter li{margin:0 0 2px}
.letterhead{margin-bottom:16px}
.letterhead img{width:1.5in;height:auto;display:block}
.sig-section{margin-top:10px}
.sig-section p{margin:0 0 2px}
.sig-img{max-height:0.9in;display:block;margin:6px 0 4px}
.sig-blank{border-bottom:1px solid #333;width:260px;height:0.85in;margin:6px 0 4px}
.decor-band{position:absolute;left:0;right:0;height:0.4in;overflow:hidden;background:#d3ded6}
.decor-band.top{top:0}
.decor-band.bottom{bottom:0}
.decor-band .ribbon{position:absolute;top:0;bottom:0;left:17%;right:-4%;background:#8f1536;clip-path:polygon(0 0,100% 0,100% 100%,7% 100%)}
.acceptance-block{margin-top:34px}
.agreement-label{font-weight:700;text-align:center;margin-bottom:26px !important}
.accept-line{display:flex;gap:40px;margin-bottom:6px}
.accept-line .blank{flex:1;border-bottom:1px solid #000;height:1px;margin-top:46px}
.accept-line .blank.short{flex:0 0 30%}
.accept-label-line{display:flex;gap:40px;font-weight:700}
.accept-label-line .lbl{flex:1}
.accept-label-line .lbl.short{flex:0 0 30%}

.tabs{display:flex;gap:0;border:1px solid var(--line);width:fit-content;margin-bottom:14px}
.tabs .tab{padding:8px 18px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--faint);border-right:1px solid var(--line)}
.tabs .tab:last-child{border-right:none}
.tabs .tab.active{background:var(--accent);color:#fff}
</style>
</head>
<body>

<div class="app">
  <aside class="side" id="sidebar"></aside>

  <div class="main" id="main" data-theme="light">
    <header class="bar">
      <div><h1 id="page-title">Document generator</h1></div>
      <div style="display:flex;align-items:center;gap:18px">
        <div class="toggle no-print">
          <button class="on" data-t="light" type="button">Light</button>
          <button data-t="dark" type="button">Dark</button>
        </div>
        <div class="s" id="header-date"></div>
      </div>
    </header>

    <section class="view">

      <div id="menu-view">
        <p class="dim" style="margin-bottom:16px">
          Write-up, Termination, 30/60/90 Review, and Offer/Increase/Promotion letters match the real SWL
          forms exactly. Every generator produces a print view — use your browser's Print → Save as PDF.
        </p>
        <div id="tiles"></div>
      </div>

      <div id="gen-view" hidden>
        <div class="acts no-print">
          <button class="gh" id="back-btn" type="button">&larr; All documents</button>
          <button class="gh" id="print-btn" type="button">Print</button>
          <select class="inp" id="lang-select">
            <option value="en">English</option>
            <option value="es">Español</option>
          </select>
        </div>
        <div id="gen-body"></div>
      </div>
    </section>
  </div>
</div>

<script type="module">
import { requireAuth } from './auth.js';
import { initShell, showToast, formatDate, readSpreadsheetSheets, objectsFromRows } from './app.js';
import { db, storage } from './firebaseconfig.js';
import { LOGO_DATA_URL, LOCATIONS, SCHEDULE_PRESETS, HR_SIGNER, ONBOARDING_CHECKLIST } from './letterhead-assets.js';
import { JOB_DESCRIPTIONS } from './jobdescriptionsdata.js';
import {
  collection, doc, getDoc, getDocs, setDoc, updateDoc, addDoc, writeBatch, serverTimestamp, query, where,
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';

const profile = await requireAuth();
if (!profile) throw new Error('not authenticated');
initShell(new URLSearchParams(window.location.search).get('open') === 'termination' ? 'terminations' : 'docgen', profile);

document.getElementById('header-date').textContent =
  new Date().toLocaleDateString('en-US', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

// Signed_at is captured on every signature but isn't automatically shown
// anywhere — sheets that can be reopened with real saved data (not just
// a blank form) print it explicitly.
function signedOnHtml(ts) {
  if (!ts?.toDate) return '';
  return `<div class="dim" style="margin-top:6px;font-size:11.5px">Signed ${formatDate(ts.toDate().toISOString().slice(0, 10))}</div>`;
}

// Legal-letter-style long date ("August 18, 2026"), separate from app.js's
// short admin-table formatDate() — this is only for printed documents.
function longDate(dateStr, isEs = false) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString(isEs ? 'es-ES' : 'en-US', { year: 'numeric', month: 'long', day: 'numeric' });
}

const T = {
  en: { employee: 'Employee', id: 'Employee ID', title: 'Job title', division: 'Division', hireDate: 'Hire date',
        manager: 'Reports to', language: 'Language', print: 'Print', save: 'Save' },
  es: { employee: 'Empleado', id: 'ID de empleado', title: 'Puesto', division: 'División', hireDate: 'Fecha de contratación',
        manager: 'Reporta a', language: 'Idioma', print: 'Imprimir', save: 'Guardar' },
};

const GENERATORS = [
  { key: 'onboarding', title: 'Onboarding packet', desc: 'Assembles the required document checklist', category: 'New hire & offers' },
  { key: 'offer', title: 'Offer / increase / promotion', desc: '7 letter types, matches the branded SWL letterhead exactly', category: 'New hire & offers' },

  { key: 'writeup', title: 'Write-up', desc: 'Lives in Disciplinary actions — matches the SWL warning form', linkout: 'discipline.html', category: 'Performance & conduct' },
  { key: 'pip', title: 'Performance Improvement Plan', desc: 'PIP with a four-check-in schedule', category: 'Performance & conduct' },
  { key: 'review', title: '30 / 60 / 90 review', desc: 'Matches the SWL new-hire review template', category: 'Performance & conduct' },

  { key: 'termination', title: 'Termination', desc: 'Matches the SWL termination form — log, generate, and import', category: 'Separation' },

  { key: 'timecard', title: 'Time card adjustment', desc: 'Employee-signed record of an Aspire punch correction — print, sign, file', category: 'Pay & time' },
  { key: 'mealpenalty', title: 'Missed meal period', desc: 'Documents a missed/delayed break, the CA meal premium owed, and whether a late lunch was still given', category: 'Pay & time' },
  { key: 'mealwaiver2', title: 'Second Meal Period Waiver', desc: 'For emergency-hours days past 10 hours — matches the SWL waiver form, English or Spanish, saves to Documents', category: 'Pay & time' },

  { key: 'refusal', title: 'Medical Treatment Refusal', desc: 'Matches the SWL acknowledgment form — English or Spanish, saves to Documents', category: 'Safety' },
  { key: 'incidentreport', title: 'Incident Report', desc: 'Log a new incident — injury/near miss/property damage/vehicle accident, matches SWL Form 7.3, signed by manager and employee', category: 'Safety' },

  { key: 'sop', title: 'SOP', desc: 'Standard Operating Procedure — matches the real SWL SOP format, saves to Documents', category: 'Reference library' },
  { key: 'jobdesc', title: 'Job description', desc: 'Matches the real SWL Job Description format — English or Spanish, saves to Documents', category: 'Reference library' },
];

const CATEGORY_ORDER = ['New hire & offers', 'Performance & conduct', 'Separation', 'Pay & time', 'Safety', 'Reference library'];

document.getElementById('tiles').innerHTML = CATEGORY_ORDER.map((cat) => `
  <div class="gen-category">
    <div class="lh" style="margin-top:0">${cat}</div>
    <div class="gen-menu" style="margin-bottom:0">
      ${GENERATORS.filter((g) => g.category === cat).map((g) => `
        <button class="gen-tile${g.linkout ? ' linkout' : ''}" data-key="${g.key}" type="button">
          <h4>${g.title}</h4>
          <p>${g.desc}</p>
        </button>
      `).join('')}
    </div>
  </div>
`).join('');

document.querySelectorAll('.gen-tile').forEach((btn) => {
  const g = GENERATORS.find((x) => x.key === btn.dataset.key);
  btn.addEventListener('click', () => {
    if (g.linkout) { window.location.href = g.linkout; return; }
    openGenerator(g.key);
  });
});

document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('menu-view').hidden = false;
  document.getElementById('gen-view').hidden = true;
  document.getElementById('page-title').textContent = 'Document generator';
});
document.getElementById('print-btn').addEventListener('click', () => window.print());

// When a document has already been filled in (and maybe signed) and HR
// switches the language dropdown, this re-renders just the already-
// generated sheet in the new language using the same entered data,
// instead of rebuilding the blank form from scratch. Each render*Sheet
// function below sets this right after it draws — to a zero-arg-minus-
// lang function that redraws itself — and clears it isn't relevant once
// a fresh generator is opened. Nothing here re-translates free-text
// fields (like a typed-in reason) — only the form's own labels and
// boilerplate, which were already written bilingually.
let sheetRerender = null;
document.getElementById('lang-select').addEventListener('change', () => {
  const lang = document.getElementById('lang-select').value;
  if (sheetRerender) sheetRerender(lang);
  else renderCurrent();
});

let employees = [];       // active only — for "who can this happen to" selects
let allEmployeesEver = []; // includes terminated — for name lookups on old records
let managerIds = new Set(); // set in Settings — who shows up in "Reports to" on letters
let staff = []; // users collection — who a follow-up task can be assigned to
let currentKey = null;

async function loadEmployees() {
  const snap = await getDocs(collection(db, 'employees'));
  allEmployeesEver = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  employees = allEmployeesEver.filter((e) => e.status !== 'terminated');
}

async function loadManagerIds() {
  const snap = await getDoc(doc(db, 'settings', 'managers'));
  managerIds = new Set(snap.exists() ? (snap.data().employee_ids || []) : []);
}

async function loadStaff() {
  const snap = await getDocs(collection(db, 'users'));
  staff = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
}

let departmentList = [];
async function loadDepartmentList() {
  const snap = await getDoc(doc(db, 'settings', 'departments'));
  departmentList = snap.exists() ? (snap.data().values || []).filter((v) => v.active !== false).map((v) => v.label) : [];
}

function empSelectOptions(list = employees) {
  return list
    .slice()
    .sort((a, b) => (a.first_name || '').localeCompare(b.first_name || ''))
    .map((e) => `<option value="${e.id}">${e.first_name} ${e.last_name} (${e.id})</option>`).join('');
}

// Type-ahead employee picker — a text box with a datalist that narrows
// by name as you type, plus a hidden input that holds the resolved
// employee id. Every generator reads `${id}`'s value expecting an
// employee id, exactly like it did with the old <select>, so this is a
// drop-in replacement: only the markup and the wireEmpSearch() call are
// new, nothing that reads the value elsewhere has to change.
function empSearchFieldHtml(id, labelHtml, list = employees) {
  const sorted = list.slice().sort((a, b) => (a.first_name || '').localeCompare(b.first_name || ''));
  const opts = sorted.map((e) => `<option value="${escapeHtml(`${e.first_name} ${e.last_name} (${e.id})`)}">`).join('');
  return `
    <div class="field">
      ${labelHtml}
      <input class="f-in" id="${id}-search" list="${id}-opts" placeholder="Type a name…" autocomplete="off">
      <datalist id="${id}-opts">${opts}</datalist>
      <input type="hidden" id="${id}">
    </div>
  `;
}

// Call once right after inserting empSearchFieldHtml()'s markup into the
// page — wires the visible text box to resolve into the hidden id field,
// and re-dispatches "change" on the hidden input so existing listeners
// on it (e.g. auto-filling a title from "Reports to") keep working.
function wireEmpSearch(id, list = employees) {
  const search = document.getElementById(`${id}-search`);
  const hidden = document.getElementById(id);
  if (!search || !hidden) return;
  const resolve = () => {
    const m = search.value.match(/\(([^()]+)\)\s*$/);
    const match = m && list.find((e) => e.id === m[1]);
    const newVal = match ? match.id : '';
    const changed = hidden.value !== newVal;
    hidden.value = newVal;
    if (changed) hidden.dispatchEvent(new Event('change'));
  };
  search.addEventListener('input', resolve);
  search.addEventListener('change', resolve);
}

// Sets a type-ahead employee field programmatically (loading a saved
// record, following a deep link) — updates both the visible search text
// and the hidden resolved id, since setting the hidden input alone would
// leave the text box blank or stale.
function setEmpField(id, empId, list = employees) {
  const emp = list.find((e) => e.id === empId);
  const search = document.getElementById(`${id}-search`);
  const hidden = document.getElementById(id);
  if (!search || !hidden) return;
  search.value = emp ? `${emp.first_name} ${emp.last_name} (${emp.id})` : '';
  hidden.value = emp ? emp.id : '';
}

function openGenerator(key) {
  currentKey = key;
  pendingSigDocId = null;
  pendingSigTaskId = null;
  sheetRerender = null;
  document.getElementById('menu-view').hidden = true;
  document.getElementById('gen-view').hidden = false;
  document.getElementById('page-title').textContent = GENERATORS.find((g) => g.key === key).title;
  // Write-up, Termination, and 30/60/90 Review reproduce real SWL forms
  // exactly as supplied — those forms are English-only, so the language
  // toggle only applies to PIP, Onboarding, and the letters (which manage
  // English/Spanish through their own letter-type list instead).
  document.getElementById('lang-select').style.display = (key === 'pip' || key === 'onboarding' || key === 'refusal' || key === 'jobdesc' || key === 'timecard' || key === 'mealpenalty' || key === 'mealwaiver2' || key === 'review' || key === 'termination' || key === 'incidentreport') ? '' : 'none';
  renderCurrent();
}

function renderCurrent() {
  const lang = document.getElementById('lang-select').value;
  if (currentKey === 'pip') renderPip(lang);
  if (currentKey === 'review') renderReview();
  if (currentKey === 'termination') renderTermination();
  if (currentKey === 'offer') renderLetters();
  if (currentKey === 'onboarding') renderOnboarding(lang);
  if (currentKey === 'refusal') renderRefusal(lang);
  if (currentKey === 'sop') renderSop();
  if (currentKey === 'jobdesc') renderJobDescription(lang);
  if (currentKey === 'timecard') renderTimecard(lang);
  if (currentKey === 'mealpenalty') renderMealPenalty(lang);
  if (currentKey === 'mealwaiver2') renderMealWaiver2(lang);
  if (currentKey === 'incidentreport') renderIncidentReport();
}

// ---- PIP ----

function renderPip(lang) {
  const t = T[lang];
  document.getElementById('gen-body').innerHTML = `
    <div class="card no-print" style="margin-bottom:16px">
      <div class="card-body">
        <div class="frow">
          ${empSearchFieldHtml('pip-emp', '<label class="f-lab">' + t.employee + '</label>')}
          <div class="field"><label class="f-lab">Start date</label><input class="f-in" id="pip-start" type="date"></div>
        </div>
        <div class="field"><label class="f-lab">Final review date</label><input class="f-in" id="pip-final" type="date"></div>
        <div class="field"><label class="f-lab">Performance gaps (use specific behaviors and dates, not generalities)</label><textarea class="f-in" id="pip-gaps" rows="3" style="resize:vertical"></textarea></div>
        <div class="field"><label class="f-lab">Expectations going forward (specific, measurable, time-bound)</label><textarea class="f-in" id="pip-expect" rows="3" style="resize:vertical"></textarea></div>
        <div class="field">
          <label class="f-lab">Support provided</label>
          <label style="display:block;font-size:12.5px;margin-bottom:4px"><input type="checkbox" class="pip-support" value="Additional training"> Additional training</label>
          <label style="display:block;font-size:12.5px;margin-bottom:4px"><input type="checkbox" class="pip-support" value="Regular check-ins"> Regular check-ins</label>
          <label style="display:block;font-size:12.5px;margin-bottom:4px"><input type="checkbox" class="pip-support" value="Written resources"> Written resources</label>
          <label style="display:block;font-size:12.5px"><input type="checkbox" class="pip-support" value="Shadowing"> Shadowing a peer</label>
        </div>
        <button class="gh solid" id="pip-generate-btn" type="button">Generate &amp; file</button>
      </div>
    </div>
    <div class="doc-sheet" id="pip-sheet" hidden></div>
  `;
  wireEmpSearch('pip-emp');

  document.getElementById('pip-generate-btn').addEventListener('click', async () => {
    const empId = document.getElementById('pip-emp').value;
    const emp = employees.find((e) => e.id === empId);
    if (!emp) { showToast('Select an employee.', 'error'); return; }
    const start = document.getElementById('pip-start').value;
    const final = document.getElementById('pip-final').value;
    const gaps = document.getElementById('pip-gaps').value.trim();
    const expect = document.getElementById('pip-expect').value.trim();
    const support = [...document.querySelectorAll('.pip-support:checked')].map((c) => c.value);

    if (!start || !final) { showToast('Start and final review dates are required.', 'error'); return; }

    const checkIns = [];
    const startD = new Date(start + 'T00:00:00'), finalD = new Date(final + 'T00:00:00');
    const span = (finalD - startD) / 4;
    for (let i = 1; i <= 4; i++) {
      checkIns.push(new Date(startD.getTime() + span * i).toISOString().slice(0, 10));
    }

    try {
      const pipRef = doc(collection(db, 'pips'));
      const batch = writeBatch(db);
      batch.set(pipRef, {
        emp_id: empId, division: emp.division || '', start_date: start, final_review_date: final,
        performance_gaps: gaps, expectations: expect, support_provided: support, check_ins: checkIns,
        entered_by: profile.uid, entered_at: serverTimestamp(),
      });
      checkIns.forEach((d, i) => {
        batch.set(doc(collection(db, 'tasks')), {
          assigned_to: profile.uid, due_date: d,
          instructions: `PIP check-in ${i + 1} of 4 — ${emp.first_name} ${emp.last_name}`,
          recurring: 'none', status: 'open', entered_by: profile.uid, entered_at: serverTimestamp(),
        });
      });
      await batch.commit();
      await addDoc(collection(db, 'activity'), {
        module: 'documents', item: `PIP generated — ${emp.first_name} ${emp.last_name}`,
        entered_by: profile.uid, entered_at: serverTimestamp(),
      });
      showToast('PIP filed. 4 check-in tasks created.');
      renderPipSheet(lang, emp, { start, final, gaps, expect, support, checkIns, pipId: pipRef.id });
    } catch (err) {
      console.error(err);
      showToast('Could not save — ' + err.message, 'error');
    }
  });
}

function renderPipSheet(lang, emp, p) {
  const t = T[lang];
  const isEs = lang === 'es';
  const sheet = document.getElementById('pip-sheet');
  sheet.hidden = false;
  sheet.innerHTML = `
    <div class="doc-bar">${isEs ? 'Plan de Mejora del Desempeño' : 'Performance Improvement Plan'}</div>
    <div class="doc-body">
      <div class="doc-grid">
        <div><b>${t.employee}</b>${emp.first_name} ${emp.last_name}</div>
        <div><b>${t.id}</b>${emp.id}</div>
        <div><b>${t.title}</b>${emp.position || ''}</div>
        <div><b>${t.division}</b>${emp.division || ''}</div>
        <div><b>${isEs ? 'Fecha de inicio' : 'Start date'}</b>${formatDate(p.start)}</div>
        <div><b>${isEs ? 'Revisión final' : 'Final review'}</b>${formatDate(p.final)}</div>
      </div>
      <h4>${isEs ? 'Brechas de desempeño' : 'Performance gaps'}</h4>
      <p>${p.gaps || '—'}</p>
      <h4>${isEs ? 'Expectativas' : 'Expectations going forward'}</h4>
      <p>${p.expect || '—'}</p>

function readReviewForm(milestone) {
  const ratings = REVIEW_AREAS.map((a, i) => ({
    area: a,
    rating: document.querySelector(`input[name="rev${milestone}-area${i}"]:checked`).value,
    comment: document.getElementById(`rev${milestone}-comment-${i}`).value.trim(),
  }));
  const otherLabel = document.getElementById(`rev${milestone}-other-label`).value.trim();
  if (otherLabel) {
    ratings.push({
      area: `Other: ${otherLabel}`,
      rating: document.querySelector(`input[name="rev${milestone}-areaOther"]:checked`).value,
      comment: document.getElementById(`rev${milestone}-other-comment`).value.trim(),
    });
  }
  const onTrack = document.getElementById(`rev${milestone}-ontrack`).value;
  const notes = document.getElementById(`rev${milestone}-notes`).value.trim();
  const data = { ratings, on_track: onTrack, manager_notes: notes };
  if (milestone === 90) {
    data.overall = document.getElementById('rev90-overall').value;
    data.recommend = document.getElementById('rev90-recommend').value;
    data.extend_date = document.getElementById('rev90-extend-date').value;
    data.other_recommend = document.getElementById('rev90-other-recommend').value.trim();
    data.overall_comments = document.getElementById('rev90-overall-comments').value.trim();
    data.employee_comments = document.getElementById('rev90-employee-comments').value.trim();
  }
  return data;
}

function renderReview() {
  document.getElementById('gen-body').innerHTML = `
    <div class="card no-print" style="margin-bottom:16px">
      <div class="card-body">
        ${empSearchFieldHtml('rev-emp', '<label class="f-lab">Employee</label>')}
      </div>
    </div>

    ${reviewFormHtml(60)}
    ${reviewFormHtml(90)}
    <div class="form-doc" id="rev-sheet" hidden></div>
  `;
  wireEmpSearch('rev-emp');

  [30, 60, 90].forEach((milestone) => {
    document.getElementById(`rev${milestone}-generate-btn`).addEventListener('click', async () => {
      const empId = document.getElementById('rev-emp').value;
      const emp = employees.find((e) => e.id === empId);
      if (!emp) { showToast('Select an employee.', 'error'); return; }
      const data = readReviewForm(milestone);
      const notOnTrack = data.on_track === 'no';

      try {
        await setDoc(doc(db, 'employees', empId, 'reviews', String(milestone)), {
          ...data, review_completed: true, entered_by: profile.uid, updated_at: serverTimestamp(),
        }, { merge: true });
        await addDoc(collection(db, 'activity'), {
          module: 'reviews', item: `${milestone}-day review generated — ${emp.first_name} ${emp.last_name}`,
          entered_by: profile.uid, entered_at: serverTimestamp(),
        });
        if (notOnTrack) {
          await addDoc(collection(db, 'tasks'), {
            assigned_to: profile.uid, due_date: new Date().toISOString().slice(0, 10),
            instructions: `Not on track — ${milestone}-day review for ${emp.first_name} ${emp.last_name} routed to HR`,
            recurring: 'none', status: 'open', entered_by: profile.uid, entered_at: serverTimestamp(),
          });
        }
        showToast('Review saved.' + (notOnTrack ? ' Routed to HR as a task.' : ''));
        renderReviewSheet(emp, milestone, data, document.getElementById('lang-select').value);
      } catch (err) {
        console.error(err);
        showToast('Could not save — ' + err.message, 'error');
      }
    });
  });
}

function termAccessor(key) {
  return {
    date: (r) => r.termination_date || '',
    name: (r) => (r.emp_name || '').toLowerCase(),
    division: (r) => (r.division || '').toLowerCase(),
    location: (r) => (r.location || '').toLowerCase(),
    reason: (r) => (r.reason || '').toLowerCase(),
    type: (r) => (r.separation_type || ''),
  }[key];
}

function renderTermRows() {
  const q = document.getElementById('term-search').value.trim().toLowerCase();
  const visible = terminations.filter((r) => !q || `${r.emp_name} ${r.division} ${r.reason}`.toLowerCase().includes(q));
  const acc = termAccessor(termSortKey) || termAccessor('date');
  visible.sort((a, b) => {
    const av = acc(a), bv = acc(b);
    const cmp = String(av).localeCompare(String(bv));
    return termSortDir === 'asc' ? cmp : -cmp;
  });
  document.querySelectorAll('#term-head-row .sortable').forEach((th) => {
    th.querySelector('.sort-arrow').textContent = th.dataset.key === termSortKey ? (termSortDir === 'asc' ? ' ▲' : ' ▼') : '';
  });
  document.getElementById('term-summary').textContent = `${visible.length} of ${terminations.length}`;
  document.getElementById('term-rows').innerHTML = visible.length ? visible.map((r) => `
    <tr class="row-clickable" data-id="${r.id}" style="cursor:pointer">
      <td class="mono">${formatDate(r.termination_date)}</td>
      <td>${escapeHtml(r.emp_name || '—')}</td>
      <td class="mono dim">${escapeHtml(r.division || '—')}</td>
      <td class="mono dim">${escapeHtml(r.location || '—')}</td>
      <td>${escapeHtml(r.reason || '—')}</td>
      <td>${r.separation_type === 'involuntary' ? '<span class="pill bad">Involuntary</span>' : '<span class="pill ok">Voluntary</span>'}</td>
      <td class="dim term-notes-cell" data-id="${r.id}" style="cursor:pointer" title="Click to add or edit">${escapeHtml(r.circumstances || '— click to add')}</td>
    </tr>
  `).join('') : '<tr><td colspan="7" class="dim">No terminations logged yet.</td></tr>';
  document.querySelectorAll('#term-rows tr').forEach((tr) => {
    tr.addEventListener('click', (e) => {
      if (e.target.closest('.term-notes-cell')) return; // handled separately below
      const rec = terminations.find((r) => r.id === tr.dataset.id);
      if (rec) {
        document.getElementById('term-print-acts').hidden = false;
        renderTerminationSheet(rec, {}, document.getElementById('lang-select').value);
      }
    });
  });
  // Exit-interview detail usually comes in after the termination is
  // already registered — this is the only field on a termination record
  // meant to be added or revised later, so it's editable straight from
  // the list instead of requiring the whole record to be reopened.
  document.querySelectorAll('.term-notes-cell').forEach((cell) => {
    cell.addEventListener('click', async (e) => {
      e.stopPropagation();
      const rec = terminations.find((r) => r.id === cell.dataset.id);
      if (!rec) return;
      const updated = prompt(`Notes / exit interview — ${rec.emp_name}`, rec.circumstances || '');
      if (updated === null) return;
      try {
        await updateDoc(doc(db, 'terminations', rec.id), { circumstances: updated.trim(), entered_by: profile.uid });
        rec.circumstances = updated.trim();
        renderTermRows();
        showToast('Note saved.');
      } catch (err) {
        console.error(err);
        showToast('Could not save — ' + err.message, 'error');
      }
    });
  });
}

// Reads the form into {record, finalPay} without touching Firestore —
// shared by both Print (never saves) and Register (saves record, not
// finalPay). Only needs an employee selected; nothing else is required
// to print, since printing shouldn't depend on the record being
// complete or on Firestore being reachable at all.
function buildTerminationRecord() {
  const empId = document.getElementById('term-emp').value;
  const emp = employees.find((e) => e.id === empId);
  if (!emp) { showToast('Select an employee.', 'error'); return null; }
  let reason = document.getElementById('term-reason').value;
  if (reason === 'Other') reason = document.getElementById('term-reason-other').value.trim() || 'Other';

  const propertyReturned = [...document.querySelectorAll('.term-property:checked')].map((c) => c.value);
  const notices = NOTICE_ITEMS.map((n) => ({
    key: n.key, label: n.label,
    status: document.getElementById(`term-notice-${n.key}`).value,
    date: document.getElementById(`term-notice-${n.key}-date`).value,
  }));

  const record = {
    emp_id: empId, emp_name: `${emp.first_name} ${emp.last_name}`,
    job_title: emp.position || '', division: emp.division || '', location: emp.location || '',
    hire_date: emp.hire_date || '',
    last_day_worked: document.getElementById('term-lastday').value,
    termination_date: document.getElementById('term-date').value,
    reason, circumstances: document.getElementById('term-circumstances').value.trim(),
    separation_type: involuntaryReasons.has(reason) ? 'involuntary' : 'voluntary',
    delivery_method: document.getElementById('term-delivery-method').value,
    property_returned: propertyReturned,
    notices,
    delivered_by: document.getElementById('term-delivered-by').value.trim(),
    date_delivered: document.getElementById('term-date-delivered').value,
    notice_delivery_method: document.getElementById('term-notice-delivery').value,
  };

  // Final-pay figures never join `record` above — they're read straight
  // from the form into the print sheet only, then discarded.
  const finalPay = {
    regHours: document.getElementById('term-reg-hours').value,
    otHours: document.getElementById('term-ot-hours').value,
    vac: document.getElementById('term-vac').value,
    sick: document.getElementById('term-sick').value,
    cmp: document.getElementById('term-cmp').value,
    other: document.getElementById('term-other-pay').value,
    amount: document.getElementById('term-final-wages').value,
    checkDate: document.getElementById('term-final-check-date').value,
  };
  return { record, finalPay };
}

function printTermination() {
  const built = buildTerminationRecord();
  if (!built) return;
  document.getElementById('term-print-acts').hidden = false;
  renderTerminationSheet(built.record, built.finalPay, document.getElementById('lang-select').value);
}

async function registerTermination() {
  const built = buildTerminationRecord();
  if (!built) return;
  const { record } = built;
  if (!record.last_day_worked || !record.termination_date) {
    showToast('Last day worked and termination date are required to register.', 'error');
    return;
  }

  try {
    const batch = writeBatch(db);
    const termRef = doc(collection(db, 'terminations'));
    batch.set(termRef, { ...record, entered_by: profile.uid, entered_at: serverTimestamp() });
    batch.update(doc(db, 'employees', record.emp_id), {
      status: 'terminated', separation_date: record.termination_date, separation_type: record.separation_type,
      entered_by: profile.uid, updated_at: serverTimestamp(),
    });
    await batch.commit();
    await addDoc(collection(db, 'activity'), {
      module: 'documents', item: `Termination registered — ${record.emp_name}`,
      entered_by: profile.uid, entered_at: serverTimestamp(),
    });
    showToast('Registered — reflects in reports now. No final-pay figures were saved.');
    await loadEmployees();
    terminations.push({ id: termRef.id, ...record });
    document.getElementById('term-form-card').hidden = true;
    renderTermRows();
  } catch (err) {
    console.error(err);
    showToast('Could not register — ' + err.message, 'error');
  }
}

      <div class="form-box"><b style="display:block;font-size:10px;text-transform:uppercase;color:#333;margin-bottom:3px">${isEs ? 'Reconocimiento del Empleado' : 'Employee Acknowledgement'}</b>${isEs ? 'Reconozco haber recibido este aviso de terminación e información sobre el pago final.' : 'I acknowledge receipt of this termination notice and final pay information.'}</div>
      <div class="form-section">${isEs ? 'Firma Electrónica del Empleado' : 'Employee Electronic Signature'}</div>
      <div style="border:1px solid #999;background:#fafafa;margin-bottom:6px">
        <canvas id="term-sig-pad" style="width:100%;height:110px;display:block;cursor:crosshair;touch-action:none"></canvas>
      </div>
      <button type="button" class="gh no-print" id="term-sig-clear" style="margin-bottom:10px">${isEs ? 'Borrar firma' : 'Clear signature'}</button>
      <div class="form-section">${isEs ? 'Firma Electrónica del Gerente / RH' : 'Manager / HR Electronic Signature'}</div>
      ${signaturePadHtml('term-mgr-sig-pad', 'term-mgr-sig-clear')}
      <button type="button" class="gh solid no-print" id="term-sig-save" style="margin-bottom:10px;margin-left:8px">${isEs ? 'Firmado — guardar' : 'Signed — save'}</button>

      <div class="form-atwill"><b>${isEs ? 'Recordatorio de Empleo a Voluntad:' : 'At-will Employment Reminder:'}</b> ${isEs ? 'El empleo con la compañía es a voluntad ("at-will"). Nada en este documento altera ese estatus ni crea un contrato de empleo.' : 'Employment with the company is at-will. Nothing in this document alters that status or creates a contract of employment.'}</div>
    </div>
  `;
  setUpSignaturePad('term-sig-pad', 'term-sig-clear');
  setUpSignaturePad('term-mgr-sig-pad', 'term-mgr-sig-clear');
  document.getElementById('term-sig-save').addEventListener('click', async () => {
    if (!r.id) { showToast('Register this termination first, then reopen it from the list to save a signature.', 'error'); return; }
    const empState = sigPads['term-sig-pad'];
    const mgrState = sigPads['term-mgr-sig-pad'];
    if (!(empState?.hasStroke) && !(mgrState?.hasStroke)) {
      showToast('Get at least one signature first — both pads are empty.', 'error'); return;
    }
    try {
      const update = { signed_at: serverTimestamp(), signed_by: profile.uid };
      if (empState?.hasStroke) update.signature_data_url = document.getElementById('term-sig-pad').toDataURL('image/png');
      if (mgrState?.hasStroke) update.manager_signature_data_url = document.getElementById('term-mgr-sig-pad').toDataURL('image/png');
      await updateDoc(doc(db, 'terminations', r.id), update);
      if (pendingSigTaskId) {
        await updateDoc(doc(db, 'tasks', pendingSigTaskId), { status: 'complete', completed_at: serverTimestamp(), completed_by: profile.uid });
        pendingSigDocId = null; pendingSigTaskId = null;
      }
      showToast('Signature saved.');
    } catch (err) {
      console.error(err);
      showToast('Could not save — ' + err.message, 'error');
    }
  });
  if (r.id) {
    document.getElementById('term-sig-later-btn').addEventListener('click', () => createSignatureFollowupTask('term', {
      linkedDocType: 'termination', linkedDocId: r.id, title: `Termination — ${r.emp_name}`,
    }));
  }
  sheetRerender = (l) => withPreservedSignature('term-mgr-sig-pad', () => withPreservedSignature('term-sig-pad', () => renderTerminationSheet(r, finalPay, l)));
}

// ---- Termination import — reads the "Terminations" sheet of the roster
// workbook. Upserts: existing employees get their status flipped and a
// terminations record filed; employees not currently in the roster (left
// before the roster snapshot) get a minimal terminated-status record
// created so history isn't lost. No pay figures exist in this sheet. ----

async function openTermImport() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="width:820px">
      <div class="modal-h"><h3>Import terminations</h3><button class="modal-close" id="ti-close" type="button">&times;</button></div>
      <div class="modal-body">
        <div id="ti-pick">
          <p class="dim" style="margin-bottom:10px">.xlsx or .csv. Looks for a sheet named "Terminations" first, otherwise the first sheet. Employee ID, name, and termination date are required per row.</p>
          <input class="f-in" id="ti-file" type="file" accept=".csv,text/csv,.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
        </div>
        <div id="ti-preview" hidden>
          <div id="ti-warnings"></div>
          <p id="ti-summary" style="margin:10px 0"></p>
          <div style="max-height:360px;overflow-y:auto;border:1px solid var(--edge)">
            <table>
              <thead><tr><th>Row</th><th>ID</th><th>Name</th><th>Term date</th><th>Reason</th><th>Status</th></tr></thead>
              <tbody id="ti-rows"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="gh" id="ti-cancel">Cancel</button>
        <button type="button" class="gh solid" id="ti-confirm" hidden>Import valid rows</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector('#ti-close').addEventListener('click', close);
  overlay.querySelector('#ti-cancel').addEventListener('click', close);

  // Same branch-code aliases as the roster import — the source sheets use
  // short codes (ENH, Corp) that don't match the Location dropdown values.
  const LOCATION_ALIASES = { enh: 'Enhancements', corp: 'Corporate' };
  const normalizeLocation = (raw) => {
    const v = String(raw || '').trim();
    return LOCATION_ALIASES[v.toLowerCase()] || v;
  };
  let parsed = [];

  overlay.querySelector('#ti-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const fileInput = overlay.querySelector('#ti-file');
    fileInput.disabled = true;
    overlay.querySelector('#ti-warnings').innerHTML = '<p class="dim">Reading file…</p>';
    try {
      const sheets = await readSpreadsheetSheets(file);
      const sheetName = Object.keys(sheets).find((n) => /terminat/i.test(n)) || Object.keys(sheets)[0];
      const { headers, rows, forbiddenColumns } = objectsFromRows(sheets[sheetName], [
        'Employee ID', 'Name', 'Job Title', 'Division', 'Branch', 'Manager', 'Term Date', 'Last Day', 'Reason',
      ]);
      const pick = (row, ...keys) => { for (const k of keys) if (row[k]) return row[k]; return ''; };
      const dateVal = (v) => {
        if (!v) return '';
        const d = v instanceof Date ? v : new Date(v);
        return Number.isNaN(d.getTime()) ? '' : d.toISOString().slice(0, 10);
      };
      const nameToId = new Map(allEmployeesEver.map((e) => [`${e.first_name} ${e.last_name}`.trim().toLowerCase(), e.id]));

      parsed = rows.map((row) => {
        const id = pick(row, 'employee_id', 'id').toString().trim();
        const name = pick(row, 'name', 'employee_name').toString().trim();
        const termDate = dateVal(pick(row, 'term_date', 'termination_date'));
        const errors = [];
        if (!id || !/^[a-z0-9-]+$/i.test(id)) errors.push('missing/invalid Employee ID — likely a summary or note row, not a record');
        if (!name) errors.push('missing name');
        if (!termDate) errors.push('missing/invalid term date');
        // Real export has "Reason (as entered)" plus a separately-computed
        // "Separation Type" column — only the raw reason is read here,
        // since involuntary/voluntary is re-derived below from the text.
        const reason = pick(row, 'reason_as_entered', 'reason').toString().trim();
        const separationTypeRaw = pick(row, 'separation_type').toString().trim().toLowerCase();
        return {
          id, name, job_title: pick(row, 'job_title', 'title'),
          division: pick(row, 'division'), location: normalizeLocation(pick(row, 'branch', 'location')),
          hire_date: dateVal(pick(row, 'hire_date')),
          last_day: dateVal(pick(row, 'last_day')),
          term_date: termDate,
          reason, notes: pick(row, 'notes'),
          // Some source sheets already have this computed — trust it over
          // guessing from reason-text keywords when it's present.
          separation_type: separationTypeRaw === 'involuntary' || separationTypeRaw === 'voluntary' ? separationTypeRaw : null,
          exists: allEmployeesEver.some((e) => e.id === id),
          errors,
        };
      });

      const validCount = parsed.filter((r) => !r.errors.length).length;
      const warnings = [];
      if (forbiddenColumns.length) warnings.push(`Ignored, never imported: ${forbiddenColumns.join(', ')}`);
      overlay.querySelector('#ti-warnings').innerHTML = warnings.length
        ? `<div class="login-error" style="background:var(--hover);color:var(--alertTx);border-color:var(--alertTx)">${warnings.join('<br>')}</div>` : '';
      // Shows exactly what column names this file was parsed with, so a
      // mismatch (wrong header row picked, an unexpected column name) is
      // visible right here instead of showing up as blank cells with no
      // explanation of why.
      const detectedNote = document.createElement('p');
      detectedNote.className = 'dim';
      detectedNote.style.cssText = 'margin:6px 0;font-size:11.5px';
      detectedNote.textContent = `Columns detected from sheet "${sheetName}": ${headers.filter(Boolean).join(', ')}`;
      overlay.querySelector('#ti-warnings').appendChild(detectedNote);
      overlay.querySelector('#ti-summary').textContent = `${validCount} of ${parsed.length} rows will be imported. ${parsed.length - validCount} skipped (summary/note rows or missing data).`;
      overlay.querySelector('#ti-rows').innerHTML = parsed.map((r, i) => `
        <tr>
          <td class="mono dim">${i + 1}</td>
          <td class="mono">${escapeHtml(r.id)}</td>
          <td>${escapeHtml(r.name)}</td>
          <td class="mono">${r.term_date || '—'}</td>
          <td class="dim">${escapeHtml(r.reason)}</td>
          <td>${r.errors.length ? `<span class="pill bad">${r.errors.join(', ')}</span>` : `<span class="pill ok">${r.exists ? 'Updates existing employee' : 'Creates historical record'}</span>`}</td>
        </tr>
      `).join('');
      overlay.querySelector('#ti-pick').hidden = true;
      overlay.querySelector('#ti-preview').hidden = false;
      overlay.querySelector('#ti-confirm').hidden = validCount === 0;
    } catch (err) {
      console.error(err);
      overlay.querySelector('#ti-warnings').innerHTML =
        `<div class="login-error" style="background:var(--hover);color:var(--alertTx);border-color:var(--alertTx)">Could not read that file — ${escapeHtml(err.message)}</div>`;
      fileInput.disabled = false;
    }
  });

  overlay.querySelector('#ti-confirm').addEventListener('click', async () => {
    const valid = parsed.filter((r) => !r.errors.length);
    try {
      for (let start = 0; start < valid.length; start += 50) {
        const chunk = valid.slice(start, start + 50);
        const batch = writeBatch(db);
        chunk.forEach((r) => {
          const separationType = r.separation_type
            || (/involuntary|policy|performance|attendance|layoff|elimination|not a fit|terminat/i.test(r.reason) ? 'involuntary' : 'voluntary');
          const termRef = doc(collection(db, 'terminations'));
          batch.set(termRef, {
            emp_id: r.id, emp_name: r.name, job_title: r.job_title, division: r.division, location: r.location,
            hire_date: r.hire_date, last_day_worked: r.last_day, termination_date: r.term_date,
            reason: r.reason, circumstances: r.notes, separation_type: separationType,
            entered_by: profile.uid, entered_at: serverTimestamp(),
          });
          const empRef = doc(db, 'employees', r.id);
          if (r.exists) {
            batch.update(empRef, { status: 'terminated', separation_date: r.term_date, separation_type: separationType, entered_by: profile.uid, updated_at: serverTimestamp() });
          } else {
            const [first_name, ...rest] = r.name.split(' ');
            batch.set(empRef, {
              first_name, last_name: rest.join(' '), division: r.division, location: r.location,
              position: r.job_title, hire_date: r.hire_date, status: 'terminated',
              separation_date: r.term_date, separation_type: separationType,
              entered_by: profile.uid, entered_at: serverTimestamp(),
            });
          }
        });
        await batch.commit();
      }
      await addDoc(collection(db, 'activity'), {
        module: 'documents', item: `Imported ${valid.length} termination records`,
        entered_by: profile.uid, entered_at: serverTimestamp(),
      });
      showToast(`Imported ${valid.length} termination records.`);
      await loadEmployees();
      await loadTerminations();
      renderTermRows();
      close();
    } catch (err) {
      console.error(err);
      showToast('Import failed — ' + err.message, 'error');
    }
  });
}

// ---- Offer / Increase / Promotion letters — reproduces the branded SWL
// letterhead tool exactly: same legal text, same letterhead/decor-band
// branding, same 7 letter types. Rate/salary are typed on the generator,
// printed, and never stored — same rule as everywhere else in this app.
// The pay-band reference table from that tool (Entry/Senior rates per
// role) is intentionally NOT carried over — that's exactly the kind of
// salary-band data CLAUDE.md says never to store, even as a static list
// baked into the app. Rate stays a manual entry, same as before. ----

const LETTER_TYPES = [
  { value: 'hourly-en', label: 'Hourly Offer Letter (English)', category: 'offer' },
  { value: 'hourly-es', label: 'Hourly Offer Letter (Español)', category: 'offer' },

  { value: 'increase-en', label: 'Wage Increase Letter (English)', category: 'increase' },
  { value: 'increase-es', label: 'Wage Increase Letter (Español)', category: 'increase' },
  { value: 'promotion-hourly', label: 'Promotion Letter — Hourly (English)', category: 'promotion' },
  { value: 'promotion-hourly-es', label: 'Promotion Letter — Hourly (Español)', category: 'promotion' },
  { value: 'promotion-salary', label: 'Promotion Letter — Salary (English)', category: 'promotion' },

];

        </div>

  document.querySelectorAll('#ltr-tabs .tab').forEach((tab) => {

    const type = typeSel.value;

      document.getElementById('ltr-schedule').value = loc.schedule;

    if (e.target.value) document.getElementById('ltr-schedule').value = e.target.value;
  });
  document.getElementById('ltr-reportsto').addEventListener('change', (e) => {
    const m = employees.find((x) => x.id === e.target.value);
    document.getElementById('ltr-reportsto-title').value = m ? (m.position || '') : '';
  });

  document.getElementById('ltr-generate-btn').addEventListener('click', () => generateLetterSheet());
  document.getElementById('ltr-log-btn').addEventListener('click', async () => {
    const first = document.getElementById('ltr-first').value.trim();
    const last = document.getElementById('ltr-last').value.trim();

    const type = typeSel.value;
    const label = LETTER_TYPES.find((t) => t.value === type)?.label || 'Letter';
    try {
      await addDoc(collection(db, 'activity'), {
        module: 'documents', item: `${label} sent — ${first} ${last}`,
        entered_by: profile.uid, entered_at: serverTimestamp(),
      });
      showToast('Logged — no rate or salary data was recorded.');
    } catch (err) {
      console.error(err);
      showToast('Could not log — ' + err.message, 'error');
    }
  });

function generateLetterSheet() {
  const type = document.getElementById('ltr-type').value;
  const first = document.getElementById('ltr-first').value.trim();
  const last = document.getElementById('ltr-last').value.trim();
  const branchKey = document.getElementById('ltr-branch').value;
  const loc = LOCATIONS[branchKey];
  const address = document.getElementById('ltr-address').value.trim();
  const schedule = document.getElementById('ltr-schedule').value.trim();
  const reportsToId = document.getElementById('ltr-reportsto').value;
  const reportsTo = employees.find((e) => e.id === reportsToId);
  const reportsToTitle = document.getElementById('ltr-reportsto-title').value.trim();
  const letterDate = document.getElementById('ltr-date').value;
  const startDate = document.getElementById('ltr-start').value;
  const returnDate = document.getElementById('ltr-return').value;
  const position = document.getElementById('ltr-position').value.trim();
  const empType = document.getElementById('ltr-emptype').value;
  const rate = parseFloat(document.getElementById('ltr-rate').value);
  const salary = parseFloat(document.getElementById('ltr-salary').value);

  if (!first || !last) return showToast('Enter the employee\'s name.', 'error');
  if (!loc) return showToast('Select a branch.', 'error');
  if (!address) return showToast('Enter a facility address.', 'error');
  if (!schedule) return showToast('Enter a schedule.', 'error');
  if (!reportsTo) return showToast('Select who this employee reports to.', 'error');
  if (!letterDate || !startDate || !returnDate) return showToast('Letter date, start date, and return-by date are all required.', 'error');
  const positionRequired = type !== 'increase-en' && type !== 'increase-es';
  if (positionRequired && !position) return showToast('Enter a position title.', 'error');
  const isSalaryType = type === 'salary' || type === 'salary-es' || type === 'promotion-salary' || type === 'promotion-salary-es';
  if (!isSalaryType && (!rate || rate <= 0)) return showToast('Enter a valid hourly rate.', 'error');
  if (isSalaryType && (!salary || salary <= 0)) return showToast('Enter a valid annual salary.', 'error');

  const isEs = type.endsWith('-es');
  const ctx = {
    name: `${first} ${last}`,
    date: longDate(letterDate, isEs), startDate: longDate(startDate, isEs), returnDate: longDate(returnDate, isEs),
    position, empType, rate, salary, address, schedule, branchLabel: loc.label,
    supervisorName: `${reportsTo.first_name} ${reportsTo.last_name}`,
    supervisorTitle: reportsToTitle || reportsTo.position || '',
  };

  const builders = {
    'hourly-en': buildHourlyEn, 'hourly-es': buildHourlyEs, salary: buildSalary, 'salary-es': buildSalaryEs,
    'increase-en': buildIncreaseEn, 'increase-es': buildIncreaseEs,
    'promotion-hourly': buildPromotionHourly, 'promotion-hourly-es': buildPromotionHourlyEs,
    'promotion-salary': buildPromotionSalary, 'promotion-salary-es': buildPromotionSalaryEs,
  };
  const sheet = document.getElementById('ltr-sheet');
  sheet.hidden = false;
  sheet.innerHTML = builders[type](ctx);
  sheet.scrollIntoView({ behavior: 'smooth' });
  setUpSignaturePad('ltr-sig-pad', 'ltr-sig-clear');
  showToast('Letter generated.');

  const record = letterRecordBase(type, {
    first, last, position, empType, address, schedule, branchLabel: loc.label,
    supervisorName: ctx.supervisorName, supervisorTitle: ctx.supervisorTitle,
    letterDate, startDate, returnDate,
  });

  document.getElementById('ltr-sig-save').addEventListener('click', async () => {
    const state = sigPads['ltr-sig-pad'];
    if (!state || !state.hasStroke) { showToast('Get a signature first — the pad is empty.', 'error'); return; }
    try {
      const docRef = pendingSigDocId ? doc(db, 'training_documents', pendingSigDocId) : doc(collection(db, 'training_documents'));
      await setDoc(docRef, {
        ...record, status: 'signed',
        signature_data_url: document.getElementById('ltr-sig-pad').toDataURL('image/png'),
        signed_by: profile.uid, signed_at: serverTimestamp(),
        entered_by: profile.uid, entered_at: serverTimestamp(),
      }, { merge: true });
      if (pendingSigTaskId) {
        await updateDoc(doc(db, 'tasks', pendingSigTaskId), { status: 'complete', completed_at: serverTimestamp(), completed_by: profile.uid });
        pendingSigDocId = null; pendingSigTaskId = null;
      }
      showToast('Signed and saved — find it any time in Documents.');
    } catch (err) {
      console.error(err);
      showToast('Could not save — ' + err.message, 'error');
    }
  });
  document.getElementById('ltr-sig-later-btn').addEventListener('click', async () => {
    const assigneeId = document.getElementById('ltr-sig-assignee').value;
    const dueDate = document.getElementById('ltr-sig-due').value;
    if (!assigneeId || !dueDate) { showToast('Pick who should get the signature and by when.', 'error'); return; }
    const assignee = staff.find((s) => s.id === assigneeId);
    try {
      const docRef = doc(collection(db, 'training_documents'));
      await setDoc(docRef, { ...record, signature_data_url: null, entered_by: profile.uid, entered_at: serverTimestamp() });
      await addDoc(collection(db, 'tasks'), {
        assigned_to: assigneeId, due_date: dueDate,
        instructions: `Get signature — ${record.title}`,
        recurring: 'none', status: 'open', linked_doc_id: docRef.id, linked_doc_type: 'offer',
        entered_by: profile.uid, entered_at: serverTimestamp(),
      });
      showToast(`Saved. A task was created for ${assignee?.name || assigneeId} — open it from Tasks when ready to sign.`);
    } catch (err) {
      console.error(err);
      showToast('Could not save — ' + err.message, 'error');
    }
  });
}

function letterRecordBase(type, f) {
  const label = LETTER_TYPES.find((t) => t.value === type)?.label || 'Letter';
  return {
    content_type: 'letter', category: 'new_hire_offers', status: 'pending_signature',
    letter_type: type, letter_label: label, title: `${label} — ${f.first} ${f.last}`,
    emp_first: f.first, emp_last: f.last, emp_name: `${f.first} ${f.last}`,
    position: f.position, emp_type: f.empType, address: f.address, schedule: f.schedule,
    branch_label: f.branchLabel, supervisor_name: f.supervisorName, supervisor_title: f.supervisorTitle,
    letter_date: f.letterDate, start_date: f.startDate, return_date: f.returnDate,
    lang: type.endsWith('-es') ? 'es' : 'en',
  };
}

// Matches "Employee File Checklist" / "Lista de Verificación del

// documents themselves. Several (I-9, W-4, DE-4, Direct Deposit,
// Application with SSN) are exactly the data types this system never
// stores, so they stay physical/separate by design; this is only the
// checklist that says whether each one has been collected.
async function renderOnboarding(lang) {
  document.getElementById('gen-body').innerHTML = `
    <div class="card no-print" style="margin-bottom:16px">
      <div class="card-body">
        ${empSearchFieldHtml('onb-emp', '<label class="f-lab">New hire</label>', employees.filter((e) => e.status === 'onboarding'))}
        ${employees.some((e) => e.status === 'onboarding') ? '' : '<p class="dim">No one is currently in onboarding status.</p>'}
        <button class="gh solid" id="onb-load-btn" type="button">Load checklist</button>
      </div>
    </div>
    <div class="form-doc" id="onb-sheet" hidden></div>
  `;
  wireEmpSearch('onb-emp', employees.filter((e) => e.status === 'onboarding'));

  async function loadChecklist(empIdOverride) {
    const empId = empIdOverride || document.getElementById('onb-emp').value;
    const emp = employees.find((e) => e.id === empId);
    if (!emp) { showToast('Select a new hire.', 'error'); return; }
    const isEs = document.getElementById('lang-select').value === 'es';
    const snap = await getDocs(collection(db, 'employees', empId, 'onboarding_docs'));
    const existing = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));

    // If this employee predates the real 24-item list (or was seeded
    // with the old 4-item placeholder), fill in whatever's missing so
    // the checklist always shows the full real list.
    const items = ONBOARDING_CHECKLIST.map((docItem, i) => {
      const found = [...existing.values()].find((it) => it.title === docItem.en);
      return found || { id: String(i), title: docItem.en, on_file: false, _unsaved: true };
    });

    const sheet = document.getElementById('onb-sheet');
    sheet.hidden = false;
    sheet.innerHTML = `
      <div class="form-doc-inner">
        <div class="form-head"><img src="${LOGO_DATA_URL}" alt="SouthWest Landscape"><div class="wordmark">SouthWest<br>Landscape</div></div>
        <h1 class="form-title">${isEs ? 'Lista de Verificación del Expediente del Empleado' : 'Employee File Checklist'}</h1>
        <div class="form-grid c2">
          <div class="form-cell"><b>${isEs ? 'Nombre del Empleado' : 'EE Name'}</b>${emp.first_name} ${emp.last_name}</div>
          <div class="form-cell"><b>${isEs ? 'ID del Empleado' : 'EE ID'}</b>${emp.id}</div>
          <div class="form-cell"><b>${isEs ? 'Fecha de Inicio' : 'Start Date'}</b>${formatDate(emp.hire_date)}</div>
          <div class="form-cell"><b>${isEs ? 'Puesto' : 'Title'}</b>${emp.position || ''}</div>
          <div class="form-cell"><b>${isEs ? 'Salario' : 'Wage'}</b>&nbsp;</div>
          <div class="form-cell"><b>${isEs ? 'Nombre (Licencia)' : 'DL Name'}</b>&nbsp;</div>
          <div class="form-cell" style="grid-column:1/-1"><b>${isEs ? 'Dirección' : 'Address'}</b>&nbsp;</div>
        </div>
        <div class="form-section">${isEs ? 'Documentos de Incorporación' : 'Onboarding Documents'}</div>
        <table class="form-notice-table">
          <thead><tr><th>${isEs ? 'Formulario' : 'Form'}</th><th>${isEs ? 'Completado' : 'Completed'}</th></tr></thead>
          <tbody>
            ${items.map((it, i) => `
              <tr>
                <td>${isEs ? ONBOARDING_CHECKLIST[i].es : it.title}</td>
                <td style="text-align:center">
                  <input type="checkbox" class="no-print onb-check" data-id="${it.id}" data-index="${i}" ${it.on_file ? 'checked' : ''}>
                  <span class="print-only">${it.on_file ? '☑' : '☐'}</span>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <div class="form-section">${isEs ? 'Certificación' : 'Certification'}</div>
        <div class="form-sig">
          <div>${isEs ? 'Completado por' : 'Completed By'}: ${escapeHtml(profile.name || '')}</div>
          <div>${isEs ? 'Fecha' : 'Date'}: ${formatDate(new Date().toISOString().slice(0, 10))}</div>
        </div>
      </div>
    `;

    document.querySelectorAll('.onb-check').forEach((cb) => {
      cb.addEventListener('change', async () => {
        try {
          await setDoc(doc(db, 'employees', empId, 'onboarding_docs', cb.dataset.id), {
            title: ONBOARDING_CHECKLIST[cb.dataset.index].en,
            on_file: cb.checked,
            entered_by: profile.uid,
            updated_at: serverTimestamp(),
          }, { merge: true });
          cb.closest('td').querySelector('.print-only').textContent = cb.checked ? '☑' : '☐';
        } catch (err) {
          console.error(err);
          showToast('Could not save — ' + err.message, 'error');
          cb.checked = !cb.checked;
        }
      });
    });
  }

  document.getElementById('onb-load-btn').addEventListener('click', () => loadChecklist());
  sheetRerender = () => loadChecklist();

  // Deep link from the New Hire board's "Paperwork" column — jump
  // straight to that employee's checklist instead of making HR pick
  // them again from the dropdown.
  const linkedEmpId = new URLSearchParams(window.location.search).get('emp');
  if (linkedEmpId && employees.some((e) => e.id === linkedEmpId)) {
    setEmpField('onb-emp', linkedEmpId, employees.filter((e) => e.status === 'onboarding'));
    loadChecklist(linkedEmpId);
  }
}

        ? 'Este formulario documenta únicamente la decisión voluntaria del empleado. No es una renuncia ni liberación de ningún tipo. Conservar con el reporte del incidente.'
        : 'This form documents the employee’s voluntary decision only. It is not a release or waiver of any kind. Retain with the incident report.'}</div>
      <button type="button" class="gh solid no-print" id="ref-sig-save" style="margin-top:10px">${isEs ? 'Guardar' : 'Save'}</button>
      </div>
    </div>
    <button class="gh no-print" id="ref-back-btn" type="button" style="margin:14px">&larr; Back to document generator</button>
  `;
  document.getElementById('ref-back-btn').addEventListener('click', () => document.getElementById('back-btn').click());
  document.querySelectorAll('.ref-check').forEach((cb) => {
    cb.addEventListener('change', () => {
      cb.closest('label').querySelector('.print-only').textContent = cb.checked ? '☑' : '☐';
    });
  });
  setUpSignaturePad('ref-sig-pad', 'ref-sig-clear');
  setUpSignaturePad('ref-sup-sig-pad', 'ref-sup-sig-clear');
  statements.forEach((s, i) => setUpSignaturePad(`ref-initial-${i}-pad`, `ref-initial-${i}-clear`));
  document.getElementById('ref-sig-save').addEventListener('click', async () => {
    const checks = {};
    document.querySelectorAll('.ref-check').forEach((cb) => { checks[cb.dataset.key] = cb.checked; });
    const initials = {};
    statements.forEach((s, i) => {
      const padState = sigPads[`ref-initial-${i}-pad`];
      if (padState && padState.hasStroke) {
        initials[`statement-${i}`] = document.getElementById(`ref-initial-${i}-pad`).toDataURL('image/png');
      }
    });
    const state = sigPads['ref-sig-pad'];
    const supState = sigPads['ref-sup-sig-pad'];
    try {
      const docRef = pendingSigDocId ? doc(db, 'training_documents', pendingSigDocId) : doc(collection(db, 'training_documents'));
      await setDoc(docRef, {
        content_type: 'refusal', category: 'safety', status: 'signed',
        title: `Medical Treatment Refusal — ${emp.first_name} ${emp.last_name} (${formatDate(date)})`,
        emp_id: emp.id, emp_name: `${emp.first_name} ${emp.last_name}`,
        date, incident_datetime: incidentDateTime, supervisor, location, description,
        checks, initials, lang,
        signature_data_url: state && state.hasStroke ? document.getElementById('ref-sig-pad').toDataURL('image/png') : null,
        supervisor_signature_data_url: supState && supState.hasStroke ? document.getElementById('ref-sup-sig-pad').toDataURL('image/png') : null,
        signed_by: profile.uid, signed_at: serverTimestamp(),
        entered_by: profile.uid, entered_at: serverTimestamp(),
      }, { merge: true });
      if (pendingSigTaskId) {
        await updateDoc(doc(db, 'tasks', pendingSigTaskId), { status: 'complete', completed_at: serverTimestamp(), completed_by: profile.uid });
        pendingSigDocId = null; pendingSigTaskId = null;
      }
      await addDoc(collection(db, 'activity'), {
        module: 'documents', item: `Medical Treatment Refusal saved — ${emp.first_name} ${emp.last_name}`,
        entered_by: profile.uid, entered_at: serverTimestamp(),
      });
      showToast('Saved — view it any time in Documents.');
    } catch (err) {
      console.error(err);
      showToast('Could not save — ' + err.message, 'error');
    }
  });
  sheetRerender = (l) => {
    const checks = {};
    document.querySelectorAll('.ref-check').forEach((cb) => { checks[cb.dataset.key] = cb.checked; });
    withPreservedSignature('ref-sup-sig-pad', () => withPreservedSignature('ref-sig-pad', () => renderRefusalSheet(l)));
    document.querySelectorAll('.ref-check').forEach((cb) => {
      if (checks[cb.dataset.key]) {
        cb.checked = true;
        cb.closest('label').querySelector('.print-only').textContent = '☑';
      }
    });
  };
}

// ---- Incident Report — the single place a new incident gets logged.
// Merges what used to be two separate things: the full OSHA-tracking
// fields that used to only live in Safety's own "Log incident" form
// (injury type/body part/treatment level/days away/recordable/cost/
// corrective action + task), and the real SWL Form 7.3 fields (witnesses,
// unsafe act/condition, immediate action taken, follow-up plan,
// signatures). Writes ONE record to the same `incidents` collection
// Safety's list, corrective-action tasks, and Form 300 export already
// read — nothing else has to change to see these. Safety keeps editing
// existing incidents, the list, CSV import, and reporting; its own "Log
// incident" button now just opens this generator instead of its old
// separate form. ----

// Set right before jumping from the incident report draft to the Refusal
// generator (via "Generate Refusal Form"), so the in-progress incident
// report isn't lost -- the Refusal screen shows a button to come back
// and restore it. Cleared once restored, or once either document is
// actually saved, since there's nothing left to resume at that point.

function renderIncidentReport() {

        <div class="field"><label class="f-lab">Follow-up: discussed with staff involved — who</label><input class="f-in" id="ir-discussed-staff-who"></div>

  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('ir-date').value = today;
  wireEmpSearch('ir-emp');

  document.getElementById('ir-emp').addEventListener('change', (e) => {
    const emp = employees.find((x) => x.id === e.target.value);
    if (!emp || !emp.manager_emp_id) return;
    const mgr = employees.find((x) => x.id === emp.manager_emp_id);
    if (!mgr) return;
    const sel = document.getElementById('ir-supervisor');
    const name = `${mgr.first_name} ${mgr.last_name}`;
    if (![...sel.options].some((o) => o.value === name)) {
      const opt = document.createElement('option'); opt.value = name; opt.textContent = name; sel.appendChild(opt);
    }
    sel.value = name;
  });
  document.getElementById('ir-type').addEventListener('change', (e) => {
    document.getElementById('ir-injury-fields').hidden = e.target.value !== 'Injury';
  });
  // "Injury" is already the default selected option, so the change
  // listener above never fires on a fresh form -- without this, the
  // injury fields (including Treatment Level) never show up unless
  // someone happens to switch the dropdown away and back to Injury.
  document.getElementById('ir-injury-fields').hidden = document.getElementById('ir-type').value !== 'Injury';
  document.getElementById('ir-treatment-level').addEventListener('change', (e) => {
    document.getElementById('ir-refusal-field').hidden = e.target.value !== 'refused';
  });
  function updateRecordableHint() {
    const level = document.getElementById('ir-treatment-level').value;
    const daysAway = parseInt(document.getElementById('ir-days-away').value || '0', 10);
    const restrictedDays = parseInt(document.getElementById('ir-restricted-days').value || '0', 10);
    const hint = document.getElementById('ir-recordable-hint');
    const checkbox = document.getElementById('ir-recordable');
    if (daysAway > 0 || restrictedDays > 0) {
      checkbox.checked = true; hint.hidden = false;
      hint.textContent = 'Days away or restricted days were entered — this is recordable regardless of treatment level.';
    } else if (level === 'clinic' || level === 'er' || level === 'hospitalization') {
      checkbox.checked = true; hint.hidden = false;
      hint.textContent = 'Clinic/ER/hospitalization treatment is likely recordable — pre-checked, but review before saving.';
    } else if (level === 'first_aid') {
      checkbox.checked = false; hint.hidden = false;
      hint.textContent = 'First aid only is usually not recordable — unless days away or restricted work apply.';
    } else {
      hint.hidden = true;
    }
  }
  ['ir-treatment-level', 'ir-days-away', 'ir-restricted-days'].forEach((id) => {
    document.getElementById(id).addEventListener('input', updateRecordableHint);
    document.getElementById(id).addEventListener('change', updateRecordableHint);
  });
  document.getElementById('ir-generate-btn').addEventListener('click', () => renderIncidentReportSheet(document.getElementById('lang-select').value));
  document.getElementById('ir-generate-refusal-btn').addEventListener('click', () => {
    incidentDraftForResume = readIncidentReportForm();

    document.getElementById('ref-supervisor').value = f.supervisor || '';
    document.getElementById('ref-location').value = f.location || '';
    document.getElementById('ref-description').value = f.whatHappened || '';
  });
}

// Repopulates the raw incident report draft form from a snapshot taken
// by readIncidentReportForm() -- used when someone comes back from
// generating a Refusal form mid-draft via "Generate Refusal Form".
function restoreIncidentReportDraft(f) {
  if (f.emp) setEmpField('ir-emp', f.emp.id);
  document.getElementById('ir-date').value = f.date || '';
  document.getElementById('ir-time').value = f.time || '';
  document.getElementById('ir-supervisor').value = f.supervisor || '';
  document.getElementById('ir-department').value = f.department || '';
  document.getElementById('ir-location').value = f.location || '';
  document.getElementById('ir-type').value = f.incidentType || 'Injury';
  document.getElementById('ir-what-happened').value = f.whatHappened || '';
  document.getElementById('ir-injury-fields').hidden = f.incidentType !== 'Injury';
  document.getElementById('ir-injury-type').value = f.injuryType || '';
  document.getElementById('ir-body-part').value = f.bodyPart || '';
  document.getElementById('ir-treatment-level').value = f.treatmentLevel || 'none';
  document.getElementById('ir-refusal-field').hidden = f.treatmentLevel !== 'refused';
  document.getElementById('ir-days-away').value = f.daysAway || 0;
  document.getElementById('ir-restricted-days').value = f.restrictedDays || 0;
  document.getElementById('ir-recordable').checked = !!f.recordable;
  document.getElementById('ir-privacy-case').checked = !!f.privacyCase;
  document.getElementById('ir-witnesses').value = f.witnesses || '';
  document.getElementById('ir-describe').value = f.describe || '';
  document.getElementById('ir-immediate-action').value = f.immediateAction || '';
  document.getElementById('ir-cost').value = f.cost === null || f.cost === undefined ? '' : f.cost;
  document.getElementById('ir-root-cause').value = f.rootCause || '';
  document.getElementById('ir-corrective-action').value = f.correctiveAction || '';
  document.getElementById('ir-corrective-owner').value = f.correctiveOwner || '';
  document.getElementById('ir-corrective-due').value = f.correctiveDue || '';
  document.getElementById('ir-discussed-staff-who').value = f.discussedStaffWho || '';
  document.getElementById('ir-other-detail').value = f.otherDetail || '';
  document.getElementById('ir-comments').value = f.comments || '';
  incidentDraftForResume = null;
}

function readIncidentReportForm() {
  const empId = document.getElementById('ir-emp').value;
  const emp = employees.find((e) => e.id === empId) || null; // an incident doesn't have to name one employee
  const isInjury = document.getElementById('ir-type').value === 'Injury';
  return {
    emp,
    date: document.getElementById('ir-date').value,
    time: document.getElementById('ir-time').value,
    supervisor: document.getElementById('ir-supervisor').value.trim(),
    department: document.getElementById('ir-department').value.trim(),
    location: document.getElementById('ir-location').value.trim(),
    incidentType: document.getElementById('ir-type').value,
    whatHappened: document.getElementById('ir-what-happened').value.trim(),
    isInjury,
    injuryType: isInjury ? document.getElementById('ir-injury-type').value.trim() : '',
    bodyPart: isInjury ? document.getElementById('ir-body-part').value.trim() : '',
    treatmentLevel: isInjury ? document.getElementById('ir-treatment-level').value : '',
    daysAway: isInjury ? parseInt(document.getElementById('ir-days-away').value || '0', 10) : 0,
    restrictedDays: isInjury ? parseInt(document.getElementById('ir-restricted-days').value || '0', 10) : 0,
    recordable: isInjury ? document.getElementById('ir-recordable').checked : false,
    privacyCase: isInjury ? document.getElementById('ir-privacy-case').checked : false,
    witnesses: document.getElementById('ir-witnesses').value.trim(),
    describe: document.getElementById('ir-describe').value,
    immediateAction: document.getElementById('ir-immediate-action').value.trim(),
    cost: document.getElementById('ir-cost').value === '' ? null : parseFloat(document.getElementById('ir-cost').value),
    rootCause: document.getElementById('ir-root-cause').value.trim(),
    correctiveAction: document.getElementById('ir-corrective-action').value.trim(),
    correctiveOwner: document.getElementById('ir-corrective-owner').value,
    correctiveDue: document.getElementById('ir-corrective-due').value,
    discussedStaffWho: document.getElementById('ir-discussed-staff-who').value.trim(),
    otherDetail: document.getElementById('ir-other-detail').value.trim(),
    comments: document.getElementById('ir-comments').value.trim(),
  };
}

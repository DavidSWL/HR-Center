<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document generator — SWL HR</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.print-only { display:none; }
@media print {
  .side, .bar, .no-print { display:none !important; }
  .print-only { display:inline !important; }
  .app { display:block; }
  .view { padding:0; }
  .doc-sheet, .form-doc { border:none !important; box-shadow:none !important; }
  @page { size:letter; margin:0; }
  .letter { width:8.5in; min-height:11in; box-shadow:none; margin:0; padding:1in; }
  .force-break { break-before:page; page-break-before:always; }
}
.gen-menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:20px}
.gen-tile{border:1px solid var(--line);background:var(--raise);padding:16px;cursor:pointer;text-align:left}
.gen-tile:hover{border-color:var(--accent)}
.gen-tile h4{font-family:var(--display);font-size:14px;margin:0 0 4px}
.gen-tile p{font-size:11.5px;color:var(--faint);margin:0}
.gen-tile.linkout{opacity:.85}

/* ---- generic print sheet (PIP, onboarding) ---- */
.doc-sheet{border:1px solid var(--line);background:#fff;color:#111;max-width:800px;margin:0 auto}
.doc-bar{background:var(--oregon);color:#fff;padding:14px 24px;font-family:var(--display);font-size:16px;letter-spacing:.02em;text-transform:uppercase}
.doc-body{padding:24px}
.doc-body h4{font-family:var(--display);font-size:13px;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--oregon);padding-bottom:4px;margin:20px 0 10px}
.doc-body h4:first-child{margin-top:0}
.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:13px;margin-bottom:10px}
.doc-grid div b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#666}
.doc-fineprint{font-size:10.5px;color:#555;font-style:italic;border:1px solid #ccc;padding:10px;margin-top:14px}
.sig-line{border-top:1px solid #333;margin-top:36px;padding-top:4px;font-size:11px}

/* .form-doc family (Write-up / Termination / 30-60-90 review) now lives
   in styles.css — shared with discipline.html's write-up print sheet. */

/* ---- offer / increase / promotion letters — matches the branded
   letterhead tool exactly (decor bands, ribbon, letterhead logo) ---- */
.letter{position:relative;background:#fff;width:8.5in;min-height:11in;margin:0 auto;padding:1in;box-shadow:0 2px 18px rgba(0,0,0,.15);font-family:Calibri,"Segoe UI",Arial,sans-serif;color:#000;font-size:11pt;line-height:1.35}
.letter p{margin:0 0 10px}
.letter .just{text-align:justify}
.letter .center{text-align:center}
.letter .indent{padding-left:0.22in}
.letter .tight{margin-bottom:2px}
.letter .section-gap{margin-top:26px}
.letter ul{margin:0 0 10px;padding-left:0.5in}
.letter ul.tight{margin-bottom:2px}
.letter li{margin:0 0 2px}
.letterhead{margin-bottom:16px}
.letterhead img{width:1.5in;height:auto;display:block}
.sig-section{margin-top:10px}
.sig-section p{margin:0 0 2px}
.sig-img{max-height:0.9in;display:block;margin:6px 0 4px}
.sig-blank{border-bottom:1px solid #333;width:260px;height:0.85in;margin:6px 0 4px}
.decor-band{position:absolute;left:0;right:0;height:0.4in;overflow:hidden;background:#d3ded6}
.decor-band.top{top:0}
.decor-band.bottom{bottom:0}
.decor-band .ribbon{position:absolute;top:0;bottom:0;left:17%;right:-4%;background:#8f1536;clip-path:polygon(0 0,100% 0,100% 100%,7% 100%)}
.acceptance-block{margin-top:34px}
.agreement-label{font-weight:700;text-align:center;margin-bottom:26px !important}
.accept-line{display:flex;gap:40px;margin-bottom:6px}
.accept-line .blank{flex:1;border-bottom:1px solid #000;height:1px;margin-top:46px}
.accept-line .blank.short{flex:0 0 30%}
.accept-label-line{display:flex;gap:40px;font-weight:700}
.accept-label-line .lbl{flex:1}
.accept-label-line .lbl.short{flex:0 0 30%}

.tabs{display:flex;gap:0;border:1px solid var(--line);width:fit-content;margin-bottom:14px}
.tabs .tab{padding:8px 18px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--faint);border-right:1px solid var(--line)}
.tabs .tab:last-child{border-right:none}
.tabs .tab.active{background:var(--accent);color:#fff}
</style>
</head>
<body>

<div class="app">
  <aside class="side" id="sidebar"></aside>

  <div class="main" id="main" data-theme="light">
    <header class="bar">
      <div><h1 id="page-title">Document generator</h1></div>
      <div style="display:flex;align-items:center;gap:18px">
        <div class="toggle no-print">
          <button class="on" data-t="light" type="button">Light</button>
          <button data-t="dark" type="button">Dark</button>
        </div>
        <div class="s" id="header-date"></div>
      </div>
    </header>

    <section class="view">

      <div id="menu-view">
        <p class="dim" style="margin-bottom:16px">
          Write-up, Termination, 30/60/90 Review, and Offer/Increase/Promotion letters match the real SWL
          forms exactly. Every generator produces a print view — use your browser's Print → Save as PDF.
        </p>
        <div class="gen-menu" id="tiles"></div>
      </div>

      <div id="gen-view" hidden>
        <div class="acts no-print">
          <button class="gh" id="back-btn" type="button">&larr; All documents</button>
          <button class="gh" id="print-btn" type="button">Print</button>
          <select class="inp" id="lang-select">
            <option value="en">English</option>
            <option value="es">Español</option>
          </select>
        </div>
        <div id="gen-body"></div>
      </div>
    </section>
  </div>
</div>

<script type="module">
import { requireAuth } from './auth.js';
import { initShell, showToast, formatDate, readSpreadsheetSheets, objectsFromRows } from './app.js';
import { db } from './firebaseconfig.js';
import { LOGO_DATA_URL, LOCATIONS, SCHEDULE_PRESETS, HR_SIGNER, ONBOARDING_CHECKLIST } from './letterhead-assets.js';
import {
  collection, doc, getDoc, getDocs, setDoc, updateDoc, addDoc, writeBatch, serverTimestamp,
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const profile = await requireAuth();
if (!profile) throw new Error('not authenticated');
initShell(new URLSearchParams(window.location.search).get('open') === 'termination' ? 'terminations' : 'docgen', profile);

document.getElementById('header-date').textContent =
  new Date().toLocaleDateString('en-US', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

// Legal-letter-style long date ("August 18, 2026"), separate from app.js's
// short admin-table formatDate() — this is only for printed documents.
function longDate(dateStr, isEs = false) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString(isEs ? 'es-ES' : 'en-US', { year: 'numeric', month: 'long', day: 'numeric' });
}

const T = {
  en: { employee: 'Employee', id: 'Employee ID', title: 'Job title', division: 'Division', hireDate: 'Hire date',
        manager: 'Reports to', language: 'Language', print: 'Print', save: 'Save' },
  es: { employee: 'Empleado', id: 'ID de empleado', title: 'Puesto', division: 'División', hireDate: 'Fecha de contratación',
        manager: 'Reporta a', language: 'Idioma', print: 'Imprimir', save: 'Guardar' },
};

const GENERATORS = [
  { key: 'writeup', title: 'Write-up', desc: 'Lives in Disciplinary actions — matches the SWL warning form', linkout: 'discipline.html' },
  { key: 'pip', title: 'Performance Improvement Plan', desc: 'PIP with a four-check-in schedule' },
  { key: 'review', title: '30 / 60 / 90 review', desc: 'Matches the SWL new-hire review template' },
  { key: 'termination', title: 'Termination', desc: 'Matches the SWL termination form — log, generate, and import' },
  { key: 'offer', title: 'Offer / increase / promotion', desc: '7 letter types, matches the branded SWL letterhead exactly' },
  { key: 'onboarding', title: 'Onboarding packet', desc: 'Assembles the required document checklist' },
  { key: 'refusal', title: 'Medical Treatment Refusal', desc: 'Matches the SWL acknowledgment form — English or Spanish' },
  { key: 'sop', title: 'SOP', desc: 'Standard Operating Procedure — matches the real SWL SOP format, saves to Documents' },
];

document.getElementById('tiles').innerHTML = GENERATORS.map((g) => `
  <button class="gen-tile${g.linkout ? ' linkout' : ''}" data-key="${g.key}" type="button">
    <h4>${g.title}</h4>
    <p>${g.desc}</p>
  </button>
`).join('');

document.querySelectorAll('.gen-tile').forEach((btn) => {
  const g = GENERATORS.find((x) => x.key === btn.dataset.key);
  btn.addEventListener('click', () => {
    if (g.linkout) { window.location.href = g.linkout; return; }
    openGenerator(g.key);
  });
});

document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('menu-view').hidden = false;
  document.getElementById('gen-view').hidden = true;
  document.getElementById('page-title').textContent = 'Document generator';
});
document.getElementById('print-btn').addEventListener('click', () => window.print());
document.getElementById('lang-select').addEventListener('change', () => renderCurrent());

let employees = [];       // active only — for "who can this happen to" selects
let allEmployeesEver = []; // includes terminated — for name lookups on old records
let managerIds = new Set(); // set in Settings — who shows up in "Reports to" on letters
let currentKey = null;

async function loadEmployees() {
  const snap = await getDocs(collection(db, 'employees'));
  allEmployeesEver = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  employees = allEmployeesEver.filter((e) => e.status !== 'terminated');
}

async function loadManagerIds() {
  const snap = await getDoc(doc(db, 'settings', 'managers'));
  managerIds = new Set(snap.exists() ? (snap.data().employee_ids || []) : []);
}

function empSelectOptions(list = employees) {
  return list
    .slice()
    .sort((a, b) => (a.first_name || '').localeCompare(b.first_name || ''))
    .map((e) => `<option value="${e.id}">${e.first_name} ${e.last_name} (${e.id})</option>`).join('');
}

function openGenerator(key) {
  currentKey = key;
  document.getElementById('menu-view').hidden = true;
  document.getElementById('gen-view').hidden = false;
  document.getElementById('page-title').textContent = GENERATORS.find((g) => g.key === key).title;
  // Write-up, Termination, and 30/60/90 Review reproduce real SWL forms
  // exactly as supplied — those forms are English-only, so the language
  // toggle only applies to PIP, Onboarding, and the letters (which manage
  // English/Spanish through their own letter-type list instead).
  document.getElementById('lang-select').style.display = (key === 'pip' || key === 'onboarding' || key === 'refusal') ? '' : 'none';
  renderCurrent();
}

function renderCurrent() {
  const lang = document.getElementById('lang-select').value;
  if (currentKey === 'pip') renderPip(lang);
  if (currentKey === 'review') renderReview();
  if (currentKey === 'termination') renderTermination();
  if (currentKey === 'offer') renderLetters();
  if (currentKey === 'onboarding') renderOnboarding(lang);
  if (currentKey === 'refusal') renderRefusal(lang);
  if (currentKey === 'sop') renderSop();
}

// ---- PIP ----

function renderPip(lang) {
  const t = T[lang];
  document.getElementById('gen-body').innerHTML = `
    <div class="card no-print" style="margin-bottom:16px">
      <div class="card-body">
        <div class="frow">
          <div class="field"><label class="f-lab">${t.employee}</label><select class="f-in" id="pip-emp">${empSelectOptions()}</select></div>
          <div class="field"><label class="f-lab">Start date</label><input class="f-in" id="pip-start" type="date"></div>
        </div>
        <div class="field"><label class="f-lab">Final review date</label><input class="f-in" id="pip-final" type="date"></div>
        <div class="field"><label class="f-lab">Performance gaps (use specific behaviors and dates, not generalities)</label><textarea class="f-in" id="pip-gaps" rows="3" style="resize:vertical"></textarea></div>
        <div class="field"><label class="f-lab">Expectations going forward (specific, measurable, time-bound)</label><textarea class="f-in" id="pip-expect" rows="3" style="resize:vertical"></textarea></div>
        <div class="field">
          <label class="f-lab">Support provided</label>
          <label style="display:block;font-size:12.5px;margin-bottom:4px"><input type="checkbox" class="pip-support" value="Additional training"> Additional training</label>
          <label style="display:block;font-size:12.5px;margin-bottom:4px"><input type="checkbox" class="pip-support" value="Regular check-ins"> Regular check-ins</label>
          <label style="display:block;font-size:12.5px;margin-bottom:4px"><input type="checkbox" class="pip-support" value="Written resources"> Written resources</label>
          <label style="display:block;font-size:12.5px"><input type="checkbox" class="pip-support" value="Shadowing"> Shadowing a peer</label>
        </div>
        <button class="gh solid" id="pip-generate-btn" type="button">Generate &amp; file</button>
      </div>
    </div>
    <div class="doc-sheet" id="pip-sheet" hidden></div>
  `;

  document.getElementById('pip-generate-btn').addEventListener('click', async () => {
    const empId = document.getElementById('pip-emp').value;
    const emp = employees.find((e) => e.id === empId);
    const start = document.getElementById('pip-start').value;
    const final = document.getElementById('pip-final').value;
    const gaps = document.getElementById('pip-gaps').value.trim();
    const expect = document.getElementById('pip-expect').value.trim();
    const support = [...document.querySelectorAll('.pip-support:checked')].map((c) => c.value);

    if (!start || !final) { showToast('Start and final review dates are required.', 'error'); return; }

    const checkIns = [];
    const startD = new Date(start + 'T00:00:00'), finalD = new Date(final + 'T00:00:00');
    const span = (finalD - startD) / 4;
    for (let i = 1; i <= 4; i++) {
      checkIns.push(new Date(startD.getTime() + span * i).toISOString().slice(0, 10));
    }

    try {
      const pipRef = doc(collection(db, 'pips'));
      const batch = writeBatch(db);
      batch.set(pipRef, {
        emp_id: empId, division: emp.division || '', start_date: start, final_review_date: final,
        performance_gaps: gaps, expectations: expect, support_provided: support,
        entered_by: profile.uid, entered_at: serverTimestamp(),
      });
      checkIns.forEach((d, i) => {
        batch.set(doc(collection(db, 'tasks')), {
          assigned_to: profile.uid, due_date: d,
          instructions: `PIP check-in ${i + 1} of 4 — ${emp.first_name} ${emp.last_name}`,
          recurring: 'none', status: 'open', entered_by: profile.uid, entered_at: serverTimestamp(),
        });
      });
      await batch.commit();
      await addDoc(collection(db, 'activity'), {
        module: 'documents', item: `PIP generated — ${emp.first_name} ${emp.last_name}`,
        entered_by: profile.uid, entered_at: serverTimestamp(),
      });
      showToast('PIP filed. 4 check-in tasks created.');
      renderPipSheet(lang, emp, { start, final, gaps, expect, support, checkIns });
    } catch (err) {
      console.error(err);
      showToast('Could not save — ' + err.message, 'error');
    }
  });
}

function renderPipSheet(lang, emp, p) {
  const t = T[lang];
  const isEs = lang === 'es';
  const sheet = document.getElementById('pip-sheet');
  sheet.hidden = false;
  sheet.innerHTML = `
    <div class="doc-bar">${isEs ? 'Plan de Mejora del Desempeño' : 'Performance Improvement Plan'}</div>
    <div class="doc-body">
      <div class="doc-grid">
        <div><b>${t.employee}</b>${emp.first_name} ${emp.last_name}</div>
        <div><b>${t.id}</b>${emp.id}</div>
        <div><b>${t.title}</b>${emp.position || ''}</div>
        <div><b>${t.division}</b>${emp.division || ''}</div>
        <div><b>${isEs ? 'Fecha de inicio' : 'Start date'}</b>${formatDate(p.start)}</div>
        <div><b>${isEs ? 'Revisión final' : 'Final review'}</b>${formatDate(p.final)}</div>
      </div>
      <h4>${isEs ? 'Brechas de desempeño' : 'Performance gaps'}</h4>
      <p>${p.gaps || '—'}</p>
      <h4>${isEs ? 'Expectativas' : 'Expectations going forward'}</h4>
      <p>${p.expect || '—'}</p>
      <h4>${isEs ? 'Apoyo proporcionado' : 'Support provided'}</h4>
      <p>${p.support.join(', ') || '—'}</p>
      <h4>${isEs ? 'Calendario de seguimiento' : 'Check-in schedule'}</h4>
      <table><tbody>
        ${p.checkIns.map((d, i) => `<tr><td>${isEs ? 'Revisión' : 'Check-in'} ${i + 1}</td><td>${formatDate(d)}</td><td>Manager: ______</td><td>Employee: ______</td></tr>`).join('')}
      </table>
      <div class="sig-line" style="display:inline-block;width:45%">${isEs ? 'Firma del empleado' : 'Employee signature'} / ${isEs ? 'Fecha' : 'Date'}</div>
      <div class="sig-line" style="display:inline-block;width:45%;margin-left:5%">${isEs ? 'Firma del gerente' : 'Manager signature'} / ${isEs ? 'Fecha' : 'Date'}</div>
      <div class="doc-fineprint">${isEs
        ? 'El acuse de recibo de este plan no constituye acuerdo con su contenido, solo confirma que fue entregado y explicado.'
        : 'Acknowledgment of this plan does not indicate agreement with its content, only that it was delivered and explained.'}</div>
    </div>
  `;
}

// ---- 30/60/90 review — matches "30 / 60 / 90 Day New Hire Review" exactly ----

const REVIEW_AREAS = [
  'Attendance & Punctuality',
  'Safety Practices (PPE, Procedures, Awareness)',
  'Quality of Work',
  'Job Knowledge / Skill Progress',
  'Follows Instructions & Procedures',
  'Care of Equipment, Tools & Vehicles',
  'Teamwork & Attitude',
  'Communication (Crew, Manager, Clients)',
];
const REVIEW_FOCUS = {
  30: 'Trained on safety basics, knows the daily routine, performing core tasks with supervision.',
  60: 'Handling core duties with less supervision; consistent quality, safety, and attendance.',
  90: 'Fully performing the role independently and meeting company standards for quality, safety, and reliability.',
};
const REVIEW_HEADING = { 30: '30-Day Review — Learning the Job', 60: '60-Day Review — Working with Support', 90: '90-Day Review — Working Independently' };

function reviewFormHtml(milestone) {
  return `
    <div class="card no-print" style="margin-bottom:10px">
      <div class="card-h"><h3>${REVIEW_HEADING[milestone]}</h3></div>
      <div class="card-body">
        <p class="dim" style="margin-bottom:10px">${REVIEW_FOCUS[milestone]}</p>
        ${REVIEW_AREAS.map((a, i) => `
          <div class="field">
            <label class="f-lab">${a}</label>
            <div style="display:flex;gap:16px;margin-bottom:4px">
              <label><input type="radio" name="rev${milestone}-area${i}" value="E"> Exceeds</label>
              <label><input type="radio" name="rev${milestone}-area${i}" value="M" checked> Meets</label>
              <label><input type="radio" name="rev${milestone}-area${i}" value="N"> Needs improvement</label>
            </div>
            <input class="f-in" placeholder="Comment (required if Needs improvement)" id="rev${milestone}-comment-${i}">
          </div>
        `).join('')}
        <div class="field">
          <label class="f-lab">Other</label>
          <input class="f-in" placeholder="Describe (optional)" id="rev${milestone}-other-label" style="margin-bottom:6px">
          <div style="display:flex;gap:16px;margin-bottom:4px">
            <label><input type="radio" name="rev${milestone}-areaOther" value="E"> Exceeds</label>
            <label><input type="radio" name="rev${milestone}-areaOther" value="M" checked> Meets</label>
            <label><input type="radio" name="rev${milestone}-areaOther" value="N"> Needs improvement</label>
          </div>
          <input class="f-in" placeholder="Comment (optional)" id="rev${milestone}-other-comment">
        </div>
        <div class="field">
          <label class="f-lab">Is the employee on track at this stage?</label>
          <select class="f-in" id="rev${milestone}-ontrack">
            <option value="yes">Yes</option>
            <option value="yes-items">Yes, with items to work on (note below)</option>
            <option value="no">No — notify HR</option>
          </select>
        </div>
        <div class="field"><label class="f-lab">Manager notes (what's going well / what needs attention before the next review)</label><textarea class="f-in" id="rev${milestone}-notes" rows="3" style="resize:vertical"></textarea></div>
        ${milestone === 90 ? `
        <div class="field"><label class="f-lab">Overall 90-day assessment</label>
          <select class="f-in" id="rev90-overall">
            <option value="exceeds">Exceeds Expectations — performing above the standard for this role</option>
            <option value="meets" selected>Meets Expectations — performing at the standard for this role</option>
            <option value="needs">Needs Improvement — see comments; improvement plan or extended review period below</option>
          </select>
        </div>
        <div class="field"><label class="f-lab">Recommendation</label>
          <select class="f-in" id="rev90-recommend">
            <option value="continue">Continue in role</option>
            <option value="continue-support">Continue with additional training / support (describe below)</option>
            <option value="extend">Extend review period</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="frow">
          <div class="field"><label class="f-lab">Extend review period to (if selected above)</label><input class="f-in" id="rev90-extend-date" type="date"></div>
          <div class="field"><label class="f-lab">Other (if selected above)</label><input class="f-in" id="rev90-other-recommend"></div>
        </div>
        <div class="field"><label class="f-lab">Manager overall comments</label><textarea class="f-in" id="rev90-overall-comments" rows="3" style="resize:vertical"></textarea></div>
        <div class="field"><label class="f-lab">Employee comments (optional)</label><textarea class="f-in" id="rev90-employee-comments" rows="2" style="resize:vertical"></textarea></div>
        ` : ''}
        <button class="gh solid" id="rev${milestone}-generate-btn" type="button">Save &amp; generate — ${milestone}-day</button>
      </div>
    </div>
  `;
}

function readReviewForm(milestone) {
  const ratings = REVIEW_AREAS.map((a, i) => ({
    area: a,
    rating: document.querySelector(`input[name="rev${milestone}-area${i}"]:checked`).value,
    comment: document.getElementById(`rev${milestone}-comment-${i}`).value.trim(),
  }));
  const otherLabel = document.getElementById(`rev${milestone}-other-label`).value.trim();
  if (otherLabel) {
    ratings.push({
      area: `Other: ${otherLabel}`,
      rating: document.querySelector(`input[name="rev${milestone}-areaOther"]:checked`).value,
      comment: document.getElementById(`rev${milestone}-other-comment`).value.trim(),
    });
  }
  const onTrack = document.getElementById(`rev${milestone}-ontrack`).value;
  const notes = document.getElementById(`rev${milestone}-notes`).value.trim();
  const data = { ratings, on_track: onTrack, manager_notes: notes };
  if (milestone === 90) {
    data.overall = document.getElementById('rev90-overall').value;

function termAccessor(key) {
  return {
    date: (r) => r.termination_date || '',
    name: (r) => (r.emp_name || '').toLowerCase(),
    division: (r) => (r.division || '').toLowerCase(),
    location: (r) => (r.location || '').toLowerCase(),
    reason: (r) => (r.reason || '').toLowerCase(),
    type: (r) => (r.separation_type || ''),
  }[key];
}

function renderTermRows() {
  const q = document.getElementById('term-search').value.trim().toLowerCase();
  const visible = terminations.filter((r) => !q || `${r.emp_name} ${r.division} ${r.reason}`.toLowerCase().includes(q));
  const acc = termAccessor(termSortKey) || termAccessor('date');
  visible.sort((a, b) => {
    const av = acc(a), bv = acc(b);
    const cmp = String(av).localeCompare(String(bv));
    return termSortDir === 'asc' ? cmp : -cmp;
  });
  document.querySelectorAll('#term-head-row .sortable').forEach((th) => {
    th.querySelector('.sort-arrow').textContent = th.dataset.key === termSortKey ? (termSortDir === 'asc' ? ' ▲' : ' ▼') : '';
  });
  document.getElementById('term-summary').textContent = `${visible.length} of ${terminations.length}`;
  document.getElementById('term-rows').innerHTML = visible.length ? visible.map((r) => `
    <tr class="row-clickable" data-id="${r.id}" style="cursor:pointer">
      <td class="mono">${formatDate(r.termination_date)}</td>
      <td>${escapeHtml(r.emp_name || '—')}</td>
      <td class="mono dim">${escapeHtml(r.division || '—')}</td>
      <td class="mono dim">${escapeHtml(r.location || '—')}</td>
      <td>${escapeHtml(r.reason || '—')}</td>
      <td>${r.separation_type === 'involuntary' ? '<span class="pill bad">Involuntary</span>' : '<span class="pill ok">Voluntary</span>'}</td>
      <td class="dim term-notes-cell" data-id="${r.id}" style="cursor:pointer" title="Click to add or edit">${escapeHtml(r.circumstances || '— click to add')}</td>
    </tr>
  `).join('') : '<tr><td colspan="7" class="dim">No terminations logged yet.</td></tr>';
  document.querySelectorAll('#term-rows tr').forEach((tr) => {
    tr.addEventListener('click', (e) => {
      if (e.target.closest('.term-notes-cell')) return; // handled separately below
      const rec = terminations.find((r) => r.id === tr.dataset.id);
      if (rec) {
        document.getElementById('term-print-acts').hidden = false;
        renderTerminationSheet(rec);
      }
    });
  });
  // Exit-interview detail usually comes in after the termination is
  // already registered — this is the only field on a termination record
  // meant to be added or revised later, so it's editable straight from
  // the list instead of requiring the whole record to be reopened.
  document.querySelectorAll('.term-notes-cell').forEach((cell) => {
    cell.addEventListener('click', async (e) => {
      e.stopPropagation();
      const rec = terminations.find((r) => r.id === cell.dataset.id);
      if (!rec) return;
      const updated = prompt(`Notes / exit interview — ${rec.emp_name}`, rec.circumstances || '');
      if (updated === null) return;
      try {
        await updateDoc(doc(db, 'terminations', rec.id), { circumstances: updated.trim(), entered_by: profile.uid });
        rec.circumstances = updated.trim();
        renderTermRows();
        showToast('Note saved.');
      } catch (err) {
        console.error(err);
        showToast('Could not save — ' + err.message, 'error');
      }
    });
  });
}

// Reads the form into {record, finalPay} without touching Firestore —
// shared by both Print (never saves) and Register (saves record, not
// finalPay). Only needs an employee selected; nothing else is required
// to print, since printing shouldn't depend on the record being
// complete or on Firestore being reachable at all.
function buildTerminationRecord() {
  const empId = document.getElementById('term-emp').value;
  const emp = employees.find((e) => e.id === empId);
  if (!emp) { showToast('Select an employee.', 'error'); return null; }
  let reason = document.getElementById('term-reason').value;
  if (reason === 'Other') reason = document.getElementById('term-reason-other').value.trim() || 'Other';

  const propertyReturned = [...document.querySelectorAll('.term-property:checked')].map((c) => c.value);
  const notices = NOTICE_ITEMS.map((n) => ({
    key: n.key, label: n.label,
    status: document.getElementById(`term-notice-${n.key}`).value,
    date: document.getElementById(`term-notice-${n.key}-date`).value,
  }));

  const record = {
    emp_id: empId, emp_name: `${emp.first_name} ${emp.last_name}`,
    job_title: emp.position || '', division: emp.division || '', location: emp.location || '',
    hire_date: emp.hire_date || '',
    last_day_worked: document.getElementById('term-lastday').value,
    termination_date: document.getElementById('term-date').value,
    reason, circumstances: document.getElementById('term-circumstances').value.trim(),
    separation_type: involuntaryReasons.has(reason) ? 'involuntary' : 'voluntary',
    delivery_method: document.getElementById('term-delivery-method').value,
    property_returned: propertyReturned,
    notices,
    delivered_by: document.getElementById('term-delivered-by').value.trim(),
    date_delivered: document.getElementById('term-date-delivered').value,
    notice_delivery_method: document.getElementById('term-notice-delivery').value,
  };

  // Final-pay figures never join `record` above — they're read straight
  // from the form into the print sheet only, then discarded.
  const finalPay = {
    regHours: document.getElementById('term-reg-hours').value,
    otHours: document.getElementById('term-ot-hours').value,
    vac: document.getElementById('term-vac').value,
    sick: document.getElementById('term-sick').value,
    cmp: document.getElementById('term-cmp').value,
    other: document.getElementById('term-other-pay').value,
    amount: document.getElementById('term-final-wages').value,
    checkDate: document.getElementById('term-final-check-date').value,
  };
  return { record, finalPay };
}

function printTermination() {
  const built = buildTerminationRecord();
  if (!built) return;
  document.getElementById('term-print-acts').hidden = false;
  renderTerminationSheet(built.record, built.finalPay);
}

async function registerTermination() {
  const built = buildTerminationRecord();
  if (!built) return;
  const { record } = built;
  if (!record.last_day_worked || !record.termination_date) {
    showToast('Last day worked and termination date are required to register.', 'error');
    return;
  }

  try {
    const batch = writeBatch(db);
    const termRef = doc(collection(db, 'terminations'));
    batch.set(termRef, { ...record, entered_by: profile.uid, entered_at: serverTimestamp() });
    batch.update(doc(db, 'employees', record.emp_id), {
      status: 'terminated', separation_date: record.termination_date, separation_type: record.separation_type,
      entered_by: profile.uid, updated_at: serverTimestamp(),
    });
    await batch.commit();
    await addDoc(collection(db, 'activity'), {
      module: 'documents', item: `Termination registered — ${record.emp_name}`,
      entered_by: profile.uid, entered_at: serverTimestamp(),
    });
    showToast('Registered — reflects in reports now. No final-pay figures were saved.');
    await loadEmployees();
    terminations.push({ id: termRef.id, ...record });
    document.getElementById('term-form-card').hidden = true;
    renderTermRows();
  } catch (err) {
    console.error(err);
    showToast('Could not register — ' + err.message, 'error');
  }
}

// ---- Termination import — reads the "Terminations" sheet of the roster
// workbook. Upserts: existing employees get their status flipped and a
// terminations record filed; employees not currently in the roster (left
// before the roster snapshot) get a minimal terminated-status record
// created so history isn't lost. No pay figures exist in this sheet. ----

async function openTermImport() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="width:820px">
      <div class="modal-h"><h3>Import terminations</h3><button class="modal-close" id="ti-close" type="button">&times;</button></div>
      <div class="modal-body">
        <div id="ti-pick">
          <p class="dim" style="margin-bottom:10px">.xlsx or .csv. Looks for a sheet named "Terminations" first, otherwise the first sheet. Employee ID, name, and termination date are required per row.</p>
          <input class="f-in" id="ti-file" type="file" accept=".csv,text/csv,.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
        </div>
        <div id="ti-preview" hidden>
          <div id="ti-warnings"></div>
          <p id="ti-summary" style="margin:10px 0"></p>
          <div style="max-height:360px;overflow-y:auto;border:1px solid var(--edge)">
            <table>
              <thead><tr><th>Row</th><th>ID</th><th>Name</th><th>Term date</th><th>Reason</th><th>Status</th></tr></thead>
              <tbody id="ti-rows"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="gh" id="ti-cancel">Cancel</button>
        <button type="button" class="gh solid" id="ti-confirm" hidden>Import valid rows</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector('#ti-close').addEventListener('click', close);
  overlay.querySelector('#ti-cancel').addEventListener('click', close);

  // Same branch-code aliases as the roster import — the source sheets use
  // short codes (ENH, Corp) that don't match the Location dropdown values.
  const LOCATION_ALIASES = { enh: 'Enhancements', corp: 'Corporate' };
  const normalizeLocation = (raw) => {
    const v = String(raw || '').trim();
    return LOCATION_ALIASES[v.toLowerCase()] || v;
  };
  let parsed = [];

  overlay.querySelector('#ti-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const fileInput = overlay.querySelector('#ti-file');
    fileInput.disabled = true;
    overlay.querySelector('#ti-warnings').innerHTML = '<p class="dim">Reading file…</p>';
    try {
      const sheets = await readSpreadsheetSheets(file);
      const sheetName = Object.keys(sheets).find((n) => /terminat/i.test(n)) || Object.keys(sheets)[0];
      const { headers, rows, forbiddenColumns } = objectsFromRows(sheets[sheetName], [
        'Employee ID', 'Name', 'Job Title', 'Division', 'Branch', 'Manager', 'Term Date', 'Last Day', 'Reason',
      ]);
      const pick = (row, ...keys) => { for (const k of keys) if (row[k]) return row[k]; return ''; };
      const dateVal = (v) => {
        if (!v) return '';
        const d = v instanceof Date ? v : new Date(v);
        return Number.isNaN(d.getTime()) ? '' : d.toISOString().slice(0, 10);
      };
      const nameToId = new Map(allEmployeesEver.map((e) => [`${e.first_name} ${e.last_name}`.trim().toLowerCase(), e.id]));

      parsed = rows.map((row) => {
        const id = pick(row, 'employee_id', 'id').toString().trim();
        const name = pick(row, 'name', 'employee_name').toString().trim();
        const termDate = dateVal(pick(row, 'term_date', 'termination_date'));
        const errors = [];
        if (!id || !/^[a-z0-9-]+$/i.test(id)) errors.push('missing/invalid Employee ID — likely a summary or note row, not a record');
        if (!name) errors.push('missing name');
        if (!termDate) errors.push('missing/invalid term date');
        // Real export has "Reason (as entered)" plus a separately-computed
        // "Separation Type" column — only the raw reason is read here,
        // since involuntary/voluntary is re-derived below from the text.
        const reason = pick(row, 'reason_as_entered', 'reason').toString().trim();
        const separationTypeRaw = pick(row, 'separation_type').toString().trim().toLowerCase();
        return {
          id, name, job_title: pick(row, 'job_title', 'title'),
          division: pick(row, 'division'), location: normalizeLocation(pick(row, 'branch', 'location')),
          hire_date: dateVal(pick(row, 'hire_date')),
          last_day: dateVal(pick(row, 'last_day')),
          term_date: termDate,
          reason, notes: pick(row, 'notes'),
          // Some source sheets already have this computed — trust it over
          // guessing from reason-text keywords when it's present.
          separation_type: separationTypeRaw === 'involuntary' || separationTypeRaw === 'voluntary' ? separationTypeRaw : null,
          exists: allEmployeesEver.some((e) => e.id === id),
          errors,
        };
      });

      const validCount = parsed.filter((r) => !r.errors.length).length;
      const warnings = [];
      if (forbiddenColumns.length) warnings.push(`Ignored, never imported: ${forbiddenColumns.join(', ')}`);
      overlay.querySelector('#ti-warnings').innerHTML = warnings.length
        ? `<div class="login-error" style="background:var(--hover);color:var(--alertTx);border-color:var(--alertTx)">${warnings.join('<br>')}</div>` : '';
      // Shows exactly what column names this file was parsed with, so a
      // mismatch (wrong header row picked, an unexpected column name) is
      // visible right here instead of showing up as blank cells with no
      // explanation of why.
      const detectedNote = document.createElement('p');
      detectedNote.className = 'dim';
      detectedNote.style.cssText = 'margin:6px 0;font-size:11.5px';
      detectedNote.textContent = `Columns detected from sheet "${sheetName}": ${headers.filter(Boolean).join(', ')}`;
      overlay.querySelector('#ti-warnings').appendChild(detectedNote);
      overlay.querySelector('#ti-summary').textContent = `${validCount} of ${parsed.length} rows will be imported. ${parsed.length - validCount} skipped (summary/note rows or missing data).`;
      overlay.querySelector('#ti-rows').innerHTML = parsed.map((r, i) => `
        <tr>
          <td class="mono dim">${i + 1}</td>
          <td class="mono">${escapeHtml(r.id)}</td>
          <td>${escapeHtml(r.name)}</td>
          <td class="mono">${r.term_date || '—'}</td>
          <td class="dim">${escapeHtml(r.reason)}</td>
          <td>${r.errors.length ? `<span class="pill bad">${r.errors.join(', ')}</span>` : `<span class="pill ok">${r.exists ? 'Updates existing employee' : 'Creates historical record'}</span>`}</td>
        </tr>
      `).join('');
      overlay.querySelector('#ti-pick').hidden = true;
      overlay.querySelector('#ti-preview').hidden = false;
      overlay.querySelector('#ti-confirm').hidden = validCount === 0;
    } catch (err) {
      console.error(err);
      overlay.querySelector('#ti-warnings').innerHTML =
        `<div class="login-error" style="background:var(--hover);color:var(--alertTx);border-color:var(--alertTx)">Could not read that file — ${escapeHtml(err.message)}</div>`;
      fileInput.disabled = false;
    }
  });

  overlay.querySelector('#ti-confirm').addEventListener('click', async () => {
    const valid = parsed.filter((r) => !r.errors.length);
    try {
      for (let start = 0; start < valid.length; start += 50) {
        const chunk = valid.slice(start, start + 50);
        const batch = writeBatch(db);
        chunk.forEach((r) => {
          const separationType = r.separation_type
            || (/involuntary|policy|performance|attendance|layoff|elimination|not a fit|terminat/i.test(r.reason) ? 'involuntary' : 'voluntary');
          const termRef = doc(collection(db, 'terminations'));
          batch.set(termRef, {
            emp_id: r.id, emp_name: r.name, job_title: r.job_title, division: r.division, location: r.location,
            hire_date: r.hire_date, last_day_worked: r.last_day, termination_date: r.term_date,
            reason: r.reason, circumstances: r.notes, separation_type: separationType,
            entered_by: profile.uid, entered_at: serverTimestamp(),
          });
          const empRef = doc(db, 'employees', r.id);
          if (r.exists) {
            batch.update(empRef, { status: 'terminated', separation_date: r.term_date, separation_type: separationType, entered_by: profile.uid, updated_at: serverTimestamp() });
          } else {
            const [first_name, ...rest] = r.name.split(' ');
            batch.set(empRef, {
              first_name, last_name: rest.join(' '), division: r.division, location: r.location,
              position: r.job_title, hire_date: r.hire_date, status: 'terminated',
              separation_date: r.term_date, separation_type: separationType,
              entered_by: profile.uid, entered_at: serverTimestamp(),
            });
          }
        });
        await batch.commit();
      }
      await addDoc(collection(db, 'activity'), {
        module: 'documents', item: `Imported ${valid.length} termination records`,
        entered_by: profile.uid, entered_at: serverTimestamp(),
      });
      showToast(`Imported ${valid.length} termination records.`);
      await loadEmployees();
      await loadTerminations();
      renderTermRows();
      close();
    } catch (err) {
      console.error(err);
      showToast('Import failed — ' + err.message, 'error');
    }
  });
}

// ---- Offer / Increase / Promotion letters — reproduces the branded SWL
// letterhead tool exactly: same legal text, same letterhead/decor-band
// branding, same 7 letter types. Rate/salary are typed on the generator,
// printed, and never stored — same rule as everywhere else in this app.
// The pay-band reference table from that tool (Entry/Senior rates per
// role) is intentionally NOT carried over — that's exactly the kind of
// salary-band data CLAUDE.md says never to store, even as a static list
// baked into the app. Rate stays a manual entry, same as before. ----

const LETTER_TYPES = [
  { value: 'hourly-en', label: 'Hourly Offer Letter (English)', category: 'offer' },
  { value: 'hourly-es', label: 'Hourly Offer Letter (Español)', category: 'offer' },
  { value: 'salary', label: 'Salaried Offer Letter', category: 'offer' },
  { value: 'increase-en', label: 'Wage Increase Letter (English)', category: 'increase' },
  { value: 'increase-es', label: 'Wage Increase Letter (Español)', category: 'increase' },
  { value: 'promotion-hourly', label: 'Promotion Letter — Hourly', category: 'promotion' },
  { value: 'promotion-salary', label: 'Promotion Letter — Salary', category: 'promotion' },
];

  document.getElementById('gen-body').innerHTML = `

          <div class="field"><label class="f-lab">Branch</label>

        </div>
        <div class="frow">
          <div class="field"><label class="f-lab">Schedule</label>
            <select class="f-in" id="ltr-schedule-preset"><option value="">Select or type below…</option>${SCHEDULE_PRESETS.map(s => `<option>${s}</option>`).join('')}</select>

        </div>
        <div class="frow">

        ${managerIds.size === 0 ? '<p class="dim" style="margin:-4px 0 12px">No managers marked yet — add them in Settings → Managers.</p>' : ''}
        <div class="frow" id="ltr-rate-field">

          <div class="field" id="ltr-salary-field" hidden><label class="f-lab">Annual salary ($, printed only — never saved)</label><input class="f-in" id="ltr-salary" type="number" step="0.01"></div>
        </div>
        <div class="frow">
          <div class="field"><label class="f-lab">Letter date</label><input class="f-in" id="ltr-date" type="date"></div>
          <div class="field"><label class="f-lab">Start / effective date</label><input class="f-in" id="ltr-start" type="date"></div>
        </div>
        <div class="field"><label class="f-lab">Sign and return by</label><input class="f-in" id="ltr-return" type="date"></div>

      </div>
    </div>
    <div class="letter" id="ltr-sheet" hidden></div>

  const typeSel = document.getElementById('ltr-type');
  function fillTypes(category) {
    typeSel.innerHTML = LETTER_TYPES.filter((t) => t.category === category).map((t) => `<option value="${t.value}">${t.label}</option>`).join('');

  document.querySelectorAll('#ltr-tabs .tab').forEach((tab) => {

      document.querySelectorAll('#ltr-tabs .tab').forEach((t) => t.classList.toggle('active', t === tab));
      fillTypes(tab.dataset.category);
    });
  });
  fillTypes('offer');
  typeSel.addEventListener('change', toggleLetterFields);

  function toggleLetterFields() {
    const type = typeSel.value;
    const isSalary = type === 'salary' || type === 'promotion-salary';

  });
  document.getElementById('ltr-reportsto').addEventListener('change', (e) => {
    const m = employees.find((x) => x.id === e.target.value);
    document.getElementById('ltr-reportsto-title').value = m ? (m.position || '') : '';
  });

  document.getElementById('ltr-generate-btn').addEventListener('click', () => generateLetterSheet());
  document.getElementById('ltr-log-btn').addEventListener('click', async () => {
    const first = document.getElementById('ltr-first').value.trim();
    const last = document.getElementById('ltr-last').value.trim();

    const type = typeSel.value;
    const label = LETTER_TYPES.find((t) => t.value === type)?.label || 'Letter';
    try {
      await addDoc(collection(db, 'activity'), {
        module: 'documents', item: `${label} sent — ${first} ${last}`,
        entered_by: profile.uid, entered_at: serverTimestamp(),
      });
      showToast('Logged — no rate or salary data was recorded.');
    } catch (err) {
      console.error(err);
      showToast('Could not log — ' + err.message, 'error');
    }
  });
}

function buildHourlyEn(ctx) {

  return `${letterHead()}

function generateLetterSheet() {
  const type = document.getElementById('ltr-type').value;
  const first = document.getElementById('ltr-first').value.trim();
  const last = document.getElementById('ltr-last').value.trim();
  const branchKey = document.getElementById('ltr-branch').value;
  const loc = LOCATIONS[branchKey];
  const address = document.getElementById('ltr-address').value.trim();
  const schedule = document.getElementById('ltr-schedule').value.trim();
  const reportsToId = document.getElementById('ltr-reportsto').value;
  const reportsTo = employees.find((e) => e.id === reportsToId);
  const reportsToTitle = document.getElementById('ltr-reportsto-title').value.trim();
  const letterDate = document.getElementById('ltr-date').value;
  const startDate = document.getElementById('ltr-start').value;
  const returnDate = document.getElementById('ltr-return').value;
  const position = document.getElementById('ltr-position').value.trim();
  const empType = document.getElementById('ltr-emptype').value;
  const rate = parseFloat(document.getElementById('ltr-rate').value);
  const salary = parseFloat(document.getElementById('ltr-salary').value);

  if (!first || !last) return showToast('Enter the employee\'s name.', 'error');
  if (!loc) return showToast('Select a branch.', 'error');
  if (!address) return showToast('Enter a facility address.', 'error');
  if (!schedule) return showToast('Enter a schedule.', 'error');
  if (!reportsTo) return showToast('Select who this employee reports to.', 'error');
  if (!letterDate || !startDate || !returnDate) return showToast('Letter date, start date, and return-by date are all required.', 'error');
  const positionRequired = type !== 'increase-en' && type !== 'increase-es';
  if (positionRequired && !position) return showToast('Enter a position title.', 'error');
  const isSalaryType = type === 'salary' || type === 'promotion-salary';
  if (!isSalaryType && (!rate || rate <= 0)) return showToast('Enter a valid hourly rate.', 'error');
  if (isSalaryType && (!salary || salary <= 0)) return showToast('Enter a valid annual salary.', 'error');

  const isEs = type === 'hourly-es' || type === 'increase-es';
  const ctx = {
    name: `${first} ${last}`,
    date: longDate(letterDate, isEs), startDate: longDate(startDate, isEs), returnDate: longDate(returnDate, isEs),
    position, empType, rate, salary, address, schedule, branchLabel: loc.label,
    supervisorName: `${reportsTo.first_name} ${reportsTo.last_name}`,
    supervisorTitle: reportsToTitle || reportsTo.position || '',
  };

  const builders = {
    'hourly-en': buildHourlyEn, 'hourly-es': buildHourlyEs, salary: buildSalary,
    'increase-en': buildIncreaseEn, 'increase-es': buildIncreaseEs,
    'promotion-hourly': buildPromotionHourly, 'promotion-salary': buildPromotionSalary,
  };
  const sheet = document.getElementById('ltr-sheet');
  sheet.hidden = false;
  sheet.innerHTML = builders[type](ctx);
  sheet.scrollIntoView({ behavior: 'smooth' });
  showToast('Letter generated.');
}

// Matches "Employee File Checklist" / "Lista de Verificación del
// Expediente del Empleado" exactly. This tracks which of the real 24
// onboarding documents are on file — it does not generate those
// documents themselves. Several (I-9, W-4, DE-4, Direct Deposit,
// Application with SSN) are exactly the data types this system never
// stores, so they stay physical/separate by design; this is only the
// checklist that says whether each one has been collected.
async function renderOnboarding(lang) {
  document.getElementById('gen-body').innerHTML = `

      <div class="card-body">
        <div class="field"><label class="f-lab">New hire</label><select class="f-in" id="onb-emp">${empSelectOptions(employees.filter((e) => e.status === 'onboarding'))}</select></div>

      </div>
    </div>
    <div class="form-doc" id="onb-sheet" hidden></div>
  `;

  async function loadChecklist() {
    const empId = document.getElementById('onb-emp').value;
    const emp = employees.find((e) => e.id === empId);
    const isEs = document.getElementById('lang-select').value === 'es';
    const snap = await getDocs(collection(db, 'employees', empId, 'onboarding_docs'));
    const existing = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));

    // If this employee predates the real 24-item list (or was seeded
    // with the old 4-item placeholder), fill in whatever's missing so
    // the checklist always shows the full real list.
    const items = ONBOARDING_CHECKLIST.map((docItem, i) => {
      const found = [...existing.values()].find((it) => it.title === docItem.en);
      return found || { id: String(i), title: docItem.en, on_file: false, _unsaved: true };
    });

    const sheet = document.getElementById('onb-sheet');
    sheet.hidden = false;
    sheet.innerHTML = `

          <div class="form-cell"><b>${isEs ? 'Puesto' : 'Title'}</b>${emp.position || ''}</div>
          <div class="form-cell"><b>${isEs ? 'Salario' : 'Wage'}</b>&nbsp;</div>
          <div class="form-cell"><b>${isEs ? 'Nombre (Licencia)' : 'DL Name'}</b>&nbsp;</div>
          <div class="form-cell" style="grid-column:1/-1"><b>${isEs ? 'Dirección' : 'Address'}</b>&nbsp;</div>
        </div>
        <div class="form-section">${isEs ? 'Documentos de Incorporación' : 'Onboarding Documents'}</div>
        <table class="form-notice-table">
          <thead><tr><th>${isEs ? 'Formulario' : 'Form'}</th><th>${isEs ? 'Completado' : 'Completed'}</th></tr></thead>
          <tbody>
            ${items.map((it, i) => `
              <tr>
                <td>${isEs ? ONBOARDING_CHECKLIST[i].es : it.title}</td>

// ---- SOP — matches the real SWL Standard Operating Procedure format:
// letterhead, a metadata grid (SOP number/dates/revision), PURPOSE and
// SCOPE section bars, a Responsibilities table, a numbered Procedure
// table, and standalone notice boxes. Saves straight to Documents
// (training_documents, content_type:'sop') rather than a print-only
// sheet — an SOP is reference content people look up later, not a
// one-time signed record. ----

function renderSop() {
  document.getElementById('gen-body').innerHTML = `
    <div class="card no-print" style="margin-bottom:16px">
      <div class="card-body">
        <div class="frow">
          <div class="field"><label class="f-lab">Name of procedure</label><input class="f-in" id="sop-title" placeholder="e.g. Equipment Damage Reporting"></div>
          <div class="field"><label class="f-lab">SOP number</label><input class="f-in" id="sop-number" placeholder="e.g. HR-005"></div>
        </div>
        <div class="frow">
          <div class="field"><label class="f-lab">Date created</label><input class="f-in" id="sop-date-created" type="date"></div>
          <div class="field"><label class="f-lab">Implementation date</label><input class="f-in" id="sop-impl-date" type="date"></div>
        </div>
        <div class="frow">
          <div class="field"><label class="f-lab">Revision number</label><input class="f-in" id="sop-revision" value="1"></div>
          <div class="field"><label class="f-lab">Prepared by</label><input class="f-in" id="sop-prepared-by" value="Human Resources"></div>
        </div>
        <div class="field"><label class="f-lab">Purpose</label><textarea class="f-in" id="sop-purpose" rows="2" style="resize:vertical" placeholder="Why this SOP exists, in a sentence or two."></textarea></div>
        <div class="field"><label class="f-lab">Scope</label><textarea class="f-in" id="sop-scope" rows="2" style="resize:vertical" placeholder="Who this applies to and when."></textarea></div>
        <div class="field">
          <label class="f-lab">Responsibilities — one role per line: Role | what they're responsible for</label>
          <textarea class="f-in" id="sop-responsibilities" rows="4" style="resize:vertical" placeholder="Manager/Supervisor | Identifying the issue and notifying HR&#10;Human Resources | Reviewing and filing the completed record"></textarea>
        </div>
        <div class="field">
          <label class="f-lab">Procedure steps — one step per line: Step title | instruction; instruction; instruction</label>
          <textarea class="f-in" id="sop-procedure" rows="6" style="resize:vertical" placeholder="Identify the Issue | Manager documents what happened; notes date and time&#10;Notify HR | HR is copied within 24 hours"></textarea>
        </div>
        <div class="field">
          <label class="f-lab">Notice boxes (optional) — one per line, e.g. legal reminders or exceptions</label>
          <textarea class="f-in" id="sop-notices" rows="3" style="resize:vertical" placeholder="Retention. Keep this record for the duration of employment plus 4 years."></textarea>
        </div>
        <button class="gh solid" id="sop-preview-btn" type="button">Preview</button>
        <button class="gh" id="sop-save-btn" type="button">Save to Documents</button>
      </div>
    </div>
    <div class="sop-doc" id="sop-sheet" hidden></div>
  `;

  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('sop-date-created').value = today;
  document.getElementById('sop-impl-date').value = today;

  document.getElementById('sop-preview-btn').addEventListener('click', () => {
    const record = buildSopRecord();
    if (record) renderSopSheet(record);
  });
  document.getElementById('sop-save-btn').addEventListener('click', saveSop);
}

// "Role | text" / "Title | a; b; c" — a small line-based convention
// rather than dynamic add/remove-row UI, since an SOP is written once
// and rarely edited after.
function buildSopRecord() {
  const title = document.getElementById('sop-title').value.trim();
  if (!title) { showToast('Enter the procedure name.', 'error'); return null; }

  const responsibilities = document.getElementById('sop-responsibilities').value.split('\n')
    .map((l) => l.trim()).filter(Boolean)
    .map((l) => {
      const [role, responsible_for] = l.split('|').map((s) => (s || '').trim());
      return { role: role || '', responsible_for: responsible_for || '' };
    });

  const procedure = document.getElementById('sop-procedure').value.split('\n')
    .map((l) => l.trim()).filter(Boolean)
    .map((l) => {
      const [stepTitle, rest] = l.split('|').map((s) => (s || '').trim());
      const instructions = (rest || '').split(';').map((s) => s.trim()).filter(Boolean);
      return { title: stepTitle || '', instructions };
    });

  const notices = document.getElementById('sop-notices').value.split('\n').map((l) => l.trim()).filter(Boolean);

  return {
    title,
    sop_number: document.getElementById('sop-number').value.trim(),
    date_created: document.getElementById('sop-date-created').value,
    implementation_date: document.getElementById('sop-impl-date').value,
    revision_number: document.getElementById('sop-revision').value.trim(),
    prepared_by: document.getElementById('sop-prepared-by').value.trim(),
    last_updated: new Date().toISOString().slice(0, 10),
    purpose: document.getElementById('sop-purpose').value.trim(),
    scope: document.getElementById('sop-scope').value.trim(),
    responsibilities, procedure, notices,
  };
}

// Same layout as documents.html's renderSopHtml — kept as a duplicate
// on purpose (this app has no shared-JS-across-pages setup), so the
// preview here and the saved version viewed from Documents look
// identical rather than drifting apart over time.
function renderSopSheet(record) {
  const respRows = record.responsibilities.map((r) => `<tr><td class="step-title">${escapeHtml(r.role)}</td><td>${escapeHtml(r.responsible_for)}</td></tr>`).join('');
  const procRows = record.procedure.map((p, i) => `
    <tr>
      <td class="step-num">${i + 1}</td>
      <td class="step-title">${escapeHtml(p.title)}</td>
      <td>${p.instructions.map((line) => `• ${escapeHtml(line)}`).join('<br>')}</td>
    </tr>
  `).join('');
  const notices = record.notices.map((n) => {
    const dotIdx = n.indexOf('. ');
    const lead = dotIdx > -1 && dotIdx < 60 ? n.slice(0, dotIdx + 1) : '';
    const rest = lead ? n.slice(dotIdx + 2) : n;
    return `<div class="sop-callout">${lead ? `<b>${escapeHtml(lead)}</b> ` : ''}${escapeHtml(rest)}</div>`;
  }).join('');

  const sheet = document.getElementById('sop-sheet');
  sheet.hidden = false;
  sheet.scrollIntoView({ behavior: 'smooth' });
  sheet.innerHTML = `
    <div class="sop-doc-inner">
      <div class="sop-head">
        <img src="${LOGO_DATA_URL}" alt="SouthWest Landscape">
        <div class="wordmark">SouthWest<br>Landscape</div>
      </div>
      <div class="sop-eyebrow">Standard Operating</div>
      <div class="sop-bigtitle">Procedure</div>
      <div class="sop-name-label">Name of Procedure</div>
      <div class="sop-name">${escapeHtml(record.title)}</div>
      <div class="sop-meta">
        <div><b>Date Created</b>${escapeHtml(formatDate(record.date_created))}</div>
        <div><b>SOP Number</b>${escapeHtml(record.sop_number) || '—'}</div>
        <div><b>Prepared By</b>${escapeHtml(record.prepared_by) || '—'}</div>
        <div><b>Implementation Date</b>${escapeHtml(formatDate(record.implementation_date))}</div>
        <div><b>Revision Number</b>${escapeHtml(record.revision_number) || '—'}</div>
        <div><b>Last Updated</b>${escapeHtml(formatDate(record.last_updated))}</div>
      </div>
      <div class="sop-section">Purpose</div>
      <div class="sop-box">${escapeHtml(record.purpose) || '—'}</div>
      <div class="sop-section">Scope</div>
      <div class="sop-box">${escapeHtml(record.scope) || '—'}</div>
      ${respRows ? `
        <div class="sop-section">Responsibilities</div>
        <table class="sop-table">
          <thead><tr><th style="width:26%">Role</th><th>Responsible For</th></tr></thead>
          <tbody>${respRows}</tbody>
        </table>
      ` : ''}
      ${procRows ? `
        <div class="sop-section">Procedure</div>
        <table class="sop-table">
          <thead><tr><th>Step</th><th>Procedure Title</th><th>Instructions</th></tr></thead>
          <tbody>${procRows}</tbody>
        </table>
      ` : ''}
      ${notices}
      <div class="sop-footer">SouthWest Landscape, Inc. — Internal Use Only${record.sop_number ? ` — SOP ${escapeHtml(record.sop_number)}` : ''}</div>
    </div>
    <button class="gh no-print" id="sop-back-btn" type="button" style="margin:14px">&larr; Back to document generator</button>
  `;
  document.getElementById('sop-back-btn').addEventListener('click', () => document.getElementById('back-btn').click());
}

async function saveSop() {
  const record = buildSopRecord();
  if (!record) return;
  try {
    await setDoc(doc(collection(db, 'training_documents')), {
      ...record, category: 'sop', content_type: 'sop',
      entered_by: profile.uid, uploaded_at: serverTimestamp(),
    });
    showToast('Saved — view it any time in Documents.');
    renderSopSheet(record);
  } catch (err) {
    console.error(err);
    showToast('Could not save — ' + err.message, 'error');
  }
}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — SWL HR Center</title>
<link rel="icon" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-brand">SWL HR Center</div>
    <div class="login-sub">SOUTHWEST LANDSCAPE — INTERNAL USE ONLY</div>

    <div id="login-error" class="login-error" hidden></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <label class="login-remember">
        <input type="checkbox" id="remember-me" />
        Keep me signed in on this device
      </label>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign in</button>
    </form>

    <p style="margin-top:16px; text-align:center;">
      <a href="#" id="forgot-link" style="font-size:12px; color: var(--sidebar-text-dim);">Forgot password?</a>
    </p>
  </div>

<script type="module">
import { login, redirectIfAuthenticated, requestPasswordReset, friendlyAuthError } from '/auth.js';

redirectIfAuthenticated();

const form = document.getElementById('login-form');
const errorBox = document.getElementById('login-error');
const submitBtn = document.getElementById('login-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.hidden = true;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Signing in…';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const rememberMe = document.getElementById('remember-me').checked;

  try {
    await login(email, password, rememberMe);
    window.location.href = '/dashboard.html';
  } catch (err) {
    errorBox.textContent = friendlyAuthError(err);
    errorBox.hidden = false;
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign in';
  }
});

document.getElementById('forgot-link').addEventListener('click', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) {
    errorBox.textContent = 'Enter your email above first, then click "Forgot password?" again.';
    errorBox.hidden = false;
    return;
  }
  try {
    await requestPasswordReset(email);
    errorBox.textContent = 'Password reset email sent — check your inbox.';
    errorBox.hidden = false;
  } catch (err) {
    errorBox.textContent = friendlyAuthError(err);
    errorBox.hidden = false;
  }
});
</script>
</body>
</html>

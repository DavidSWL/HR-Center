<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applicants — SWL HR</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.app-row.grayed{opacity:.5}
.app-row.grayed td{color:var(--faint)}
.app-row td{vertical-align:middle}
.app-cb{width:17px;height:17px;cursor:pointer}
.app-cb:disabled{cursor:not-allowed}
.app-name-cell{font-weight:600}
</style>
</head>
<body>

<div class="app">
  <aside class="side" id="sidebar"></aside>

  <div class="main" id="main" data-theme="light">
    <header class="bar">
      <div><h1>Applicants</h1></div>
      <div style="display:flex;align-items:center;gap:18px">
        <div class="toggle">
          <button class="on" data-t="light" type="button">Light</button>
          <button data-t="dark" type="button">Dark</button>
        </div>
        <div class="s" id="header-date"></div>
      </div>
    </header>

    <section class="view">

      <div class="card" style="margin-bottom:16px">
        <div class="card-h"><h3>New applicant</h3><span>Name and how they applied — everything else is tracked below</span></div>
        <div class="card-body">
          <div class="frow">
            <div class="field">
              <label class="f-lab" for="new-app-name">Name</label>
              <input class="f-in" id="new-app-name" placeholder="First and last name">
            </div>
            <div class="field">
              <label class="f-lab" for="new-app-source">How they applied</label>
              <select class="f-in" id="new-app-source">
                <option value="walk_in">Walk-in</option>
                <option value="referral">Referral</option>
                <option value="past_employee">Past employee</option>
                <option value="indeed">Indeed</option>
              </select>
            </div>
          </div>
          <button class="gh solid" id="add-applicant-btn" type="button">Add applicant</button>
        </div>
      </div>

      <div class="card">
        <div class="card-h"><h3>Applicant tracker</h3><span id="tracker-summary">—</span></div>
        <div class="tools">
          <input class="inp" id="search" placeholder="Search name" style="min-width:190px">
          <select class="inp" id="status-filter">
            <option value="">Everyone</option>
            <option value="active">Active pipeline</option>
            <option value="not_passed">Did not pass interview</option>
            <option value="oriented">Orientation completed</option>
          </select>
        </div>
        <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>How applied</th>
              <th>Applied</th>
              <th>Pre-screen</th>
              <th>1st round interview</th>
              <th>Physical / drug exam</th>
              <th>Orientation booked</th>
              <th>Orientation done</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        </div>
      </div>
    </section>
  </div>
</div>

<script type="module">
import { requireAuth } from './auth.js';
import { initShell, showToast, formatDate } from './app.js';
import { db } from './firebaseconfig.js';
import {
  collection, doc, getDocs, setDoc, updateDoc, deleteDoc, serverTimestamp,
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const profile = await requireAuth();
if (!profile) throw new Error('not authenticated');
initShell('applicants', profile);

document.getElementById('header-date').textContent =
  new Date().toLocaleDateString('en-US', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();

const SOURCE_LABELS = { walk_in: 'Walk-in', referral: 'Referral', past_employee: 'Past employee', indeed: 'Indeed' };

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

let applicants = [];

async function loadApplicants() {
  const snap = await getDocs(collection(db, 'applicants'));
  applicants = snap.docs
    .map((d) => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (b.entered_at?.seconds || 0) - (a.entered_at?.seconds || 0));
  render();
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const statusFilter = document.getElementById('status-filter').value;

  const visible = applicants.filter((a) => {
    if (q && !(a.name || '').toLowerCase().includes(q)) return false;
    if (statusFilter === 'active' && a.interview_status === 'not_passed') return false;
    if (statusFilter === 'not_passed' && a.interview_status !== 'not_passed') return false;
    if (statusFilter === 'oriented' && !a.orientation_completed) return false;
    return true;
  });

  const activeCount = applicants.filter((a) => a.interview_status !== 'not_passed').length;
  document.getElementById('tracker-summary').textContent = `${visible.length} of ${applicants.length} — ${activeCount} active`;

  document.getElementById('rows').innerHTML = visible.length ? visible.map((a) => {
    const grayed = a.interview_status === 'not_passed';
    return `
      <tr class="app-row${grayed ? ' grayed' : ''}" data-id="${a.id}">
        <td class="app-name-cell">${escapeHtml(a.name)}</td>
        <td class="dim">${SOURCE_LABELS[a.source] || a.source}</td>
        <td class="mono dim">${formatDate(a.applied_date)}</td>
        <td style="text-align:center"><input type="checkbox" class="app-cb prescreen-cb" data-id="${a.id}" ${a.prescreen_passed ? 'checked' : ''}></td>
        <td>
          <select class="inp interview-select" data-id="${a.id}" style="height:32px;font-size:12.5px">
            <option value="pending" ${a.interview_status === 'pending' || !a.interview_status ? 'selected' : ''}>Pending</option>
            <option value="passed" ${a.interview_status === 'passed' ? 'selected' : ''}>Passed</option>
            <option value="not_passed" ${a.interview_status === 'not_passed' ? 'selected' : ''}>Did not pass</option>
          </select>
        </td>
        <td style="text-align:center"><input type="checkbox" class="app-cb physical-cb" data-id="${a.id}" ${a.physical_passed ? 'checked' : ''} ${grayed ? 'disabled' : ''}></td>
        <td><input class="inp orientation-date-in" data-id="${a.id}" type="date" value="${a.orientation_booked_date || ''}" style="height:32px" ${grayed ? 'disabled' : ''}></td>
        <td style="text-align:center"><input type="checkbox" class="app-cb orientation-cb" data-id="${a.id}" ${a.orientation_completed ? 'checked' : ''} ${grayed ? 'disabled' : ''}></td>
        <td style="text-align:right;white-space:nowrap"><button class="gh remove-btn" data-id="${a.id}" type="button">Remove</button></td>
      </tr>
    `;
  }).join('') : '<tr><td colspan="9" class="dim">No applicants match.</td></tr>';

  document.querySelectorAll('.prescreen-cb').forEach((cb) => {
    cb.addEventListener('change', () => updateApplicant(cb.dataset.id, { prescreen_passed: cb.checked }));
  });
  document.querySelectorAll('.interview-select').forEach((sel) => {
    sel.addEventListener('change', () => updateApplicant(sel.dataset.id, { interview_status: sel.value }));
  });
  document.querySelectorAll('.physical-cb').forEach((cb) => {
    cb.addEventListener('change', () => updateApplicant(cb.dataset.id, { physical_passed: cb.checked }));
  });
  document.querySelectorAll('.orientation-date-in').forEach((inp) => {
    inp.addEventListener('change', () => updateApplicant(inp.dataset.id, { orientation_booked_date: inp.value }));
  });
  document.querySelectorAll('.orientation-cb').forEach((cb) => {
    cb.addEventListener('change', () => updateApplicant(cb.dataset.id, { orientation_completed: cb.checked }));
  });
  document.querySelectorAll('.remove-btn').forEach((btn) => {
    btn.addEventListener('click', () => removeApplicant(btn.dataset.id));
  });
}

async function updateApplicant(id, fields) {
  try {
    await updateDoc(doc(db, 'applicants', id), { ...fields, entered_by: profile.uid, updated_at: serverTimestamp() });
    const a = applicants.find((x) => x.id === id);
    if (a) Object.assign(a, fields);
    render();
  } catch (err) {
    console.error(err);
    showToast('Could not update — ' + err.message, 'error');
    await loadApplicants();
  }
}

async function removeApplicant(id) {
  const a = applicants.find((x) => x.id === id);
  if (!a || !confirm(`Remove ${a.name} from the tracker? This can't be undone.`)) return;
  try {
    await deleteDoc(doc(db, 'applicants', id));
    showToast('Removed.');
    await loadApplicants();
  } catch (err) {
    console.error(err);
    showToast('Could not remove — ' + err.message, 'error');
  }
}

document.getElementById('add-applicant-btn').addEventListener('click', async () => {
  const name = document.getElementById('new-app-name').value.trim();
  if (!name) { showToast('Enter a name.', 'error'); return; }
  const source = document.getElementById('new-app-source').value;
  try {
    await setDoc(doc(collection(db, 'applicants')), {
      name, source,
      applied_date: new Date().toISOString().slice(0, 10),
      prescreen_passed: false,
      interview_status: 'pending',
      physical_passed: false,
      orientation_booked_date: '',
      orientation_completed: false,
      entered_by: profile.uid,
      entered_at: serverTimestamp(),
    });
    document.getElementById('new-app-name').value = '';
    showToast('Applicant added.');
    await loadApplicants();
  } catch (err) {
    console.error(err);
    showToast('Could not add — ' + err.message, 'error');
  }
});

document.getElementById('search').addEventListener('input', render);
document.getElementById('status-filter').addEventListener('change', render);

await loadApplicants();
</script>
</body>
</html>

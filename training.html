<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team training — SWL HR</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="styles.css">
<style>
@media print { .side, .bar, .no-print { display:none !important; } .app{display:block} }
.section-item{border:1px solid var(--line);padding:14px;margin-bottom:10px;background:var(--raise)}
.section-item.locked{opacity:.5}
.cert{border:4px solid var(--oregon);padding:40px;text-align:center;background:var(--raise)}
.cert h2{font-family:var(--display);font-size:28px;margin:0 0 6px}
@keyframes cert-in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.cert{animation:cert-in .5s ease-out}
.domain-row{display:grid;grid-template-columns:1fr 200px 50px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}

</head>
<body>

<div class="app">
  <aside class="side" id="sidebar"></aside>

  <div class="main" id="main" data-theme="light">
    <header class="bar">
      <div><h1 id="page-title">Team training</h1></div>
      <div style="display:flex;align-items:center;gap:18px">
        <div class="toggle">
          <button class="on" data-t="light" type="button">Light</button>
          <button data-t="dark" type="button">Dark</button>
        </div>
        <div class="s" id="header-date"></div>
      </div>
    </header>

    <section class="view">

      <!-- LIBRARY -->
      <div id="library-view">
        <div class="card" style="margin-bottom:16px">
          <div class="card-h"><h3>Course library</h3><span></span></div>
          <div class="tools">
            <button class="gh solid" id="add-course-btn" type="button">Add course</button>
            <button class="gh" id="load-starter-btn" type="button">Load starter courses</button>
          </div>
          <table><tbody id="course-rows"></tbody></table>
        </div>

        <div class="card">
          <div class="card-h"><h3>SHRM-CP exam prep — progress by domain</h3><span>Self-tracked</span></div>
          <div class="card-body" id="shrm-body"></div>
        </div>
      </div>

      <!-- COURSE DETAIL -->
      <div id="course-view" hidden>
        <button class="gh no-print" id="back-btn" type="button" style="margin-bottom:16px">&larr; Course library</button>
        <div class="card" style="margin-bottom:16px">
          <div class="card-h"><h3 id="course-title">—</h3><span></span></div>
          <div class="card-body" id="course-desc"></div>
        </div>
        <div id="sections-list"></div>
        <div class="card" id="test-card" hidden style="margin-top:16px">
          <div class="card-h"><h3>Final test</h3><span>Every question must be correct to pass</span></div>
          <div class="card-body" id="test-body"></div>
        </div>
        <div id="cert-view" hidden style="margin-top:16px">
          <div class="cert">
            <div style="font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin-bottom:14px">SouthWest Landscape HR</div>
            <h2>Certificate of Completion</h2>
            <p id="cert-name" style="font-size:16px;margin:10px 0"></p>
            <p id="cert-course" class="dim"></p>
            <p id="cert-meta" class="mono dim" style="font-size:11px;margin-top:16px"></p>
            <button class="gh solid no-print" id="print-cert-btn" type="button" style="margin-top:20px">Print certificate</button>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- add course modal -->
<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" style="width:640px">
    <div class="modal-h"><h3>Add course</h3><button class="modal-close" id="modal-close" type="button">&times;</button></div>
    <div class="modal-body">
      <div class="field">
        <label class="f-lab" for="new-title">Title</label>
        <input class="f-in" id="new-title" required>
      </div>
      <div class="field">
        <label class="f-lab" for="new-desc">Description</label>
        <input class="f-in" id="new-desc">
      </div>

      <div class="card-h" style="margin:14px -18px 10px"><h3>Sections</h3><span></span></div>
      <div id="new-sections"></div>
      <button class="gh" id="add-section-btn" type="button" style="margin-bottom:16px">+ Add section</button>

      <div class="card-h" style="margin:14px -18px 10px"><h3>Test questions</h3><span>Multiple choice, one correct answer each</span></div>
      <div id="new-questions"></div>
      <button class="gh" id="add-question-btn" type="button">+ Add question</button>
    </div>
    <div class="modal-actions">
      <button type="button" class="gh" id="new-course-cancel">Cancel</button>
      <button type="button" class="gh solid" id="new-course-save">Save course</button>
    </div>
  </div>
</div>

        'Warnings move through four steps: Verbal, First Warning, Second Warning, Final Warning. The system computes an employee\'s position on the ladder from the sequence of their own prior write-ups, oldest first — not from whatever level you happen to select on a single form. Severity can still justify skipping straight to a later step, or directly to termination, regardless of how many prior steps exist.' },
      { title: 'Filling out the write-up form', type: 'reading', content:

  {
    title: 'SOP: New Hire Onboarding Process (HR-002)',
    description: 'Company SOP — the 6-step onboarding procedure, role-specific requirements, and the I-9 deadline.',
    sections: [
      { title: 'Purpose & responsibilities', type: 'reading', content:
        'This SOP covers onboarding from offer acceptance through completed documentation, training, and orientation, across Maintenance, Irrigation, and Landscape. HR prepares the onboarding packet, schedules orientation, verifies Form I-9 within 3 business days of start, submits the DMV pull for driving positions, coordinates pesticide handler training where applicable, tracks completion via the EE File Checklist, and files all signed documents. The hiring manager confirms start date and role details, and flags any role-specific requirements (driving duties, pesticide handling) before Day One. The new hire completes and signs all required documentation accurately.' },

    ],
    test_questions: [
      { question: 'How many business days does federal law allow for completing Form I-9, and can this deadline be extended?', choices: ['5 business days, extendable with HR approval', '3 business days, not extendable for any reason', '10 business days, extendable once', 'There is no federal deadline'], correct_index: 1 },

    ],

  {
    title: 'SOP: Employee Termination Process (HR-003)',
    description: 'Company SOP — final pay timing, the four required separation notices, and property return.',
    sections: [
      { title: 'Purpose, responsibilities & notification', type: 'reading', content:
        'This SOP covers voluntary and involuntary separations across Maintenance, Irrigation, and Landscape, including final pay timing, required notices, and property return. HR prepares the Termination Form, coordinates final pay timing with Payroll, provides all legally required separation notices, confirms return of company property, and files final documentation. The manager/supervisor notifies HR of a termination decision or resignation, including effective date and reason, and conducts or participates in the termination meeting. Payroll calculates and issues final wages, including accrued vacation payout, within the legally required timeframe.' },
      { title: 'Final pay timing & the termination meeting', type: 'reading', content:

      { title: 'Required notices, property return & filing', type: 'reading', content:
        'Four separation notices apply based on criteria, and none are optional regardless of how routine the separation seems: the EDD "For Your Benefit" Pamphlet (DE 2320) is required for every separation, including voluntary resignations; Notice to Employee as to Change in Relationship for involuntary separations; COBRA Election Notice to the plan administrator; HIPP Notice (DHCS 9061) for eligible employees losing group health coverage. Company property (keys, uniform, laptop, phone, CC/gas card, vehicle) is collected, and email/system and building/key fob access is revoked. The completed Termination Form, with all Required Notices Provided checkboxes filled in and signed (or witnessed if the employee refuses/is unavailable), is filed in the personnel file.' },
    ],
    test_questions: [
      { question: 'For an involuntary termination, when are final wages due?', choices: ['Within 3 business days', 'Immediately, same day — no grace period', 'On the next scheduled payday', 'Within 30 days'], correct_index: 1 },
      { question: 'Which required separation notice applies to every termination, including voluntary resignations?', choices: ['COBRA Election Notice only', 'HIPP Notice only', 'The EDD "For Your Benefit" Pamphlet (DE 2320)', 'None — notices are only for involuntary terminations'], correct_index: 2 },
      { question: 'What is the maximum waiting-time penalty exposure for missing the final pay deadline?', choices: ['A flat $500 fine', 'Up to 30 days of the employee\'s daily wage, under Labor Code §201-203', 'No penalty if the delay is under a week', 'Penalties only apply to involuntary terminations'], correct_index: 1 },
    ],
  },
  {
    title: 'SOP: Employee Write-Up / Disciplinary Process (HR-004)',
    description: 'Company SOP — warning levels, retention requirements, and how write-ups factor into other decisions.',
    sections: [
      { title: 'Identifying the issue & warning level', type: 'reading', content:
        'The manager/supervisor documents the specific infraction — tardiness/leaving early, absenteeism, violation of company policies, substandard work, violation of safety rules, or rudeness to customers/coworkers — then determines the warning level (Verbal, First, Second, or Final) based on severity and prior history. The Company reserves the right to skip steps or proceed directly to termination for serious misconduct. HR reviews completed write-ups for consistency and monitors for patterns across employees or divisions.' },
      { title: 'Completing the form, discussing it, and signatures', type: 'reading', content:
        'The write-up form covers Description of Infraction, Plan for Improvement with a Follow-Up Review Date, and Consequences of Further Infractions. The manager reviews it with the employee in person; the employee may add optional comments/response. Employee and manager both sign; a witness signs if the employee understands the warning but refuses to sign. The original is filed in the personnel file, and HR is notified for pattern tracking. The manager checks in with the employee at the Follow-Up Review Date to assess improvement.' },
      { title: 'Retention, copies, and how write-ups factor into other decisions', type: 'reading', content:

      { question: 'If an employee requests to inspect or receive a copy of their personnel record, how quickly must it be provided?', choices: ['Within 5 business days', 'Within 30 days', 'Within 90 days', 'There is no deadline'], correct_index: 1 },
    ],
  },
  {
    title: 'Meal & Rest Break Compliance (California)',
    description: 'The 5th/10th-hour triggers, valid waivers, premium pay, a worked example, common mistakes, and how missed breaks get documented here.',
    sections: [
      { title: 'The triggers and what a compliant break looks like', type: 'reading', content:
        'A California non-exempt employee working more than 5 hours in a shift is owed a 30-minute unpaid, duty-free meal period starting before the end of the 5th hour, unless the shift is 6 hours or less and both employee and employer agree in writing to waive it. A second 30-minute meal period is owed once the shift passes 10 hours, unless the shift is 12 hours or less, the first meal period was taken, and both parties agree to waive the second. "Duty-free" means relieved of all duties, free to leave the premises, and not on call — an employee who eats at their desk while monitoring equipment or phones has not received a compliant meal period. Rest breaks are separate: a paid 10-minute net rest period for every 4 hours worked (or major fraction), as close to the middle of each work period as practical. Rest breaks cannot be combined with the meal period or skipped in exchange for leaving early.' },
      { title: 'Premiums, and why "we paid it" doesn\'t always end the story', type: 'reading', content:
        'A missed, late, short, or interrupted meal or rest period each owes one hour of premium pay at the employee\'s regular rate — up to two premiums per day, one for meal and one for rest, and they can stack (Labor Code §226.7). The California Supreme Court held in Naranjo v. Spectrum Security Services (2022) that these premiums are themselves wages, not just penalties — meaning they must be reported on the itemized wage statement and are subject to the same waiting-time-penalty exposure at termination if unpaid. Paying the premium does not retroactively make a late or skipped break compliant; it compensates the employee for the violation, and a pattern of frequent premiums for the same crew or shift is a signal to look at the schedule itself, not just keep paying through it.' },
      { title: 'How this gets documented in the HR Center', type: 'reading', content:
        'The Missed Meal Period generator in Document Generator records the reason work continued through the break, whether a delayed meal period was still given once time allowed, and whether the hour premium was already paid or is still owed. If it\'s still owed, generating the document creates a task assigned to whoever needs to add it to that pay period — so the premium doesn\'t depend on someone remembering. This system does not store the employee\'s actual worked hours or dollar figures; those stay in Aspire and payroll. Be aware of Donohue v. AMN Services (2021): CA courts do not allow neutral time-rounding for meal periods the way they may for other punches — if time records show a shortened or late meal period, it creates a rebuttable presumption of a violation that the employer must affirmatively overcome.' },
      { title: 'Worked example: the paid-through-lunch emergency', type: 'reading', content:
        'Say an irrigation break floods a client\'s yard right at the 5-hour mark for three crew members. There\'s no time to send them to lunch before the flood is contained, so they keep working. Two hours later, once the water\'s shut off, there\'s still 45 minutes left in the shift, so HR sends them to a late lunch. What\'s owed: each employee gets one hour of meal premium pay for the missed on-time meal period, even though they eventually did get a 30-minute meal period later in the shift — because it wasn\'t provided before the end of the 5th hour as the law requires. The late-but-still-taken meal period doesn\'t cancel the premium; it\'s the right thing to do once time allows, and it prevents a second violation (missing the meal period entirely) from stacking on top of the first. Using a hypothetical $22/hour regular rate just for illustration, that\'s $22 per employee, per day — $66 total for the three of them. This is exactly the scenario the Missed Meal Period generator was built to record: reason, whether a delayed meal was still given, and whether the premium is already paid or still owed as a task.' },
      { title: 'Common mistakes that create exposure', type: 'reading', content:

async function loadCourses() {
  const snap = await getDocs(collection(db, 'training_modules'));
  courses = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  await renderLibrary();
}

async function renderLibrary() {
  const rows = await Promise.all(courses.map(async (c) => {
    const compSnap = await getDoc(doc(db, 'training_modules', c.id, 'completions', profile.uid));
    const comp = compSnap.exists() ? compSnap.data() : null;
    const status = comp?.passed ? '<span class="pill ok">Completed</span>' : (comp ? '<span class="pill mid">In progress</span>' : '<span class="pill">Not started</span>');
    return `
      <tr>
        <td class="row-clickable" data-id="${c.id}" style="cursor:pointer"><b>${c.title}</b><div class="dim" style="font-size:12px">${c.description || ''}</div></td>
        <td class="mono dim">${(c.sections || []).length} sections</td>
        <td>${status}</td>
        <td style="text-align:right"><button class="gh delete-course-btn" data-id="${c.id}" data-title="${escapeHtmlAttr(c.title)}" type="button">Delete</button></td>
      </tr>
    `;
  }));
  document.getElementById('course-rows').innerHTML = rows.join('') || '<tr><td colspan="4" class="dim">No courses yet — add one to get started.</td></tr>';
  document.querySelectorAll('#course-rows td.row-clickable').forEach((td) => {
    td.addEventListener('click', () => openCourse(td.dataset.id));
  });
  document.querySelectorAll('.delete-course-btn').forEach((btn) => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const compSnap = await getDocs(collection(db, 'training_modules', btn.dataset.id, 'completions'));
      const warn = compSnap.size
        ? ` ${compSnap.size} staff completion${compSnap.size === 1 ? '' : 's'} exist for this course and will be orphaned.`
        : '';
      if (!window.confirm(`Delete "${btn.dataset.title}"? This can't be undone.${warn}`)) return;
      try {
        await deleteDoc(doc(db, 'training_modules', btn.dataset.id));
        showToast('Course deleted.');
        await loadCourses();
      } catch (err) {
        console.error(err);
        showToast('Could not delete — ' + err.message, 'error');
      }
    });
  });
}

function escapeHtmlAttr(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML.replace(/"/g, '&quot;');
}

async function openCourse(courseId) {
  currentCourse = courses.find((c) => c.id === courseId);
  const compSnap = await getDoc(doc(db, 'training_modules', courseId, 'completions', profile.uid));
  currentCompletion = compSnap.exists() ? compSnap.data() : { attempts: 0, passed: false };
  readSections = new Set(currentCompletion.read_sections || []);

  document.getElementById('library-view').hidden = true;
  document.getElementById('course-view').hidden = false;
  document.getElementById('page-title').textContent = currentCourse.title;
  document.getElementById('course-title').textContent = currentCourse.title;
  document.getElementById('course-desc').textContent = currentCourse.description || '';
  document.getElementById('cert-view').hidden = true;

  if (currentCompletion.passed) {
    showCertificate();
  } else {
    renderSections();
  }
}

document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('library-view').hidden = false;
  document.getElementById('course-view').hidden = true;
  document.getElementById('page-title').textContent = 'Team training';
  loadCourses();
});

// Pulls the video ID out of a youtube.com/watch?v=, youtu.be/, or /embed/
// link so it can be embedded as an actual inline player. Returns null for
// anything else (a channel link, a playlist, a non-YouTube URL) — those
// fall back to a plain "open" link instead of a broken embed.
function youtubeEmbedId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
  return m ? m[1] : null;
}

function renderSections() {
  const sections = currentCourse.sections || [];
  document.getElementById('sections-list').innerHTML = sections.map((s, i) => {
    const unlocked = i === 0 || readSections.has(i - 1);
    const done = readSections.has(i);
    const videoId = s.type === 'video' ? youtubeEmbedId(s.content) : null;
    return `
      <div class="section-item${unlocked ? '' : ' locked'}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <b>${i + 1}. ${s.title}</b>
          <span class="mono dim">${s.type === 'video' ? 'Video' : 'Reading'}</span>
        </div>
        ${unlocked ? (s.type === 'video'
          ? (videoId
            ? `<div style="position:relative;padding-top:56.25%;margin-bottom:8px"><iframe src="https://www.youtube-nocookie.com/embed/${videoId}" title="${escapeHtmlAttr(s.title)}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
               ${s.note ? `<div style="font-size:12.5px;color:var(--muted);margin-bottom:6px">${s.note}</div>` : ''}
               <a href="${s.content}" target="_blank" rel="noopener" class="dim" style="font-size:12px">Open on YouTube →</a>`
            : `<div style="font-size:13px">${s.note ? `<div style="color:var(--muted);margin-bottom:6px">${s.note}</div>` : ''}<a href="${s.content}" target="_blank" rel="noopener">Open video material →</a></div>`)
          : `<div style="white-space:pre-wrap;font-size:13px">${s.content}</div>`)
          : '<div class="dim">Complete the previous section to unlock this one.</div>'}
        ${unlocked && !done ? `<button class="gh solid mark-read-btn" data-i="${i}" type="button" style="margin-top:10px">Mark as read</button>` : ''}
        ${done ? '<span class="pill ok" style="margin-top:8px;display:inline-block">Read</span>' : ''}
      </div>
    `;
  }).join('');

  document.querySelectorAll('.mark-read-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      readSections.add(parseInt(btn.dataset.i, 10));
      await saveProgress();
      renderSections();
    });
  });

  const allRead = sections.length > 0 && sections.every((_, i) => readSections.has(i));
  const testCard = document.getElementById('test-card');
  testCard.hidden = !allRead;
  if (allRead) renderTest();
}

async function saveProgress() {
  await setDoc(doc(db, 'training_modules', currentCourse.id, 'completions', profile.uid), {
    ...currentCompletion,
    read_sections: [...readSections],
    entered_by: profile.uid,
    updated_at: serverTimestamp(),
  }, { merge: true });
}

function renderTest() {
  const questions = currentCourse.test_questions || [];
  document.getElementById('test-body').innerHTML = questions.map((q, qi) => `
    <div class="field">
      <label class="f-lab">${qi + 1}. ${q.question}</label>
      ${q.choices.map((c, ci) => `
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0">
          <input type="radio" name="q${qi}" value="${ci}"> ${c}
        </label>
      `).join('')}
    </div>
  `).join('') + `<button class="gh solid" id="submit-test-btn" type="button">Submit</button>`;

  document.getElementById('submit-test-btn').addEventListener('click', submitTest);
}

async function submitTest() {
  const questions = currentCourse.test_questions || [];
  let correct = 0;
  questions.forEach((q, qi) => {
    const picked = document.querySelector(`input[name="q${qi}"]:checked`);
    if (picked && parseInt(picked.value, 10) === q.correct_index) correct++;
  });

  const passed = correct === questions.length;
  // A failed attempt resets progress — every section has to be re-read
  // before the test can be retaken, not just retaken immediately.
  if (!passed) readSections = new Set();
  const attempts = (currentCompletion.attempts || 0) + 1;
  currentCompletion = {
    ...currentCompletion,
    attempts,
    score: correct,
    total: questions.length,
    passed,
    read_sections: [...readSections],
    entered_by: profile.uid,
    updated_at: serverTimestamp(),
  };
  if (passed) {
    currentCompletion.completed_date = new Date().toISOString().slice(0, 10);
    currentCompletion.certificate_no = 'CERT-' + Date.now().toString(36).toUpperCase();
  }

  try {
    await setDoc(doc(db, 'training_modules', currentCourse.id, 'completions', profile.uid), currentCompletion, { merge: true });
    if (passed) {
      await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(({ collection: c, addDoc: ad, serverTimestamp: st }) =>
        ad(c(db, 'activity'), {
          module: 'training',
          item: `Completed "${currentCourse.title}"`,
          entered_by: profile.uid,
          entered_at: st(),
        })
      );
      showToast(`You got ${correct} of ${questions.length} correct — passed.`);
      showCertificate();
    } else {
      showToast(`You got ${correct} of ${questions.length} correct — not a pass. All sections are locked again — review the material from the start.`, 'error');
      renderSections();
    }
  } catch (err) {
    console.error(err);
    showToast('Could not save — ' + err.message, 'error');
  }
}

function showCertificate() {
  document.getElementById('sections-list').innerHTML = '';
  document.getElementById('test-card').hidden = true;
  document.getElementById('cert-view').hidden = false;
  document.getElementById('cert-name').textContent = profile.name || profile.email;
  document.getElementById('cert-course').textContent = currentCourse.title;
  document.getElementById('cert-meta').textContent =
    `${currentCompletion.certificate_no || ''} · Completed ${formatDate(currentCompletion.completed_date)}`;
}
document.getElementById('print-cert-btn').addEventListener('click', () => window.print());

document.getElementById('load-starter-btn').addEventListener('click', async () => {
  const btn = document.getElementById('load-starter-btn');
  btn.disabled = true;
  try {
    const existingTitles = new Set(courses.map((c) => c.title));
    const toAdd = STARTER_COURSES.filter((c) => !existingTitles.has(c.title));
    if (!toAdd.length) { showToast('Starter courses are already loaded.'); return; }
    for (const course of toAdd) {
      await setDoc(doc(collection(db, 'training_modules')), {
        ...course, entered_by: profile.uid, created_at: serverTimestamp(),
      });
    }
    showToast(`Added ${toAdd.length} starter course${toAdd.length === 1 ? '' : 's'}.`);
    await loadCourses();
  } catch (err) {
    console.error(err);
    showToast('Could not load starter courses — ' + err.message, 'error');
  } finally {
    btn.disabled = false;
  }
});

// ---- add course ----

const overlay = document.getElementById('modal-overlay');
document.getElementById('add-course-btn').addEventListener('click', () => {
  newSections = []; newQuestions = [];
  document.getElementById('new-title').value = '';
  document.getElementById('new-desc').value = '';
  renderNewSections();
  renderNewQuestions();
  overlay.hidden = false;
});
document.getElementById('modal-close').addEventListener('click', () => { overlay.hidden = true; });
document.getElementById('new-course-cancel').addEventListener('click', () => { overlay.hidden = true; });

function renderNewSections() {
  document.getElementById('new-sections').innerHTML = newSections.map((s, i) => `
    <div class="frow" style="margin-bottom:8px">
      <input class="f-in" placeholder="Section title" value="${s.title}" data-i="${i}" data-f="title">
      <select class="f-in" data-i="${i}" data-f="type">
        <option value="reading" ${s.type === 'reading' ? 'selected' : ''}>Reading</option>
        <option value="video" ${s.type === 'video' ? 'selected' : ''}>Video (link)</option>
      </select>
    </div>
    <textarea class="f-in" placeholder="Content or video URL" rows="2" style="resize:vertical;margin-bottom:10px" data-i="${i}" data-f="content">${s.content}</textarea>
  `).join('');
  document.querySelectorAll('#new-sections [data-f]').forEach((el) => {
    el.addEventListener('input', () => { newSections[el.dataset.i][el.dataset.f] = el.value; });
    el.addEventListener('change', () => { newSections[el.dataset.i][el.dataset.f] = el.value; });
  });
}
document.getElementById('add-section-btn').addEventListener('click', () => {
  newSections.push({ title: '', type: 'reading', content: '' });
  renderNewSections();
});

function renderNewQuestions() {
  document.getElementById('new-questions').innerHTML = newQuestions.map((q, qi) => `
    <div class="field">
      <input class="f-in" placeholder="Question" value="${q.question}" data-qi="${qi}" data-f="question" style="margin-bottom:6px">
      ${q.choices.map((c, ci) => `
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">
          <input type="radio" name="correct${qi}" ${q.correct_index === ci ? 'checked' : ''} data-qi="${qi}" data-ci="${ci}" class="correct-radio">
          <input class="f-in" placeholder="Choice ${ci + 1}" value="${c}" data-qi="${qi}" data-ci="${ci}" class="choice-input" style="flex:1">
        </div>
      `).join('')}
    </div>
  `).join('');
  document.querySelectorAll('.choice-input').forEach((el) => {
    el.addEventListener('input', () => { newQuestions[el.dataset.qi].choices[el.dataset.ci] = el.value; });
  });
  document.querySelectorAll('[data-f="question"]').forEach((el) => {
    el.addEventListener('input', () => { newQuestions[el.dataset.qi].question = el.value; });
  });
  document.querySelectorAll('.correct-radio').forEach((el) => {
    el.addEventListener('change', () => { newQuestions[el.dataset.qi].correct_index = parseInt(el.dataset.ci, 10); });
  });
}
document.getElementById('add-question-btn').addEventListener('click', () => {
  newQuestions.push({ question: '', choices: ['', '', '', ''], correct_index: 0 });
  renderNewQuestions();
});

document.getElementById('new-course-save').addEventListener('click', async () => {
  const title = document.getElementById('new-title').value.trim();
  if (!title) { showToast('Title is required.', 'error'); return; }
  try {
    const ref = doc(collection(db, 'training_modules'));
    await setDoc(ref, {
      title,
      description: document.getElementById('new-desc').value.trim(),
      sections: newSections,
      test_questions: newQuestions,
      entered_by: profile.uid,
      created_at: serverTimestamp(),
    });
    overlay.hidden = true;
    showToast('Course added.');
    await loadCourses();
  } catch (err) {
    console.error(err);
    showToast('Could not save — ' + err.message, 'error');
  }
});

// ---- SHRM-CP domain tracker ----

async function loadShrm() {
  const snap = await getDoc(doc(db, 'shrm_progress', profile.uid));
  const values = snap.exists() ? (snap.data().domains || {}) : {};
  document.getElementById('shrm-body').innerHTML = SHRM_DOMAINS.map((d) => `
    <div class="domain-row">
      <div>${d}</div>
      <input type="range" min="0" max="100" value="${values[d] || 0}" class="shrm-slider" data-domain="${d}">
      <div class="mono shrm-value" data-domain-value="${d}">${values[d] || 0}%</div>
    </div>
  `).join('');
  document.querySelectorAll('.shrm-slider').forEach((el) => {
    el.addEventListener('input', () => {
      document.querySelector(`[data-domain-value="${el.dataset.domain}"]`).textContent = el.value + '%';
    });
    el.addEventListener('change', saveShrm);
  });
}

async function saveShrm() {
  const domains = {};
  document.querySelectorAll('.shrm-slider').forEach((el) => { domains[el.dataset.domain] = parseInt(el.value, 10); });
  try {
    await setDoc(doc(db, 'shrm_progress', profile.uid), {
      domains,
      entered_by: profile.uid,
      updated_at: serverTimestamp(),
    }, { merge: true });
  } catch (err) {
    console.error(err);
  }
}

await loadCourses();
await loadShrm();
</script>
